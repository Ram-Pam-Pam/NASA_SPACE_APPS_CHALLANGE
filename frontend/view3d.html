<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corridor Watch · model 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C8F169'/%3E%3Cpath d='M4 21h9l3-3 3 3h9' fill='none' stroke='%230B0C0E' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Same dark theme tokens as index.html, so both views read as one product. */
:root {
  color-scheme: dark;
  --page: #0B0C0E; --surface: #15171A; --text: #F2F3F0; --text-2: #A2A6AC; --border: #2B2E33; --wash: rgba(242,243,240,0.06);
  --accent: #C8F169; --accent-ink: #0B0C0E; --alert: #ff6b4a;
  --font: "Inter", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  --label: 600 11.5px/1.3 var(--font);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
[hidden] { display: none !important; }
button, select, input { font: inherit; }
button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background .15s, border-color .15s; }
button:hover { background: #22252a; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
select { background: var(--page); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; max-width: 100%; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { flex: none; display: flex; gap: 8px 18px; align-items: center; flex-wrap: wrap; min-height: 52px; padding: 8px 20px; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.bar h1 { display: flex; align-items: baseline; gap: 10px; margin: 0; padding-left: 18px; border-left: 1px solid var(--border); font-size: 15px; font-weight: 600; line-height: 1.3; }
.bar h1::before { content: "Model 3D"; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.bar h1:empty { display: none; }
body.flat .bar h1::before { content: "Widok 2D"; }
.bar .sp { flex: 1; }
/* 2D / 3D switch in the header: the same location as a map with the analysis results or as a 3D model */
.dims { display: inline-flex; flex: none; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--page); }
.dims button { border: 0; border-radius: 0; padding: 6px 14px; background: transparent; color: var(--text); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.dims button + button { border-left: 1px solid var(--border); }
.dims button:hover { background: var(--wash); }
.dims button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); cursor: default; }

.loc { display: flex; align-items: center; gap: 10px; min-width: 0; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }

/* Timeline of ground motion (2D view only): play it to see how the ground changed between the measurements. */
#timeline { flex: none; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 8px 20px; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); position: relative; z-index: 15; }
.tl-title { font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.tl-step { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 10px; background: var(--page); }
.tl-step button, .tl-round { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: transparent; }
.tl-round { border: 1px solid var(--border); border-radius: 50%; background: var(--page); }
#tlPlay { width: 38px; height: 38px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tl-step svg, .tl-round svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#tlPlay svg { fill: currentColor; stroke: none; }
.tl-date { min-width: 104px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
#tlTrack { position: relative; flex: 1 1 320px; min-width: 220px; height: 38px; cursor: pointer; touch-action: none; }
#tlTrack::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 4px; border-radius: 2px; background: var(--border); }
#tlFill { position: absolute; left: 0; top: 13px; height: 4px; border-radius: 2px; background: var(--accent); }
.tl-tick { position: absolute; top: 11px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #5b6068; }
.tl-tick.on { background: var(--accent); }
.tl-lbl { position: absolute; top: 22px; transform: translateX(-50%); font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
#tlKnob { position: absolute; top: 7px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(200,241,105,.25); }
.tl-key { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--text-2); }
.tl-key b { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 720px) { .tl-key { flex-basis: 100%; } }

#stage { position: relative; flex: 1; min-height: 0; background: radial-gradient(ellipse at 50% 35%, #1d2733 0%, #0e1218 60%, #0B0C0E 100%); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
#status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text-2); font-size: 15px; z-index: 5; }

/* Labels are HTML placed over the canvas every frame. */
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7); will-change: transform; }
.lbl.place { font-size: 14px; letter-spacing: .01em; }
.lbl.area { color: #ffc266; }
.lbl.biz { font-weight: 500; font-size: 11.5px; color: #e6e8ea; }
.lbl.hazard { padding: 3px 9px; border-radius: 999px; background: rgba(255,107,74,.92); color: #1a0b06; text-shadow: none; font-size: 12.5px; box-shadow: var(--shadow); }
/* Main anomalies of the timeline (2D view): a numbered dot with a pulsing ring, red = sinking, blue = rising */
#marks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; }
.amark { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: auto; cursor: pointer; transition: opacity .4s; }
.amark .dot { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: #fff; font: 700 13px/1 var(--font); border: 2px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.55); }
.amark .ring { pointer-events: none; position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--c); animation: apulse 1.8s ease-out infinite; }
.amark .ring + .ring { animation-delay: .9s; }
.amark.off { opacity: 0; pointer-events: none; }
@keyframes apulse { from { transform: scale(1); opacity: .9; } to { transform: scale(3.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .amark .ring { animation: none; opacity: .5; transform: scale(1.6); } }
.lbl.road { padding: 1px 6px; border-radius: 4px; background: #f2f3f0; color: #15171A; text-shadow: none; font-size: 11px; font-weight: 700; }

.panel { position: absolute; z-index: 10; background: rgba(21,23,26,.9); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
#layers { top: 14px; left: 14px; width: 252px; max-height: calc(100% - 28px); overflow: auto; }
#layers summary { padding: 10px 14px; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
#layers summary::after { content: "▾"; }
#layers:not([open]) summary::after { content: "▸"; }
#layers .body { padding: 2px 14px 14px; display: grid; gap: 9px; }
.row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; cursor: pointer; }
.row .n { margin-left: auto; color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.row.off { color: var(--text-2); cursor: default; }
.sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
.lg-h { margin: 6px 0 0; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.keys { display: grid; gap: 5px; font-size: 12.5px; }
.keys span { display: flex; align-items: center; gap: 8px; }
.keys .sw { height: 5px; width: 20px; border-radius: 3px; }
.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--text-2); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; padding: 4px 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.goto { display: flex; flex-wrap: wrap; gap: 6px; }
.goto button { padding: 4px 10px; font-size: 12.5px; border-radius: 999px; }

#nav { right: 14px; bottom: 14px; padding: 8px; display: grid; grid-template-columns: repeat(3, 38px); gap: 6px; }
#nav button { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
#nav button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#nav button.wide { grid-column: 1 / -1; width: auto; font-size: 12.5px; font-weight: 600; }
#compass { right: 14px; top: 14px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
#compass svg { width: 40px; height: 40px; }
#hint { left: 50%; top: 14px; transform: translateX(-50%); padding: 7px 14px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; pointer-events: none; transition: opacity .6s; }
#src { position: absolute; left: 14px; bottom: 10px; z-index: 9; max-width: calc(100% - 200px); font-size: 11px; line-height: 1.4; color: rgba(162,166,172,.85); pointer-events: none; }
/* Verification signal for a clicked object (results of the InSAR analysis) */
#verify { right: 14px; top: 80px; width: 340px; max-height: calc(100% - 200px); overflow: auto; padding: 14px 16px 14px; z-index: 12; }
body.flat #verify { top: 14px; max-height: calc(100% - 120px); }
#verify .vx { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 16px; line-height: 1; }
#verify h3 { margin: 0 30px 2px 0; font-size: 15px; font-weight: 600; }
#verify .vsub { margin: 0 0 10px; font-size: 12.5px; color: var(--text-2); }
.vsig { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--wash); border-left: 4px solid var(--sig); }
.vsig b { display: block; font-size: 14px; }
.vsig span { font-size: 12.5px; color: var(--text-2); }
.vgrid { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0 0; font-size: 12.5px; }
.vgrid dt { color: var(--text-2); }
.vgrid dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.vh { margin: 14px 0 6px; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.vtrend { font-size: 12.5px; line-height: 1.45; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); }
.vtrend b { font-weight: 600; }
.vnotes { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.45; color: var(--text-2); }
.vnotes li + li { margin-top: 4px; }
.vnext { font-size: 12.5px; line-height: 1.45; }
.vplain { margin: 10px 0 8px; font-size: 14px; line-height: 1.5; }
.vplain b { font-weight: 700; }
.vmore { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.vmore summary { cursor: pointer; font-size: 12.5px; color: var(--text-2); }
.vmore summary:hover { color: var(--text); }
.amark.sel .dot { width: 14px; height: 14px; left: -7px; top: -7px; background: var(--accent); border-color: #0B0C0E; }
.amark.sel .ring { width: 14px; height: 14px; left: -7px; top: -7px; border-color: var(--accent); }
#tip { position: fixed; z-index: 50; pointer-events: none; max-width: 300px; padding: 8px 11px; background: #15171A; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45; display: none; }
#tip b { font-weight: 600; }
#tip .k { color: var(--text-2); }

@media (max-width: 720px) {
  #layers { width: 210px; }
  #hint, #src { display: none; }
  .bar h1 { flex-basis: 100%; order: 1; padding-left: 0; border-left: 0; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#C8F169"/><path d="M4 12c4-5 8 3 12-1s8 3 12-1" fill="none" stroke="#2B2E33" stroke-width="2.2" stroke-linecap="round"/><path d="M4 21h9l3-3 3 3h9" fill="none" stroke="#0B0C0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Corridor Watch</span>
  </div>
  <h1 id="title"></h1>
  <span class="sp"></span>
  <div class="dims" id="dims" role="group" aria-label="Rodzaj widoku" hidden>
    <button id="dim2" aria-pressed="false" title="Widok z góry: płaska mapa tego samego modelu">2D</button>
    <button id="dim3" aria-pressed="false" title="Model 3D terenu i infrastruktury">3D</button>
  </div>
  <label class="loc">Lokalizacja
    <select id="loc" aria-label="Lokalizacja"></select>
  </label>
</header>

<div id="timeline" hidden>
  <span class="tl-title" id="tlTitle">Zmiana terenu</span>
  <div class="tl-step">
    <button id="tlPrev" title="Poprzedni pomiar" aria-label="Poprzedni pomiar"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <span class="tl-date" id="tlDate"></span>
    <button id="tlNext" title="Następny pomiar" aria-label="Następny pomiar"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
  </div>
  <button class="tl-round" id="tlPlay" title="Odtwórz zmiany w czasie" aria-label="Odtwórz"></button>
  <div id="tlTrack" role="slider" tabindex="0" aria-label="Data pomiaru"><div id="tlFill"></div><div id="tlKnob"></div></div>
  <div class="tl-key"><span title="Teren przesunął się od satelity: osiada albo osuwa się po zboczu"><b style="background:rgb(214,39,40)"></b>osiadanie / osuwanie</span><span title="Teren przesunął się w stronę satelity: podnosi się"><b style="background:rgb(31,104,196)"></b>wypiętrzanie</span><span id="tlAno" hidden><b style="background:#fff;border-radius:50%;box-shadow:0 0 0 2px rgb(214,39,40)"></b>główne anomalie</span><span id="tlThr"></span></div>
</div>

<div id="stage">
  <div id="status">Wczytywanie modelu 3D…</div>
  <div id="labels"></div>
  <div id="marks"></div>

  <details class="panel" id="layers" open hidden>
    <summary>Warstwy modelu</summary>
    <div class="body">
      <div id="toggles" style="display:grid;gap:9px"></div>
      <div id="exagWrap" hidden>
        <p class="lg-h">Przewyższenie terenu</p>
        <div class="seg" id="exag" role="group" aria-label="Przewyższenie terenu" style="margin-top:6px"></div>
        <p class="note" id="exagNote" style="margin-top:6px"></p>
      </div>
      <div id="pipeLegend" hidden>
        <p class="lg-h">Rurociągi – co płynie</p>
        <div class="keys" id="pipeKeys" style="margin-top:6px"></div>
        <p class="note" id="pipeNote" style="margin-top:6px"></p>
      </div>
      <div id="gotoWrap" hidden>
        <p class="lg-h">Przejdź do</p>
        <div class="goto" id="goto" style="margin-top:6px"></div>
      </div>
    </div>
  </details>

  <button class="panel" id="compass" title="Ustaw północ u góry" aria-label="Kompas: ustaw północ u góry" hidden>
    <svg viewBox="0 0 40 40" aria-hidden="true"><g id="needle"><path d="M20 4l6 16H14z" fill="#ff6b4a"/><path d="M20 36l6-16H14z" fill="#A2A6AC"/><text x="20" y="16.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15171A" font-family="Inter, sans-serif">N</text></g></svg>
  </button>

  <div class="panel" id="nav" hidden>
    <button id="rotL" title="Obróć w lewo" aria-label="Obróć w lewo"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg></button>
    <button id="tiltBtn" title="Widok z góry / z ukosa" aria-label="Widok z góry lub z ukosa"><svg viewBox="0 0 24 24"><path d="M3 17l9 4 9-4M3 12l9 4 9-4M12 3l9 4-9 4-9-4z"/></svg></button>
    <button id="rotR" title="Obróć w prawo" aria-label="Obróć w prawo"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
    <button id="zoomOut" title="Oddal" aria-label="Oddal"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="home" title="Cały obszar" aria-label="Pokaż cały obszar"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg></button>
    <button id="zoomIn" title="Przybliż" aria-label="Przybliż"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <button id="spin" class="wide" aria-pressed="false">Obracaj model</button>
  </div>

  <aside class="panel" id="verify" hidden aria-live="polite">
    <button class="vx" id="vClose" aria-label="Zamknij" title="Zamknij">×</button>
    <div id="vBody"></div>
  </aside>
  <div class="panel" id="hint" hidden>Przeciągnij – obrót · prawy przycisk lub Shift – przesuwanie · kółko – zoom</div>
  <div id="src"></div>
</div>
<div id="tip"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fail = (msg) => { $('status').hidden = false; $('status').textContent = msg; };
const getJSON = async (url) => { const res = await fetch(url); if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); };

// ----------------------------------------------------------- which location
// Scene packages are listed by the backend (/api/v1/datasets, kind "scene3d"). A location that has a
// 3D model is shown here; locations with only an InSAR package still open in index.html.
const API = window.CW_API || '/api/v1';
let SETS;
try { SETS = await getJSON(`${API}/datasets`); }
catch (err) { fail(`Nie udało się połączyć z serwerem (${err.message}). Czy backend jest uruchomiony?`); throw err; }
const SCENES = SETS.filter((d) => d.kind === 'scene3d');
const OTHERS = SETS.filter((d) => d.kind !== 'scene3d' && !SCENES.some((sc) => sc.id === d.id));
$('loc').innerHTML = SCENES.map((d) => `<option value="scene3d:${esc(d.id)}">${esc(d.name)}</option>`).join('')
  + OTHERS.map((d) => `<option value="insar:${esc(d.id)}">${esc(d.name)} · analiza InSAR</option>`).join('');
const LOC = SCENES.find((d) => d.id === decodeURIComponent(location.hash.slice(1))) || SCENES[0];
if (!LOC) { fail('Brak modelu 3D. Zbuduj go skryptem backend/scripts/build_scene3d.py.'); throw new Error('no scene'); }
$('loc').value = `scene3d:${LOC.id}`;
$('loc').addEventListener('change', (e) => {
  const [kind, id] = e.target.value.split(/:(.*)/);
  // another model keeps the current 2D/3D mode; an address that differs only after "#" does not reload
  // the page by itself, the hashchange listener below does that
  location.href = kind === 'scene3d' ? `view3d.html${FLAT ? '?view=2d' : ''}#${encodeURIComponent(id)}` : `index.html#${encodeURIComponent(id)}`;
});
window.addEventListener('hashchange', () => location.reload());
const BASE = LOC.base_url;
let META;
try { META = await getJSON(BASE + 'meta.json'); }
catch (err) { fail(`Nie udało się wczytać modelu (${err.message}).`); throw err; }

// ---- power network: a violet corridor on the ground (names on hover), pylons, and in 3D sagging wires

    for (const coords of lines(f.geometry)) {

      if (p.kind !== 'line') continue;

// ---- buildings from footprints (small areas): walls from the outline, pitched roof on small ones
const WALLS = [0xece5d3, 0xdcd0bb, 0xcdd6da, 0xe8d5c2, 0xc3ccd0, 0xf2ecdb], ROOFS = [0x8f4b3a, 0x5d646b, 0x75594a, 0x414c57, 0x9b6b50];
const bldB = new Batch(new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: true }), true);
buildings.forEach((f, i) => {
  const p = f.properties, rand = rng(i * 7919 + 13), h = p.height || 4;
  for (const rings of polygons(f.geometry)) {
    const foot = rings[0].slice(0, -1).map((c) => { const [x, z] = toXZ(c); return [x, -z]; });
    if (foot.length < 3) continue;
    const small = (p.area_m2 || 100) < 450, wall = small ? WALLS[Math.floor(rand() * WALLS.length)] : 0xcfd3d6, roofCol = small ? ROOFS[Math.floor(rand() * ROOFS.length)] : 0xaab0b5;
    const base = foot.reduce((sum, [x, north]) => sum + H(x, -north), 0) / foot.length, sunk = FLAT ? 0 : 4;  // walls continue below ground on slopes

    const body = lay(new THREE.ExtrudeGeometry(shapeOf(rings), { depth: (FLAT ? 0.6 : h) + sunk, bevelEnabled: false })).translate(0, base - sunk, 0);
    bldB.add(body, wall, tip, { count: body.groups[0] ? body.groups[0].count : 0, color: roofCol });
    if (!small || FLAT) continue;  // a flat map shows the roof colour on the footprint
    const r = boundingRect(foot), ux = Math.cos(r.ang), uy = Math.sin(r.ang), over = 0.5, rise = Math.min(3.2, r.b * 0.75);
    const at = (su, sv, y) => [r.cx + ux * su * r.a - uy * sv * (r.b + over), y, -(r.cy + uy * su * r.a + ux * sv * (r.b + over))];

// ---- buildings from footprints (a whole city): real outlines, roof colour from the aerial photo, pitched
// roofs on small houses. Merged per area chunk (so the camera can skip chunks it does not see).
if (FP) {
  const { n, start, X, Z, height, pitched, roof, tris, triStart, chunkOf, CH } = FP;
  const members = Array.from({ length: CH * CH }, () => []);
  for (let i = 0; i < n; i++) members[chunkOf[i]].push(i);
  const wallCols = WALLS.map((h) => new THREE.Color(h)), bigWall = [0xd5d7d6, 0xc9cccd, 0xdcd6cb, 0xbfc5c9].map((h) => new THREE.Color(h));
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide });
  const sunk = FLAT ? 0 : 4;
  for (const ids of members) {
    if (!ids.length) continue;
    let nv = 0, ni = 0;
    for (const i of ids) {
      const k = start[i + 1] - start[i], gable = pitched[i] && !FLAT;
      nv += 2 * k + (gable ? 6 : k); ni += 6 * k + (gable ? 18 : triStart[i + 1] - triStart[i]);
    }
    const pos = new Float32Array(nv * 3), col = new Float32Array(nv * 3), idx = new Uint32Array(ni);
    let v = 0, q = 0;
    const put = (x, y, z, cr) => { pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = z; col[v * 3] = cr.r; col[v * 3 + 1] = cr.g; col[v * 3 + 2] = cr.b; return v++; };
    const wc = new THREE.Color(), rc = new THREE.Color();
    for (const i of ids) {
      const s0 = start[i], k = start[i + 1] - s0, rand = rng(i * 7919 + 13);
      let base = 0;
      for (let j = 0; j < k; j++) base += H(X[s0 + j], Z[s0 + j]);
      base /= k;
      const h = FLAT ? 0.6 : height[i], top = base + h, gable = pitched[i] && !FLAT;
      rc.setRGB(roof[i * 3], roof[i * 3 + 1], roof[i * 3 + 2]).multiplyScalar(1.08);
      wc.copy(pitched[i] ? wallCols[Math.floor(rand() * wallCols.length)] : bigWall[Math.floor(rand() * bigWall.length)]);
      // walls: bottom ring + top ring, two triangles per edge
      const b0 = v;
      for (let j = 0; j < k; j++) put(X[s0 + j], base - sunk, Z[s0 + j], wc);
      for (let j = 0; j < k; j++) put(X[s0 + j], top, Z[s0 + j], wc);
      for (let j = 0; j < k; j++) {
        const a = b0 + j, b = b0 + (j + 1) % k, ta = a + k, tb = b + k;
        idx.set([a, b, tb, a, tb, ta], q); q += 6;
      }

        for (let t = triStart[i]; t < triStart[i + 1]; t++) idx[q++] = r0 + tris[t];
        continue;
      }
      // pitched roof over the footprint's smallest rectangle, with a small overhang
      const foot = [];
      for (let j = 0; j < k; j++) foot.push([X[s0 + j], -Z[s0 + j]]);
      const r = boundingRect(foot), ux = Math.cos(r.ang), uy = Math.sin(r.ang), over = 0.5, rise = Math.min(3.2, r.b * 0.75);
      const at = (su, sv, y) => put(r.cx + ux * su * r.a - uy * sv * (r.b + over), y, -(r.cy + uy * su * r.a + ux * sv * (r.b + over)), rc);
      const e11 = at(1, 1, top), e01 = at(-1, 1, top), e10 = at(1, -1, top), e00 = at(-1, -1, top), r1 = at(1, 0, top + rise), r0 = at(-1, 0, top + rise);
      idx.set([e11, e01, r0, e11, r0, r1, e10, r1, r0, e10, r0, e00, e11, r1, e10, e01, e00, r0], q); q += 18;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

          else for (let i = 1; i < sh.length; i++) d = Math.min(d, segDist(x, z, sh[i - 1], sh[i]));
          if (d <= bestD) { bestD = d; best = it; }
        }
      }
    }
    return best && { p: best.p, d: bestD };
  }

  async function load() {
    if (data) return data;
    if (loading) return loading;
    const B = ANALYSIS.base_url, get = (f) => getJSON(B + f).catch(() => null);
    loading = Promise.all(['meta.json', 'buildings_risk.geojson', 'critical.geojson', 'roads_risk.geojson', 'pipelines.geojson', 'timeseries.json'].map(get))
      .then(([meta, bld, crit, roads, pipes, ts]) => {
        let TS = null;
        if (ts && meta?.focus) {
          const bin = atob(ts.b64), u8 = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
          TS = new Int16Array(u8.buffer);
        }
        data = { meta, ts, TS, bld: indexOf(bld?.features, 'poly'), crit: indexOf(crit?.features, 'line'), roads: indexOf(roads?.features, 'line'), pipes: indexOf(pipes?.features, 'line') };
        return data;
      });
    return loading;
  }

  /** Displacement series [mm since the first date] near a point: of the 3 x 3 pixels (100 m each) around
   *  it, the one that moved most - like the classes, which also use the strongest point of an object. */
  function seriesAt(lon, lat) {
    const { meta, ts, TS } = data;
    if (!TS) return null;
    const F = meta.focus, Rm = 6378137, x = (lon * Math.PI / 180) * Rm, y = Rm * Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));
    const col0 = Math.floor((x - F.x0) / F.res), row0 = Math.floor((F.y1 - y) / F.res);
    let best = null, bestAbs = -1;
    for (let row = row0 - 1; row <= row0 + 1; row++) for (let col = col0 - 1; col <= col0 + 1; col++) {
      if (col < 0 || row < 0 || col >= F.w || row >= F.h) continue;
      const out = [];
      for (let e = 0; e < F.epochs; e++) { const v = TS[(row * F.w + col) * F.epochs + e]; out.push(v === ts.nodata ? null : v); }
      const valid = out.filter((v) => v !== null);
      if (valid.length < F.epochs - 3) continue;
      if (Math.abs(valid.at(-1)) > bestAbs) { bestAbs = Math.abs(valid.at(-1)); best = out; }
    }
    return best;
  }

  /** Is the motion a steady trend or concentrated in part of the period (season, one-off)? */
  function trend(series) {
    const dates = data.meta.dates, t = dates.map((d) => (Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)) - Date.UTC(+dates[0].slice(0, 4), +dates[0].slice(4, 6) - 1, +dates[0].slice(6, 8))) / 864e5);
    const pts = series.map((v, i) => [t[i], v]).filter(([, v]) => v !== null);
    const last = pts.at(-1), total = last[1] - pts[0][1], LIM = 20;
    if (Math.abs(total) < LIM) return { kind: 'none', html: `<b>Brak wyraźnego ruchu w tym punkcie</b> – przez cały okres zmiana mniejsza niż ${LIM} mm.` };
    const midT = (pts[0][0] + last[0]) / 2, mid = pts.reduce((a, b) => (Math.abs(b[0] - midT) < Math.abs(a[0] - midT) ? b : a));
    const r1 = ((mid[1] - pts[0][1]) / (mid[0] - pts[0][0])) * 365.25, r2 = ((last[1] - mid[1]) / (last[0] - mid[0])) * 365.25;
    const sign = Math.sign(total);
    let withTrend = 0, steps = 0;
    for (let i = 1; i < pts.length; i++) { const d = pts[i][1] - pts[i - 1][1]; if (Math.abs(d) >= 2) { steps++; if (Math.sign(d) === sign) withTrend++; } }
    const share = steps ? withTrend / steps : 0, halves = `1. połowa okresu: ${signed(Math.round(r1), 'mm/rok')}, 2. połowa: ${signed(Math.round(r2), 'mm/rok')}`;
    if (Math.sign(r1) !== Math.sign(r2) && Math.min(Math.abs(r1), Math.abs(r2)) > 15)
      return { kind: 'reversal', html: `<b>Ruch zmienił kierunek w trakcie okresu</b> (${halves}). Możliwy wpływ sezonowy albo szum – potrzebna dłuższa seria.` };
    if (Math.sign(r1) === Math.sign(r2) && Math.min(Math.abs(r1), Math.abs(r2)) / Math.max(Math.abs(r1), Math.abs(r2)) >= 0.4 && share >= 0.6)
      return { kind: 'steady', html: `<b>Ruch narasta w obu połowach okresu</b> (${halves}; ${Math.round(share * 100)}% kroków w tym samym kierunku). Wygląda na trwały trend – ale okres jest krótszy niż rok.` };
    return { kind: 'uneven', html: `<b>Ruch skupiony w części okresu</b> (${halves}). Może to być wpływ pory deszczowej albo jednorazowe zdarzenie – do potwierdzenia na dłuższej serii.` };
  }

  /** Small chart of the series: value axis on the left, dates below, grey band = change too small to count.
   *  Everything is inside one SVG that scales as a whole (width 100%, height from the aspect ratio). */
  function sparkline(series) {
    const W = 300, Hh = 118, L = 44, Rr = 8, T0 = 8, B = 22, LIM = 20;
    const vals = series.filter((v) => v !== null);
    // range fitted to the data (the grey band always fits), a few round ticks, one unit for all labels
    const lo = Math.min(-LIM * 1.3, ...vals) * 1.1, hi = Math.max(LIM * 1.3, ...vals) * 1.1;
    const nice = (v) => { const e = 10 ** Math.floor(Math.log10(v)), f = v / e; return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * e; };
    const step = nice((hi - lo) / 3), inCm = hi - lo >= 120;
    const X = (i) => L + (i / (series.length - 1)) * (W - L - Rr), Y = (v) => T0 + ((hi - v) / (hi - lo)) * (Hh - T0 - B);
    const end = vals.at(-1), colour = end < -LIM ? 'rgb(214,39,40)' : end > LIM ? 'rgb(31,104,196)' : '#A2A6AC';
    const ticks = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(v);
    const label = (v) => (Math.abs(v) < 1e-6 ? '0' : `${v > 0 ? '+' : '−'}${inCm ? +(Math.abs(v) / 10).toFixed(1) + ' cm' : Math.round(Math.abs(v)) + ' mm'}`);
    const pts = series.map((v, i) => (v === null ? null : [X(i), Y(v)])).filter(Boolean);
    return `<svg viewBox="0 0 ${W} ${Hh}" style="display:block;width:100%;height:auto;margin-top:4px" role="img" aria-label="Przemieszczenie gruntu w czasie" font-family="Inter, sans-serif">
      <rect x="${L}" y="${Y(LIM)}" width="${W - L - Rr}" height="${Y(-LIM) - Y(LIM)}" fill="rgba(242,243,240,.07)"/>
      ${ticks.map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? '#4a4e55' : '#2B2E33'}" stroke-width="1"/>
        <text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="#A2A6AC">${label(v)}</text>`).join('')}
      <polyline points="${pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ')}" fill="none" stroke="${colour}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.3" fill="${colour}"/>`).join('')}
      <text x="${L}" y="${Hh - 6}" font-size="10" fill="#A2A6AC">${dLong(data.meta.dates[0])}</text>
      <text x="${W - Rr}" y="${Hh - 6}" text-anchor="end" font-size="10" fill="#A2A6AC">${dLong(data.meta.dates.at(-1))}</text>
    </svg>
    <p class="vsub" style="margin:2px 0 0;font-size:11.5px">Szare pole: zmiana poniżej ${LIM} mm – za mała, by ją uznać.</p>`;
  }

  const SIGNAL = {
    wysokie: ['#c62a22', 'Silny sygnał ruchu gruntu', 'Priorytet weryfikacji w terenie.'],
    'średnie': ['#e3871f', 'Umiarkowany sygnał ruchu gruntu', 'Do weryfikacji i dalszej obserwacji.'],
    niskie: ['#2f8f57', 'Brak sygnału ponad szum pomiaru', 'Ruch gruntu w granicach dokładności pomiaru.'],
    'brak danych': ['#98a3ab', 'Brak wiarygodnego pomiaru', 'Za mało dobrych pikseli (np. woda, utrata spójności).'],
  };
  const KIND = { building: 'Budynek', road: 'Droga', rail: 'Tory kolejowe', pipe: 'Rurociąg / gazociąg', power: 'Linia energetyczna', ground: 'Teren' };

  async function show(kind, x, z, label) {

    await load();

    const isRail = (p) => String(p.typ).startsWith('kolej'), isPower = (p) => p.typ === 'linia energetyczna';
    const hit = kind === 'building' ? nearest(D.bld, x, z, 12)

    }

    const name = p?.nazwa || (label && !GENERIC.includes(label.toLowerCase()) ? label : '');

    const rows = p ? [

      ['Przemieszczenie w okresie', p.przem_mm != null ? signed(Math.round(p.przem_mm), 'mm') : null],

      ['Okna monitoringu z ruchem', p.okna_ruch != null ? `${p.okna_ruch} z 10${p.okna_ruch >= 2 ? ' (ruch potwierdzony w czasie)' : ''}` : null],
      ['Pewność danych', p.pewnosc || null],
    ].filter(([, v]) => v) : [];
    if (!p && series) rows.push(['Przemieszczenie w okolicy (LOS)', signed(series.filter((v) => v !== null).at(-1), 'mm')]);
    if (p?.typ && kind !== 'building') rows.unshift(['Rodzaj w wynikach', `${p.typ}${p.podtyp && p.podtyp !== '?' ? ' (' + p.podtyp + ')' : ''}`]);
    const period = `${dLong(D.meta.dates[0])} – ${dLong(D.meta.dates.at(-1))}`;
    // ---- plain-language summary first; the technical details stay one click away
    const total = series ? series.filter((v) => v !== null).at(-1) : p?.przem_mm != null ? p.przem_mm : p?.v != null ? Math.round(p.v * 180 / 365.25) : null;
    let level = cls;
    if (!level && series) level = Math.abs(total) >= 50 ? 'wysokie' : Math.abs(total) >= 20 ? 'średnie' : 'niskie';
    const WHERE = { building: 'pod tym budynkiem', road: 'pod tą drogą', rail: 'pod tymi torami', pipe: 'nad tym rurociągiem', power: 'pod tą linią', ground: 'w tym miejscu' }[kind];
    const OF = { building: 'budynku', road: 'drogi', rail: 'torów', pipe: 'rurociągu', power: 'linii' }[kind];
    const PLAIN = {
      wysokie: ['#c62a22', `Grunt ${WHERE} wyraźnie się przesuwa`, 'Warto to sprawdzić na miejscu.'],
      'średnie': ['#e3871f', `Grunt ${WHERE} lekko się przesuwa`, 'Warto to sprawdzić i obserwować.'],
      niskie: ['#2f8f57', `Grunt ${WHERE} jest spokojny`, 'Satelita nie widzi tu istotnego ruchu.'],
      'brak danych': ['#98a3ab', 'Satelita nie zmierzył tu ruchu', 'Nie wiadomo, czy grunt się rusza.'],
    }[level] || ['#5b6068', 'Brak dokładnego pomiaru w tym miejscu', 'Nie wiadomo, czy grunt się rusza.'];
    const cm = (mm) => (Math.abs(mm) >= 10 ? `${(Math.abs(mm) / 10).toLocaleString('pl-PL', { maximumFractionDigits: 0 })} cm` : `${Math.abs(Math.round(mm))} mm`);
    const moved = total != null && Math.abs(total) >= 20
      ? `Od listopada do maja ${total < 0 ? 'obniżył się lub zsunął' : 'podniósł się lub przesunął'} o ok. <b>${cm(total)}</b>.`
      : total != null ? 'Od listopada do maja prawie się nie ruszył.' : '';
    const uneven = /gradient|zróżnicowany/.test(p?.powod || '') && (level === 'wysokie' || level === 'średnie') && kind !== 'ground'
      ? 'Sąsiednie fragmenty gruntu przesuwają się różnie, a to może naprężać obiekt.' : '';
    const steady = { steady: 'Ruch trwał przez całe pół roku – to raczej stały ruch, nie jednorazowy.', uneven: 'Ruch był głównie w części okresu – może to skutek pory deszczowej.',
      reversal: 'Grunt raz szedł w jedną, raz w drugą stronę – może to pora roku albo niedokładność pomiaru.' }[tr?.kind] || '';
    $('vBody').innerHTML = `
      <h3>${esc(KIND[kind] || 'Obiekt')}${name ? ' · ' + esc(name) : ''}</h3>
      <div class="vsig" style="--sig:${PLAIN[0]};margin-top:8px"><div><b>${PLAIN[1]}</b><span>${PLAIN[2]}</span></div></div>
      ${moved || steady || uneven ? `<p class="vplain">${[moved, uneven, steady].filter(Boolean).join(' ')}</p>` : ''}
      ${series ? sparkline(series) : ''}
      <p class="vsub" style="margin:6px 0 0">Pomiar z satelity, ${esc(period)}. Pokazuje ruch gruntu${OF ? `, a nie stan ${OF}` : ''}.</p>
      <details class="vmore"><summary>Szczegóły dla specjalistów</summary>
      ${sig ? `<p class="vsub" style="margin:8px 0 0">Klasa w wynikach: <b>${esc(cls)}</b> – ${esc(sig[1].toLowerCase())}.</p>` : ''}
      ${note ? `<p class="vsub" style="margin:6px 0 0">${esc(note)}</p>` : ''}
      ${p?.powod ? `<p class="vsub" style="margin:6px 0 0">Uzasadnienie z analizy: ${esc(p.powod)}</p>` : ''}
      ${rows.length ? `<dl class="vgrid">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
      ${series ? `<p class="vh">Czy to trwały ruch?</p><p class="vsub" style="margin:0 0 6px">Wykres: piksel (100 m), który w promieniu ok. 150 m ruszył się najbardziej; szare pole = ±20 mm.</p><div class="vtrend">${tr.html}${p?.okna_ruch != null ? `<br>Okna monitoringu z ruchem: ${p.okna_ruch} z 10${p.okna_ruch >= 2 ? ' – ruch powtarza się w czasie.' : ' – ruch nie powtarza się w kolejnych oknach.'}` : ''}</div>` : ''}
      <p class="vh">Jak czytać ten wynik</p>
      <ul class="vnotes">
        <li>Klasa opisuje <b>ruch gruntu pod obiektem</b>, nie stan jego konstrukcji.</li>
        <li>Radar mierzy ruch <b>wzdłuż linii widzenia satelity</b> (LOS, z zachodu, ok. 40° od pionu). Nie podaje pełnego kierunku ani samego ruchu pionowego; ujemne = od satelity.</li>
        <li>Tempo to zmiana z <b>ok. 6 miesięcy</b> przeliczona na rok. Okres obejmuje porę deszczową, więc może zawierać wpływ sezonowy.</li>
      </ul>
      ${level === 'wysokie' || level === 'średnie' ? `<p class="vh">Co sprawdzić</p><p class="vnext">Oględziny na miejscu (pęknięcia, przechyły, nieszczelności), porównanie z pomiarem naziemnym (GNSS, niwelacja) i z wynikiem z drugiej geometrii orbity (wznoszącej).</p>` : ''}

  }

  selEl.innerHTML = '<span class="ring"></span><span class="dot"></span>';

  $('vClose').addEventListener('click', () => { $('verify').hidden = true; selEl.classList.add('off'); selected = null; });

  const GROUPS = [['buildings', 'building'], ['pipes', 'pipe'], ['power', 'power'], ['rail', 'rail'], ['roads', 'road']];
  const clickRay = new THREE.Raycaster();

    click(ev) {

      clickRay.setFromCamera(mouse, camera);

          ['road', nearest(data.roads, point.x, point.z, r)],

    },
    place(w, h) {
      if (!selected) return;
      selected.y = H(selected.x, selected.z);
      v3.copy(selected).project(camera);
      selEl.style.transform = `translate(${((v3.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v3.y) / 2 * h).toFixed(1)}px)`;
    },
  };
})();
// a click (press and release without dragging) on the model asks for the verification signal
let downAt = null;

});
if (verify) { $('hint').textContent += ' · kliknij obiekt – sygnał z analizy'; setTimeout(() => verify.preload(), 1500); }

// ------------------------------------------------------------------- frame
function resize() {

}
new ResizeObserver(resize).observe(stage);
resize();
const v3 = new THREE.Vector3();
function placeLabels() {
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const l of labels) {
    v3.copy(l.pos).project(camera);
    const show = v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05 && camera.position.distanceTo(l.pos) < l.maxDist;
    l.el.style.display = show ? '' : 'none';
    if (show) l.el.style.transform = `translate(-50%, -50%) translate(${((v3.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v3.y) / 2 * h).toFixed(1)}px)`;
  }
}
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

}
$('status').hidden = true;
['layers', 'nav', 'compass', 'hint'].forEach((id) => { $(id).hidden = false; });
$('dim3').setAttribute('aria-pressed', 'true');
if (FLAT) setMode(true, false);
window.__scene3d = { detailTiles: () => detailTiles && detailTiles.count(), scene, camera, controls, flyTo, place, viewNow, groups, renderer, toXZ: (lon, lat) => toXZ([lon, lat]), H, groundDistance };  // handy in the browser console
requestAnimationFrame(frame);
</script>
