<style>
/* Same dark theme tokens as index.html, so both views read as one product. */
:root {
  color-scheme: dark;
  --page: #0B0C0E; --surface: #15171A; --text: #F2F3F0; --text-2: #A2A6AC; --border: #2B2E33; --wash: rgba(242,243,240,0.06);
  --accent: #C8F169; --accent-ink: #0B0C0E; --alert: #ff6b4a;
  --font: "Inter", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  --label: 600 11.5px/1.3 var(--font);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
[hidden] { display: none !important; }
button, select, input { font: inherit; }
button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background .15s, border-color .15s; }
button:hover { background: #22252a; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
select { background: var(--page); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; max-width: 100%; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { flex: none; display: flex; gap: 8px 18px; align-items: center; flex-wrap: wrap; min-height: 52px; padding: 8px 20px; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.bar h1 { display: flex; align-items: baseline; gap: 10px; margin: 0; padding-left: 18px; border-left: 1px solid var(--border); font-size: 15px; font-weight: 600; line-height: 1.3; }
.bar h1::before { content: "Model 3D"; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.bar h1:empty { display: none; }
.bar .sp { flex: 1; }
.loc { display: flex; align-items: center; gap: 10px; min-width: 0; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }

#stage { position: relative; flex: 1; min-height: 0; background: radial-gradient(ellipse at 50% 35%, #1d2733 0%, #0e1218 60%, #0B0C0E 100%); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
#status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text-2); font-size: 15px; z-index: 5; }

/* Labels are HTML placed over the canvas every frame. */
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7); will-change: transform; }
.lbl.place { font-size: 14px; letter-spacing: .01em; }
.lbl.area { color: #ffc266; }
.lbl.biz { font-weight: 500; font-size: 11.5px; color: #e6e8ea; }
.lbl.hazard { padding: 3px 9px; border-radius: 999px; background: rgba(255,107,74,.92); color: #1a0b06; text-shadow: none; font-size: 12.5px; box-shadow: var(--shadow); }
.lbl.road { padding: 1px 6px; border-radius: 4px; background: #f2f3f0; color: #15171A; text-shadow: none; font-size: 11px; font-weight: 700; }

.panel { position: absolute; z-index: 10; background: rgba(21,23,26,.9); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
#layers { top: 14px; left: 14px; width: 252px; max-height: calc(100% - 28px); overflow: auto; }
#layers summary { padding: 10px 14px; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
#layers summary::after { content: "▾"; }
#layers:not([open]) summary::after { content: "▸"; }
#layers .body { padding: 2px 14px 14px; display: grid; gap: 9px; }
.row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; cursor: pointer; }
.row .n { margin-left: auto; color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.row.off { color: var(--text-2); cursor: default; }
.sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
.lg-h { margin: 6px 0 0; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.keys { display: grid; gap: 5px; font-size: 12.5px; }
.keys span { display: flex; align-items: center; gap: 8px; }
.keys .sw { height: 5px; width: 20px; border-radius: 3px; }
.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--text-2); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; padding: 4px 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.goto { display: flex; flex-wrap: wrap; gap: 6px; }
.goto button { padding: 4px 10px; font-size: 12.5px; border-radius: 999px; }

#nav { right: 14px; bottom: 14px; padding: 8px; display: grid; grid-template-columns: repeat(3, 38px); gap: 6px; }
#nav button { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
#nav button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#nav button.wide { grid-column: 1 / -1; width: auto; font-size: 12.5px; font-weight: 600; }
#compass { right: 14px; top: 14px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
#compass svg { width: 40px; height: 40px; }
#hint { left: 50%; top: 14px; transform: translateX(-50%); padding: 7px 14px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; pointer-events: none; transition: opacity .6s; }
#src { position: absolute; left: 14px; bottom: 10px; z-index: 9; max-width: calc(100% - 200px); font-size: 11px; line-height: 1.4; color: rgba(162,166,172,.85); pointer-events: none; }
#tip { position: fixed; z-index: 50; pointer-events: none; max-width: 300px; padding: 8px 11px; background: #15171A; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45; display: none; }
#tip b { font-weight: 600; }
#tip .k { color: var(--text-2); }

@media (max-width: 720px) {
  #layers { width: 210px; }
  #hint, #src { display: none; }
  .bar h1 { flex-basis: 100%; order: 1; padding-left: 0; border-left: 0; }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fail = (msg) => { $('status').hidden = false; $('status').textContent = msg; };
const getJSON = async (url) => { const res = await fetch(url); if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); };

// ----------------------------------------------------------- which location
// Scene packages are listed by the backend (/api/v1/datasets, kind "scene3d"). A location that has a
// 3D model is shown here; locations with only an InSAR package still open in index.html.
const API = window.CW_API || '/api/v1';
let SETS;
try { SETS = await getJSON(`${API}/datasets`); }
catch (err) { fail(`Nie udało się połączyć z serwerem (${err.message}). Czy backend jest uruchomiony?`); throw err; }
const SCENES = SETS.filter((d) => d.kind === 'scene3d');
const OTHERS = SETS.filter((d) => d.kind !== 'scene3d' && !SCENES.some((sc) => sc.id === d.id));
$('loc').innerHTML = SCENES.map((d) => `<option value="scene3d:${esc(d.id)}">${esc(d.name)}</option>`).join('')
  + OTHERS.map((d) => `<option value="insar:${esc(d.id)}">${esc(d.name)} · analiza InSAR</option>`).join('');
const LOC = SCENES.find((d) => d.id === decodeURIComponent(location.hash.slice(1))) || SCENES[0];
if (!LOC) { fail('Brak modelu 3D. Zbuduj go skryptem backend/scripts/build_scene3d.py.'); throw new Error('no scene'); }
$('loc').value = `scene3d:${LOC.id}`;
$('loc').addEventListener('change', (e) => {
  const [kind, id] = e.target.value.split(/:(.*)/);
  if (kind === 'scene3d') { location.hash = id; location.reload(); } else location.href = `index.html#${encodeURIComponent(id)}`;
});
const BASE = LOC.base_url;
let META;
try { META = await getJSON(BASE + 'meta.json'); }
catch (err) { fail(`Nie udało się wczytać modelu (${err.message}).`); throw err; }
$('title').textContent = META.name;
document.title = `${META.name} · model 3D · Corridor Watch`;
$('src').textContent = 'Źródła: ' + (META.sources || []).join(' · ');

// ----------------------------------------------------------------- terrain
// Real lidar heights. Flat areas (a few metres of relief over kilometres) only show their shape
// when the heights are multiplied, so everything is placed at height x EXAG.
const T = META.terrain || null;
let terrainGrid = null;
if (T) {
  try { const res = await fetch(BASE + T.file); if (res.ok) terrainGrid = new Uint16Array(await res.arrayBuffer()); } catch (err) { /* stays flat */ }
  if (terrainGrid && terrainGrid.length !== T.width * T.height) terrainGrid = null;
}
const T_STEP = terrainGrid ? (T.max_m - T.min_m) / 65535 : 0;
let EXAG = terrainGrid ? T.default_exaggeration || 1 : 1;

// ---------------------------------------------------------------- geometry
// Local frame in metres: X east, Y up, Z south; the AOI centre is the origin.
const [W_LON, S_LAT, E_LON, N_LAT] = META.bbox, [SX, SZ] = META.size_m;
const R = Math.max(SX, SZ);
const BIG = R > 12000;                 // city-scale scene: lighter detail, merged and instanced geometry
const K = Math.max(1, R / 5000);       // symbols (pipes, outlines, label heights) grow with the scene so they stay visible
const toXZ = ([lon, lat]) => [((lon - W_LON) / (E_LON - W_LON) - 0.5) * SX, (0.5 - (lat - S_LAT) / (N_LAT - S_LAT)) * SZ];
/** Real height in metres above the lowest point of the area (bilinear on the terrain grid). */
function elevAt(x, z) {
  if (!terrainGrid) return 0;
  const gx = Math.min(Math.max((x / SX + 0.5) * (T.width - 1), 0), T.width - 1.001), gz = Math.min(Math.max((z / SZ + 0.5) * (T.height - 1), 0), T.height - 1.001);
  const x0 = Math.floor(gx), z0 = Math.floor(gz), fx = gx - x0, fz = gz - z0, i = z0 * T.width + x0, g = terrainGrid;
  return ((g[i] * (1 - fx) + g[i + 1] * fx) * (1 - fz) + (g[i + T.width] * (1 - fx) + g[i + T.width + 1] * fx) * fz) * T_STEP;
}
const H = (x, z) => elevAt(x, z) * EXAG;  // height in the model
const STEP = BIG ? 30 : 10;  // spacing of extra points; about one terrain cell
/** Extra points so that a long straight segment follows the ground instead of cutting through it. */
function dense(pts, step = STEP) {
  if (!terrainGrid) return pts;
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step);
    for (let k = 1; k <= n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  return out;
}
const pathLen = (pts) => pts.reduce((s, p, i) => (i ? s + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0), 0);
const lines = (g) => (g.type === 'LineString' ? [g.coordinates] : g.type === 'MultiLineString' ? g.coordinates : []);
const polygons = (g) => (g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : []);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/** Strip along a path. `yAt(t, x, z)` gives the height (t = 0..1 of the length, x/z = centre line), `side` shifts it left/right. */
function ribbon(pts, width, yAt, side = 0) {
  const n = pts.length, pos = new Float32Array(n * 6), idx = [], total = pathLen(pts);
  let run = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, nx = -(b[1] - a[1]) / len, nz = (b[0] - a[0]) / len;
    if (i) run += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const y = yAt(total ? run / total : 0, pts[i][0], pts[i][1]), cx = pts[i][0] + nx * side, cz = pts[i][1] + nz * side;
    pos.set([cx + nx * width / 2, y, cz + nz * width / 2, cx - nx * width / 2, y, cz - nz * width / 2], i * 6);
    if (i < n - 1) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(idx);
  return geo;
}
/** Points every `step` metres along a path: [x, z, heading, t]. */
function walk(pts, step, start = 0) {
  const out = [], total = pathLen(pts);
  let next = start, run = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dz = pts[i][1] - pts[i - 1][1], seg = Math.hypot(dx, dz);
    while (next <= run + seg && seg > 0) { const f = (next - run) / seg; out.push([pts[i - 1][0] + dx * f, pts[i - 1][1] + dz * f, Math.atan2(dz, dx), next / total]); next += step; }
    run += seg;
  }
  return out;
}
/** Smallest rectangle around a footprint (points as [x, north]): centre, long-axis angle, half sizes. */
function boundingRect(pts) {
  let best = null;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length], ang = Math.atan2(q[1] - p[1], q[0] - p[0]), c = Math.cos(ang), s = Math.sin(ang);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [x, y] of pts) { const u = x * c + y * s, v = -x * s + y * c; x0 = Math.min(x0, u); x1 = Math.max(x1, u); y0 = Math.min(y0, v); y1 = Math.max(y1, v); }
    const area = (x1 - x0) * (y1 - y0);
    if (!best || area < best.area) best = { area, ang, mu: (x0 + x1) / 2, mv: (y0 + y1) / 2, a: (x1 - x0) / 2, b: (y1 - y0) / 2 };
  }
  const c = Math.cos(best.ang), s = Math.sin(best.ang), r = { cx: best.mu * c - best.mv * s, cy: best.mu * s + best.mv * c, ang: best.ang, a: best.a, b: best.b };
  if (r.b > r.a) { [r.a, r.b] = [r.b, r.a]; r.ang += Math.PI / 2; }
  return r;
}
function shapeOf(rings) {  // GeoJSON polygon rings -> THREE.Shape in (x, north)
  const ringPts = (ring) => ring.slice(0, -1).map((c) => { const [x, z] = toXZ(c); return new THREE.Vector2(x, -z); });
  const shape = new THREE.Shape(ringPts(rings[0]));
  rings.slice(1).forEach((hole) => shape.holes.push(new THREE.Path(ringPts(hole))));
  return shape;
}
const lay = (geo) => geo.rotateX(-Math.PI / 2);  // (x, north) plane -> ground plane, extrusion -> up
/** Pitched roof 1 x 1 x 1: ridge along X at height 1, eaves at height 0. Scaled per building. */
function gableGeometry() {
  const E = (sx, sz) => [sx * 0.5, 0, sz * 0.5], Rg = (sx) => [sx * 0.5, 1, 0];
  const tri = [E(1, 1), E(-1, 1), Rg(-1), E(1, 1), Rg(-1), Rg(1), E(1, -1), Rg(1), Rg(-1), E(1, -1), Rg(-1), E(-1, -1), E(1, 1), Rg(1), E(1, -1), E(-1, 1), E(-1, -1), Rg(-1)];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(tri.flat(), 3));
  geo.computeVertexNormals();
  return geo;
}

// ------------------------------------------------------------------- scene
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.insertBefore(renderer.domElement, stage.firstChild);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, Math.max(2, R / 3000), R * 8);
scene.add(new THREE.HemisphereLight(0xf2f7ff, 0x6b7a52, 1.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.3);

/** Many small geometries drawn as one mesh (one draw call). Each part keeps its colour and its tooltip. */
class Batch {
  constructor(material, withNormals = false) { this.material = material; this.withNormals = withNormals; this.parts = []; }
  /** `cap` = { count, color }: the first `count` vertices get another colour (the roof of an extruded footprint). */
  add(geo, color, tip = null, cap = null) { this.parts.push({ geo: geo.index ? geo.toNonIndexed() : geo, color, tip, cap }); }
  mesh() {
    if (!this.parts.length) return null;
    const total = this.parts.reduce((s, p) => s + p.geo.attributes.position.count, 0);
    const pos = new Float32Array(total * 3), col = new Float32Array(total * 3), nor = this.withNormals ? new Float32Array(total * 3) : null;
    const ends = [], tips = [], c = new THREE.Color(), c2 = new THREE.Color();
    let o = 0;
    for (const p of this.parts) {
      const n = p.geo.attributes.position.count, capN = p.cap ? p.cap.count : 0;
      pos.set(p.geo.attributes.position.array.subarray(0, n * 3), o * 3);
      if (nor) nor.set(p.geo.attributes.normal.array.subarray(0, n * 3), o * 3);
      c.set(p.color); if (p.cap) c2.set(p.cap.color);
      for (let i = 0; i < n; i++) { const k = i < capN ? c2 : c, j = (o + i) * 3; col[j] = k.r; col[j + 1] = k.g; col[j + 2] = k.b; }
      o += n; ends.push(o / 3); tips.push(p.tip);
      p.geo.dispose();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    if (nor) geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    const mesh = new THREE.Mesh(geo, this.material);
    if (tips.some(Boolean)) {
      mesh.userData.tipAt = (face) => { let lo = 0, hi = ends.length - 1; while (lo < hi) { const mid = (lo + hi) >> 1; if (ends[mid] > face) hi = mid; else lo = mid + 1; } return tips[lo]; };
      pickables.push(mesh);
    }
    return mesh;
  }
}

// Ground: the aerial photo on a slab, like a physical site model.

// The terrain keeps real heights in its geometry and is stretched with scale.y = EXAG. Relief is
// shaded into vertex colours (the photo has no relief shading of its own on flat ground).
const terrain = new THREE.Group();
scene.add(terrain);
const GW = terrainGrid ? T.width : 2, GH = terrainGrid ? T.height : 2;
const groundGeo = lay(new THREE.PlaneGeometry(SX, SZ, GW - 1, GH - 1));  // vertex i = row (north -> south) * GW + column
if (terrainGrid) {
  const pos = groundGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, terrainGrid[i] * T_STEP);
  groundGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pos.count * 3).fill(1), 3));
  // side walls down to the slab, so the model has no gap at its edges
  const wall = [], edge = [];
  for (let c = 0; c < GW; c++) edge.push(c);
  for (let r = 1; r < GH; r++) edge.push(r * GW + GW - 1);
  for (let c = GW - 2; c >= 0; c--) edge.push((GH - 1) * GW + c);
  for (let r = GH - 2; r >= 0; r--) edge.push(r * GW);
  for (let k = 0; k < edge.length - 1; k++) {
    const a = edge[k], b = edge[k + 1], ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a), bx = pos.getX(b), by = pos.getY(b), bz = pos.getZ(b);
    wall.push(ax, ay, az, ax, 0, az, bx, by, bz, bx, by, bz, ax, 0, az, bx, 0, bz);
  }
  const wallGeo = new THREE.BufferGeometry();
  wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wall, 3));
  terrain.add(new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({ color: 0x5a4b3b, side: THREE.DoubleSide })));
}
const ground = new THREE.Mesh(groundGeo, new THREE.MeshBasicMaterial({ ...(photo ? { map: photo } : { color: 0x4f6b3c }), vertexColors: !!terrainGrid }));
terrain.add(ground);
function shadeTerrain() {
  terrain.scale.y = EXAG;
  if (!terrainGrid) return;
  const col = groundGeo.attributes.color, g = terrainGrid, dx = SX / (GW - 1), dz = SZ / (GH - 1), k = T_STEP * EXAG;
  const L = sun.position.clone().normalize();
  for (let r = 0; r < GH; r++) {
    const rn = Math.max(r - 1, 0), rs = Math.min(r + 1, GH - 1);
    for (let c = 0; c < GW; c++) {
      const cw = Math.max(c - 1, 0), ce = Math.min(c + 1, GW - 1), i = r * GW + c;
      const sx = (g[r * GW + ce] - g[r * GW + cw]) * k / ((ce - cw) * dx), sz = (g[rs * GW + c] - g[rn * GW + c]) * k / ((rs - rn) * dz);
      const light = (-sx * L.x + L.y - sz * L.z) / Math.hypot(sx, 1, sz) / L.y;  // 1 on flat ground
      const v = Math.min(1.3, Math.max(0.5, 1 + 0.8 * (light - 1)));
      col.setXYZ(i, v, v, v);
    }
  }
  col.needsUpdate = true;
}

const slab = new THREE.Mesh(new THREE.BoxGeometry(SX, R * 0.012, SZ), new THREE.MeshLambertMaterial({ color: 0x4a3f33 }));

/** How solid the sea sheet is: clear along the shore (the photo shows surf, kelp and harbour basins there)
 *  and nearly opaque in open water, where the aerial photo is only a patchwork of flight strips and sun glint. */
let seaAlphaTex = null;
function seaAlpha() {
  if (seaAlphaTex) return seaAlphaTex;
  const level = (T.sea_level_m - T.min_m) / T_STEP + 0.3 / T_STEP, n = GW * GH, reach = Math.max(2, Math.round(350 / (SX / (GW - 1))));
  let land = new Float32Array(n), tmp = new Float32Array(n);
  for (let i = 0; i < n; i++) land[i] = terrainGrid[i] > level ? 1 : 0;
  const blur = (src, dst, step, count, lines) => {  // running mean along rows (step 1) or columns (step GW)
    for (let l = 0; l < lines; l++) {
      const base = step === 1 ? l * GW : l;
      let sum = 0;
      for (let k = -reach; k <= reach; k++) sum += src[base + Math.min(count - 1, Math.max(0, k)) * step];
      for (let k = 0; k < count; k++) {
        dst[base + k * step] = sum / (2 * reach + 1);
        sum += src[base + Math.min(count - 1, k + reach + 1) * step] - src[base + Math.max(0, k - reach) * step];
      }
    }
  };
  for (let pass = 0; pass < 2; pass++) { blur(land, tmp, 1, GW, GH); blur(tmp, land, GW, GH, GW); }
  const px = new Uint8Array(n * 4);
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) {
    const near = Math.min(1, land[r * GW + c] * 2.2);  // 0 in open water, 1 at the shoreline and on land
    const a = Math.round(255 * (0.3 + 0.65 * (1 - near) ** 1.5)), j = ((GH - 1 - r) * GW + c) * 4;  // texture rows run south -> north
    px[j] = px[j + 1] = px[j + 2] = px[j + 3] = a;
  }
  seaAlphaTex = new THREE.DataTexture(px, GW, GH, THREE.RGBAFormat);
  seaAlphaTex.magFilter = seaAlphaTex.minFilter = THREE.LinearFilter;
  seaAlphaTex.needsUpdate = true;
  return seaAlphaTex;
}

const tipRow = (k, v) => (v || v === 0 ? `<br><span class="k">${k}:</span> ${esc(v)}` : '');
const layerFile = (name) => (META.layers?.[name]?.count ? getJSON(BASE + META.layers[name].file).then((g) => g.features).catch(() => []) : Promise.resolve([]));

const labels = [];
const addLabel = (text, x, z, y, cls, maxDist = Infinity) => {

const centre = (ring) => { const p = ring.map(toXZ); return [p.reduce((s, q) => s + q[0], 0) / p.length, p.reduce((s, q) => s + q[1], 0) / p.length]; };
const spots = [];  // named places for the "go to" buttons
const pipeKinds = new Map();

/** Everything that stands on the ground. Runs again when the exaggeration changes. */
function build() {
for (const g of Object.values(groups)) {
  g.traverse((o) => { if (o.geometry) o.geometry.dispose(); [].concat(o.material || []).forEach((m) => m.dispose()); });
  scene.remove(g);
}
Object.keys(groups).forEach((k) => delete groups[k]);
pickables.length = 0; labels.length = 0; spots.length = 0; pipeKinds.clear();
$('labels').innerHTML = '';
const addBatch = (id, batch) => { const mesh = batch.mesh(); if (mesh) group(id).add(mesh); };

// ---- hazard zones (e.g. an active landslide): outline on the ground + label
const hazardB = new Batch(flat(0xffffff, { vertexColors: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6 }));
for (const f of hazards) {
  for (const rings of polygons(f.geometry)) {
    const ring = dense(rings[0].map(toXZ)), [cx, cz] = centre(rings[0]);
    const size = Math.max(...ring.map(([x, z]) => Math.hypot(x - cx, z - cz)));
    hazardB.add(ribbon([...ring, ring[1]], 3 * K, (t, x, z) => H(x, z) + 1.2 * K), 0xff6b4a, `<b>${esc(f.properties.name || 'Strefa zagrożenia')}</b>${f.properties.note ? '<br>' + esc(f.properties.note) : ''}`);
    if (!spots.some((s) => s.name === f.properties.name)) {
      addLabel(f.properties.name || 'Strefa zagrożenia', cx, cz, H(cx, cz) + 30 * K, 'hazard');
      spots.push({ name: f.properties.name || 'Strefa zagrożenia', x: cx, z: cz, dist: Math.max(900, size * 4) });
    }
  }
}
addBatch('hazards', hazardB);

// ---- water (a sinkhole is the hazard there, so it gets an outline and a label)
const waterB = new Batch(new THREE.MeshPhongMaterial({ vertexColors: true, transparent: true, opacity: 0.76, shininess: 40, specular: 0x24343c, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }), true);
for (const f of water) {
  const hazard = f.properties.kind === 'sinkhole';
  for (const rings of polygons(f.geometry)) {
    if (rings[0].length < 4) continue;
    // one level per water body: the lowest ground along its shore (the terrain is cut to water level there)
    const shore = rings[0].map(toXZ), mid = centre(rings[0]);
    const level = shore.reduce((m, [x, z]) => Math.min(m, elevAt(x, z)), elevAt(mid[0], mid[1])) * EXAG;
    const geo = lay(new THREE.ShapeGeometry(shapeOf(rings))).translate(0, level + 0.15, 0);
    waterB.add(geo, hazard ? 0x1d5068 : 0x3f86a3, `<b>${esc(f.properties.name || (f.properties.kind === 'river' ? 'Rzeka / bayou' : 'Woda'))}</b>${hazard ? '<br>Zapadlisko nad zawaloną komorą solną (od 2012 r.)' : ''}`);
    if (hazard) {
      const outline = new Batch(flat(0xffffff, { vertexColors: true }));
      outline.add(ribbon([...shore, shore[1]], 5, () => level + 0.9), 0xff6b4a);
      addBatch('water', outline);
      addLabel(f.properties.name || 'Zapadlisko', mid[0], mid[1], level + 30, 'hazard');
      spots.push({ name: 'Zapadlisko', x: mid[0], z: mid[1], dist: 900 });
    }
  }
}
addBatch('water', waterB);
if (T && T.sea_level_m != null && terrainGrid) {  // the sea: one sheet at sea level, the land rises through it
  const sea = new THREE.Mesh(lay(new THREE.PlaneGeometry(SX, SZ)), new THREE.MeshBasicMaterial({ color: 0x2f6f96, transparent: true, alphaMap: seaAlpha(), ...OFFSET })  /* unlit: a lit sheet this big shows one huge sun glare */);
  sea.position.y = (T.sea_level_m - T.min_m) * EXAG + 0.25;

// ---- industrial areas: outline + name
const areaB = new Batch(flat(0xffffff, { vertexColors: true, transparent: true, opacity: 0.9 }));
for (const f of areas) {
  for (const rings of polygons(f.geometry)) {
    const ring = dense(rings[0].map(toXZ));
    if (ring.length < 3) continue;
    areaB.add(ribbon([...ring, ring[1]], 4 * Math.sqrt(K), (t, x, z) => H(x, z) + 0.7), 0xffb347, `<b>${esc(f.properties.name || 'Teren przemysłowy')}</b>${tipRow('Operator', f.properties.operator)}`);
    if (f.properties.name) {

// ---- roads: asphalt or gravel strips, a dashed centre line on main roads, arched bridges
const ROAD = { asphalt: 0x3a3d42, gravel: 0xcfc8b8, track: 0xa59474, dash: 0xf2c94c, parapet: 0xd9dcdf };
const ROAD_PL = { motorway: 'Autostrada', trunk: 'Droga ekspresowa', primary: 'Droga główna', secondary: 'Droga drugorzędna', tertiary: 'Droga lokalna',
  residential: 'Ulica osiedlowa', unclassified: 'Droga lokalna', service: 'Droga dojazdowa', track: 'Droga gruntowa' };
const roadB = new Batch(flat(0xffffff, { vertexColors: true })), dashPos = [], refBest = {};
for (const f of roads) {
  const p = f.properties, main = ['motorway', 'trunk', 'primary', 'secondary'].includes(p.kind);
  if (p.tunnel) continue;
  const color = p.kind === 'track' ? ROAD.track : p.kind === 'service' ? ROAD.gravel : ROAD.asphalt;
  const tip = `<b>${esc(p.name || ROAD_PL[p.kind] || 'Droga')}</b>${p.ref ? ' · ' + esc(p.ref) : ''}${p.name ? '<br>' + esc(ROAD_PL[p.kind] || '') : ''}${p.bridge ? '<br>most' : ''}`;
  for (const coords of lines(f.geometry)) {
    const pts = dense(coords.map(toXZ)), len = pathLen(pts);
    if (pts.length < 2) continue;
    // a bridge spans from bank to bank with a slight arch; a road lies on the ground
    const y0 = H(...pts[0]), y1 = H(...pts.at(-1));
    const yAt = p.bridge ? (t) => y0 + (y1 - y0) * t + 0.6 + Math.min(4, len * 0.06) * Math.sin(Math.PI * t) : (t, x, z) => H(x, z) + 0.6;
    roadB.add(ribbon(pts, p.width_m || 4, yAt), color, tip);
    if (p.bridge && !BIG) [-1, 1].forEach((s) => roadB.add(ribbon(pts, 0.3, (t, x, z) => yAt(t, x, z) + 0.55, s * (p.width_m || 4) / 2), ROAD.parapet));
    if (main && !BIG) for (const [x, z, h, t] of walk(pts, 14, 4)) {  // 7 m dash, 7 m gap
      const y = yAt(t, x, z) + 0.15, c = Math.cos(h) * 3.5, s = Math.sin(h) * 3.5, nx = -Math.sin(h) * 0.22, nz = Math.cos(h) * 0.22;
      dashPos.push(x - c + nx, y, z - s + nz, x - c - nx, y, z - s - nz, x + c + nx, y, z + s + nz, x - c - nx, y, z - s - nz, x + c - nx, y, z + s - nz, x + c + nx, y, z + s + nz);
    }
    const ref = p.ref && (!BIG || ['motorway', 'trunk', 'primary'].includes(p.kind)) ? p.ref.split(';')[0] : null;
    if (ref && len > 0) { const best = refBest[ref] || (refBest[ref] = { len: 0, total: 0 }); best.total += len; if (len > best.len) { const [x, z] = walk(pts, len / 2, len / 2)[0] || pts[0]; Object.assign(best, { len, x, z }); } }
  }
}
if (dashPos.length) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(dashPos, 3));
  roadB.add(geo, ROAD.dash);
}
addBatch('roads', roadB);
Object.entries(refBest).sort((a, b) => b[1].total - a[1].total).slice(0, BIG ? 10 : 99).forEach(([ref, r]) => addLabel(ref, r.x, r.z, H(r.x, r.z) + 14 * K, 'road'));

// ---- rail: ballast, sleepers, two rails
if (rail.length) {
  const railB = new Batch(flat(0xffffff, { vertexColors: true })), sleepers = [], tracks = [];
  for (const f of rail) {
    const p = f.properties, dead = ['disused', 'abandoned'].includes(p.kind);
    if (p.tunnel) continue;
    for (const coords of lines(f.geometry)) {
      const pts = dense(coords.map(toXZ));
      if (pts.length < 2) continue;
      railB.add(ribbon(pts, 3.4, (t, x, z) => H(x, z) + 0.5), dead ? 0x6d6a5f : 0x7a7068, `<b>${esc(p.name || 'Tory kolejowe')}</b>${dead ? '<br>nieczynne' : ''}${tipRow('Operator', p.operator)}`);
      [-0.72, 0.72].forEach((s) => railB.add(ribbon(pts, 0.16, (t, x, z) => H(x, z) + 0.9, s), dead ? 0x8a6a55 : 0xd5dade));
      tracks.push(pts);
    }
  }
  addBatch('rail', railB);
  const total = tracks.reduce((s, pts) => s + pathLen(pts), 0);
  if (total / 1.3 < 60000) {  // sleepers only where their number stays reasonable
    tracks.forEach((pts) => sleepers.push(...walk(pts, 1.3, 0.6)));
    const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.26, 0.18, 2.6), lit(0x5a4636), sleepers.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), one = new THREE.Vector3(1, 1, 1);
    sleepers.forEach(([x, z, h], i) => mesh.setMatrixAt(i, m.compose(new THREE.Vector3(x, H(x, z) + 0.68, z), q.setFromAxisAngle(up, -h), one)));
    group('rail').add(mesh);
  }
}

  ethylene: ['Etylen', 0xc86be0], ammonia: ['Amoniak', 0x3fd0de], oil: ['Ropa', 0x8d5a3b], water: ['Woda / solanka', 0x4aa3e0], brine: ['Woda / solanka', 0x4aa3e0],

// ---- buildings from footprints (small areas): walls from the outline, pitched roof on small ones
const WALLS = [0xece5d3, 0xdcd0bb, 0xcdd6da, 0xe8d5c2, 0xc3ccd0, 0xf2ecdb], ROOFS = [0x8f4b3a, 0x5d646b, 0x75594a, 0x414c57, 0x9b6b50];
const bldB = new Batch(new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: true }), true);
buildings.forEach((f, i) => {
  const p = f.properties, rand = rng(i * 7919 + 13), h = p.height || 4;
  for (const rings of polygons(f.geometry)) {
    const foot = rings[0].slice(0, -1).map((c) => { const [x, z] = toXZ(c); return [x, -z]; });
    if (foot.length < 3) continue;
    const small = (p.area_m2 || 100) < 450, wall = small ? WALLS[Math.floor(rand() * WALLS.length)] : 0xcfd3d6, roofCol = small ? ROOFS[Math.floor(rand() * ROOFS.length)] : 0xaab0b5;
    const base = foot.reduce((sum, [x, north]) => sum + H(x, -north), 0) / foot.length, sunk = 4;  // walls continue below ground on slopes
    const tip = `<b>${esc(p.name || 'Budynek')}</b>${tipRow('Powierzchnia', p.area_m2 ? p.area_m2 + ' m²' : '')}${tipRow('Wysokość w modelu', h + ' m')}${tipRow('Źródło', [p.source, p.source_version].filter(Boolean).join(', '))}`;
    const body = lay(new THREE.ExtrudeGeometry(shapeOf(rings), { depth: h + sunk, bevelEnabled: false })).translate(0, base - sunk, 0);
    bldB.add(body, wall, tip, { count: body.groups[0] ? body.groups[0].count : 0, color: roofCol });
    if (!small) continue;
    const r = boundingRect(foot), ux = Math.cos(r.ang), uy = Math.sin(r.ang), over = 0.5, rise = Math.min(3.2, r.b * 0.75);
    const at = (su, sv, y) => [r.cx + ux * su * r.a - uy * sv * (r.b + over), y, -(r.cy + uy * su * r.a + ux * sv * (r.b + over))];
    const E = (su, sv) => at(su, sv, base + h), Rg = (su) => at(su, 0, base + h + rise);
    const tri = [E(1, 1), E(-1, 1), Rg(-1), E(1, 1), Rg(-1), Rg(1), E(1, -1), Rg(1), Rg(-1), E(1, -1), Rg(-1), E(-1, -1), E(1, 1), Rg(1), E(1, -1), E(-1, 1), E(-1, -1), Rg(-1)];
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(tri.flat(), 3));
    geo.computeVertexNormals();
    bldB.add(geo, roofCol, tip);
  }
});

// ---- buildings as oriented boxes (a whole city): one instanced mesh for walls, one per roof type
if (bldBuf) {
  const n = META.buildings_bin.count, u16 = new Uint16Array(bldBuf, 0, 4 * n), u8 = new Uint8Array(bldBuf, 8 * n, 3 * n);
  let small = 0;
  for (let i = 0; i < n; i++) if (!u8[2 * n + i]) small++;
  const mat = () => new THREE.MeshLambertMaterial({ flatShading: true, side: THREE.DoubleSide });
  const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat(), n);
  const gables = new THREE.InstancedMesh(gableGeometry(), mat(), small), slabs = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat(), n - small);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), v = new THREE.Vector3(), sc = new THREE.Vector3(), col = new THREE.Color(), rand = rng(11);
  const wallCols = WALLS.map((c) => new THREE.Color(c)), roofCols = ROOFS.map((c) => new THREE.Color(c)), bigWall = new THREE.Color(0xcfd3d6), bigRoof = new THREE.Color(0xaab0b5);
  let ig = 0, is = 0;
  const sunk = 5;  // walls continue below ground on slopes
  for (let i = 0; i < n; i++) {
    const x = (u16[i] / 65535 - 0.5) * SX, z = (u16[n + i] / 65535 - 0.5) * SZ, len = u16[2 * n + i] / 5, wid = u16[3 * n + i] / 5;  // stored as half sizes in dm
    const h = u8[n + i] / 2, flatRoof = u8[2 * n + i], base = H(x, z);
    q.setFromAxisAngle(up, (u8[i] / 255) * Math.PI);
    walls.setMatrixAt(i, m.compose(v.set(x, base + (h - sunk) / 2, z), q, sc.set(len, h + sunk, wid)));
    walls.setColorAt(i, flatRoof ? bigWall : wallCols[Math.floor(rand() * wallCols.length)]);
    if (flatRoof) { slabs.setMatrixAt(is, m.compose(v.set(x, base + h + 0.2, z), q, sc.set(len + 0.4, 0.4, wid + 0.4))); slabs.setColorAt(is++, bigRoof); }
    else { gables.setMatrixAt(ig, m.compose(v.set(x, base + h, z), q, sc.set(len, Math.min(3.2, wid * 0.38), wid + 1))); gables.setColorAt(ig++, col.copy(roofCols[Math.floor(rand() * roofCols.length)])); }
  }
  [walls, gables, slabs].forEach((mesh) => { if (mesh.count) { mesh.instanceColor.needsUpdate = true; mesh.frustumCulled = false; group('buildings').add(mesh); } });
}

// ---- trees: two low-poly crown shapes, coloured from the aerial photo
if (treeBuf) {
  const n = META.trees.count, u16 = new Uint16Array(treeBuf, 0, 2 * n), u8 = new Uint8Array(treeBuf, 4 * n, 5 * n);
  const kinds = [new THREE.IcosahedronGeometry(1, 0), new THREE.ConeGeometry(1, 2, 6, 1)], count = [0, 0];
  for (let i = 0; i < n; i++) count[u8[4 * n + i] ? 1 : 0]++;
  const meshes = kinds.map((geo, k) => new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ flatShading: true }), count[k]));
  const seaElev = T && T.sea_level_m != null && terrainGrid ? T.sea_level_m - T.min_m : null;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), col = new THREE.Color(), at = [0, 0], rand = rng(7);
  for (let i = 0; i < n; i++) {
    const k = u8[4 * n + i] ? 1 : 0, h = u8[i] / 10, x = (u16[i] / 65535 - 0.5) * SX, z = (u16[n + i] / 65535 - 0.5) * SZ;
    const wet = seaElev != null && elevAt(x, z) <= seaElev + 0.4;  // kelp near the shore looks like canopy in the photo
    const rad = wet ? 0 : h * (k ? 0.2 : 0.33), half = h * (k ? 0.43 : 0.45);  // crown reaches from near the ground to the top
    m.compose(new THREE.Vector3(x, H(x, z) + h - half, z), q.setFromAxisAngle(up, rand() * Math.PI * 2), new THREE.Vector3(rad, half, rad));
    meshes[k].setMatrixAt(at[k], m);
    meshes[k].setColorAt(at[k]++, col.setRGB(u8[n + i] / 255, u8[2 * n + i] / 255, u8[3 * n + i] / 255, THREE.SRGBColorSpace));
  }
  meshes.forEach((mesh) => { if (mesh.count) { mesh.instanceColor.needsUpdate = true; mesh.frustumCulled = false; group('trees').add(mesh); } });
}

// ---- points: place names, businesses (visible from close up), masts
const MAIN_PLACES = ['city', 'town'];
let masts = 0;
for (const f of places) {
  const p = f.properties, [x, z] = toXZ(f.geometry.coordinates);
  const y = H(x, z);
  if (p.kind === 'place') {
    addLabel(p.name, x, z, y + 40 * K, 'place', !BIG || MAIN_PLACES.includes(p.place) ? Infinity : R * 0.8);
    if (!BIG || MAIN_PLACES.includes(p.place)) spots.push({ name: p.name, x, z, dist: 700 * K });
  } else if (p.kind === 'business') addLabel(p.name, x, z, y + 14, 'biz', 1500);
  else if (p.kind === 'mast' && masts++ < 150) {
    const height = p.height || (BIG ? 45 : 90), bands = 6;
    for (let b = 0; b < bands; b++) bldB.add(new THREE.CylinderGeometry(0.9, 0.9, height / bands, 6).translate(x, y + (b + 0.5) * height / bands, z), b % 2 ? 0xf2f2f2 : 0xd8392b, `<b>${esc(p.name || 'Maszt telekomunikacyjny')}</b>`);
  }
}
addBatch('buildings', bldB);
spots.splice(8);

document.querySelectorAll('#toggles [data-layer]').forEach((box) => {  // keep switched-off layers off
  if (groups[box.dataset.layer]) groups[box.dataset.layer].visible = box.checked;
});
dirty = true;
}
build();
if (BIG && spots.length && hazards.length) {  // a big area with one hot spot: open on it, not on the whole box (often mostly sea)
  HOME.target.set(spots[0].x, 0, spots[0].z);
  HOME.dist = R * 0.62;
  place(HOME);
}

// ------------------------------------------------------------- layer panel
const hasSinkhole = water.some((f) => f.properties.kind === 'sinkhole');
const LAYERS = [  // id, name, count, colour, switched on at start, optional (hidden when the data set has none)
  ['hazards', 'Strefa zagrożenia', hazards.length, '#ff6b4a', true, true],
  ['buildings', 'Budynki', buildings.length || META.buildings_bin?.count || 0, '#ece5d3', true], ['roads', 'Drogi', roads.length, '#3a3d42', true],
  ['rail', 'Tory kolejowe', rail.length, '#d5dade', true], ['pipes', 'Rurociągi i gazociągi', pipes.length, '#f2c230', true],
  ['water', hasSinkhole ? 'Woda i zapadlisko' : 'Woda', water.length + (T?.sea_level_m != null ? 1 : 0), '#3f86a3', true],
  ['trees', BIG ? 'Drzewa' : 'Las (drzewa)', META.trees?.count || 0, '#3f7a35', true], ['areas', 'Tereny przemysłowe', areas.length, '#ffb347', !BIG],
  ['labels', 'Etykiety', labels.length, '#f2f3f0', true],
].filter(([, , n, , , optional]) => n || !optional);
$('toggles').innerHTML = LAYERS.map(([id, name, n, color, on]) => n
  ? `<label class="row"><input type="checkbox" data-layer="${id}" ${on ? 'checked' : ''}><span class="sw" style="background:${color}"></span>${name}<span class="n">${n.toLocaleString('pl-PL')}</span></label>`
  : `<span class="row off" title="Brak takich obiektów w źródłach dla tego obszaru"><input type="checkbox" disabled><span class="sw" style="background:${color};opacity:.4"></span>${name}<span class="n">brak</span></span>`).join('');
function applyLayer(id, on) {
  if (id === 'labels') $('labels').hidden = !on;
  else if (groups[id]) groups[id].visible = on;
  dirty = true;
}
$('toggles').addEventListener('change', (e) => applyLayer(e.target.dataset.layer, e.target.checked));
LAYERS.forEach(([id, , n, , on]) => { if (n && !on) applyLayer(id, false); });
if (terrainGrid) {
  const steps = T.exaggerations || [1, 5, 15, 30];
  $('exagWrap').hidden = false;
  $('exag').innerHTML = steps.map((v) => `<button data-x="${v}" aria-pressed="${v === EXAG}">×${v}</button>`).join('');
  const span = T.max_m - T.min_m;
  const note = () => { $('exagNote').textContent = `Prawdziwa różnica wysokości w tym obszarze to ${span < 20 ? span.toFixed(1).replace('.', ',') : Math.round(span)} m. ${EXAG > 1 ? `Wysokości terenu pomnożono ×${EXAG}, żeby rzeźbę było widać.` : 'Teren w prawdziwej skali.'}`; };
  note();
  $('exag').addEventListener('click', (e) => {
    const v = +e.target.dataset.x;
    if (!v || v === EXAG) return;
    EXAG = v;
    $('exag').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.x === v)));
    note(); shadeTerrain(); build();
    controls.target.y = H(controls.target.x, controls.target.z); controls.update();
  });
}
if (pipeKinds.size) {  // only when the data says what the pipelines carry
  $('pipeLegend').hidden = false;
  $('pipeNote').textContent = 'Biegną pod ziemią. W modelu leżą na powierzchni i są pogrubione, żeby było je widać.';
  $('pipeKeys').innerHTML = [...pipeKinds].map(([k, v]) => `<span><span class="sw" style="background:#${v.color.toString(16).padStart(6, '0')}"></span>${esc(k)} (${v.n})</span>`).join('');
}
if (spots.length) {
  $('gotoWrap').hidden = false;
  $('goto').innerHTML = spots.map((s, i) => `<button data-spot="${i}">${esc(s.name)}</button>`).join('');
  $('goto').addEventListener('click', (e) => {
    const s = spots[e.target.dataset.spot];
    if (s) flyTo({ target: new THREE.Vector3(s.x, 0, s.z), dist: s.dist, polar: THREE.MathUtils.degToRad(58) }, 1400);
  });
}

// ----------------------------------------------------------------- controls
const stopSpin = () => { controls.autoRotate = false; $('spin').setAttribute('aria-pressed', 'false'); };
$('rotL').addEventListener('click', () => { stopSpin(); flyTo({ az: viewNow().az - Math.PI / 4 }, 500); });
$('rotR').addEventListener('click', () => { stopSpin(); flyTo({ az: viewNow().az + Math.PI / 4 }, 500); });
$('zoomIn').addEventListener('click', () => flyTo({ dist: Math.max(controls.minDistance, viewNow().dist * 0.6) }, 400));
$('zoomOut').addEventListener('click', () => flyTo({ dist: Math.min(controls.maxDistance, viewNow().dist * 1.6) }, 400));
$('home').addEventListener('click', () => { stopSpin(); flyTo(HOME); });
$('tiltBtn').addEventListener('click', () => flyTo({ polar: viewNow().polar < THREE.MathUtils.degToRad(20) ? HOME.polar : 0.01 }, 700));
$('compass').addEventListener('click', () => { stopSpin(); flyTo({ az: 0 }, 600); });
$('spin').addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  $('spin').setAttribute('aria-pressed', String(controls.autoRotate));
});
window.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, button')) return;
  const v = viewNow(), step = THREE.MathUtils.degToRad(15);
  const to = { ArrowLeft: { az: v.az - step }, ArrowRight: { az: v.az + step }, ArrowUp: { polar: Math.max(0.01, v.polar - step / 2) },
    ArrowDown: { polar: Math.min(controls.maxPolarAngle, v.polar + step / 2) }, '+': { dist: v.dist * 0.8 }, '=': { dist: v.dist * 0.8 }, '-': { dist: v.dist * 1.25 } }[e.key];
  if (to) { e.preventDefault(); flyTo(to, 250); }
});
renderer.domElement.addEventListener('pointerdown', () => { flight = null; $('hint').style.opacity = 0; hideTip(); dragging = true; });
window.addEventListener('pointerup', () => { dragging = false; });

// Tooltip: what is under the cursor. In a big scene the test is costly, so it waits until the pointer rests.
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let dragging = false, hoverAt = null, hoverTime = 0;
const hideTip = () => { $('tip').style.display = 'none'; };
renderer.domElement.addEventListener('pointermove', (e) => { hoverAt = dragging ? null : e; hoverTime = performance.now(); });
renderer.domElement.addEventListener('pointerleave', () => { hoverAt = null; hideTip(); });
function pick() {
  const e = hoverAt; hoverAt = null;
  const box = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - box.left) / box.width) * 2 - 1, -((e.clientY - box.top) / box.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables.filter((o) => o.parent && o.parent.visible), false)[0];
  const html = hit && (hit.object.userData.tipAt ? hit.object.userData.tipAt(hit.faceIndex) : hit.object.userData.tip);
  if (!html) return hideTip();
  const tip = $('tip');
  tip.innerHTML = html; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8) + 'px';
}

// ------------------------------------------------------------------- frame
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  dirty = true;
}
new ResizeObserver(resize).observe(stage);
resize();
const v3 = new THREE.Vector3();
function placeLabels() {
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const l of labels) {
    v3.copy(l.pos).project(camera);
    const show = v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05 && camera.position.distanceTo(l.pos) < l.maxDist;
    l.el.style.display = show ? '' : 'none';
    if (show) l.el.style.transform = `translate(-50%, -50%) translate(${((v3.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v3.y) / 2 * h).toFixed(1)}px)`;
  }
}
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
function frame(now) {
  requestAnimationFrame(frame);
  if (flight) {
    const k = Math.min(1, (now - flight.t0) / flight.ms), e = ease(k), { from, to } = flight, mix = THREE.MathUtils.lerp;
    place({ az: mix(from.az, to.az, e), polar: mix(from.polar, to.polar, e), dist: mix(from.dist, to.dist, e), target: from.target.clone().lerp(to.target, e) });
    if (k >= 1) flight = null;
    dirty = true;
  } else controls.update();  // damping and auto-rotation; fires 'change' when the camera moved
  if (hoverAt && now - hoverTime > (BIG ? 90 : 0)) pick();
  if (!dirty) return;
  dirty = false;
  $('needle').setAttribute('transform', `rotate(${THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(1)} 20 20)`);
  renderer.render(scene, camera);
  placeLabels();
}
$('status').hidden = true;
['layers', 'nav', 'compass', 'hint'].forEach((id) => { $(id).hidden = false; });
window.__scene3d = { scene, camera, controls, flyTo, place, viewNow, groups, renderer };  // handy in the browser console
requestAnimationFrame(frame);
</script>
</body>
</html>
