<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corridor Watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23184f95'/%3E%3Cpath d='M4 21h9l3-3 3 3h9' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.045);
  --accent: #184f95; --accent-ink: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --alert: #d03b3b; --alert-wash: rgba(208,59,59,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --accent: #86b6ef; --accent-ink: #0b0b0b;
    --s1: #3987e5; --s2: #d95926; --alert: #e66767; --alert-wash: rgba(230,103,103,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --accent: #86b6ef; --accent-ink: #0b0b0b;
  --s1: #3987e5; --s2: #d95926; --alert: #e66767; --alert-wash: rgba(230,103,103,0.14);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* Full-screen app layout: fixed top panel + map filling the rest of the window (no page scroll) */
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; overflow: hidden; }
[hidden] { display: none !important; }
button, select, input { font: inherit; }
button { background: var(--surface); color: var(--text); border: 1px solid var(--axis); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { background: var(--wash); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
select { background: var(--surface); color: var(--text); border: 1px solid var(--axis); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.small { font-size: 13px; color: var(--text-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }

.topbar { flex: none; position: relative; z-index: 1200; background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.bar { display: flex; gap: 8px 18px; align-items: center; flex-wrap: wrap; padding: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; white-space: nowrap; }
.brand svg { width: 30px; height: 30px; flex: none; }
.bar h1 { font-size: 20px; font-weight: 500; line-height: 1.2; margin: 0; padding-left: 18px; border-left: 1px solid var(--grid); }
.bar .sp { flex: 1; }
.loc { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); min-width: 0; }
.loc select { min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 7px 12px; border-right: 1px solid var(--axis); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }


#app { flex: 1; position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: #2b2b2b; z-index: 0; }
.leaflet-image-layer.pix { image-rendering: pixelated; }
/* Anomaly pins: one colour + icon per anomaly type (landslide, subsidence, uplift, ...) */
.pin { display: block; width: 36px; height: 44px; transform-origin: 50% 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); cursor: pointer;
  animation: pin-in .45s cubic-bezier(.2, 1.5, .4, 1) both; transition: transform .15s ease; }
.pin:hover { transform: scale(1.12); }
.pin svg { display: block; width: 100%; height: 100%; }
@keyframes pin-in { from { transform: translateY(-14px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
/* Anomaly detected for the first time on the selected date: pulsing ring at the point of strongest movement */
.zone-icon .pin-ring { display: none; position: absolute; left: 18px; top: 43px; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.45); pointer-events: none; }
.zone-icon .pin-ring::before, .zone-icon .pin-ring::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid #fff;
  filter: drop-shadow(0 0 1px rgba(0,0,0,.9)); animation: new-ping 1.8s ease-out infinite; }
.zone-icon .pin-ring::after { animation-delay: .9s; }
.zone-icon.is-new .pin-ring { display: block; }
.zone-icon.is-new .pin svg { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 1px #fff); }
@keyframes new-ping { from { transform: scale(1); opacity: .95; } to { transform: scale(3.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .zone-icon .pin-ring::before { animation: none; transform: scale(2); opacity: .8; } .zone-icon .pin-ring::after { display: none; } }
/* Legend sample of the "new anomaly" mark */
.new-mark { position: relative; display: inline-block; width: 10px; height: 10px; margin: 0 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.55), 0 0 0 5px rgba(0,0,0,.35); vertical-align: -1px; }
/* Case-study side panel: result views (risk / zones / phase), legend, quality filter, read-out */
.side { position: absolute; z-index: 1000; top: 10px; right: 10px; bottom: 34px; width: 360px; display: flex; flex-direction: column; overflow: hidden;
  background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: blur(6px); box-shadow: 0 4px 18px rgba(0,0,0,.3); }
.side-tabs { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 4px; padding: 8px; border-bottom: 1px solid var(--grid); flex: none; }
/* collapsed: only the view buttons and "Szczegóły" stay on the map */
.side.collapsed { bottom: auto; }
.side.collapsed .side-tabs { border-bottom: 0; }
.side.collapsed .side-body { display: none; }
.side-toggle, .lg-toggle { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-weight: 600; }
.side-toggle svg, .lg-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
.side-toggle[aria-expanded="true"] svg, .lg-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.side-tabs .side-toggle { padding: 7px 8px; background: var(--wash); }
.lg-toggle { align-self: flex-start; border: 0; background: transparent; padding: 0; font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }
.lg-toggle:hover { background: transparent; color: var(--text); }
.under.legend-card.collapsed { width: auto; padding: 9px 14px; }
.under.legend-card.collapsed > :not(.lg-toggle) { display: none; }
.under.legend-card.collapsed .lg-toggle { color: var(--text); }
/* "i" button that opens a longer explanation in the legend */
.lg-info { display: inline-block; vertical-align: 1px; margin-left: 4px; }
.lg-info summary { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid var(--text-2); color: var(--text-2);
  font: 700 11px/1 Georgia, serif; font-style: italic; cursor: pointer; list-style: none; }
.lg-info summary::-webkit-details-marker { display: none; }
.lg-info[open] summary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lg-info p { margin: 6px 0 4px; font-size: 12px; font-weight: 400; line-height: 1.4; color: var(--text-2); }
.side-tabs button { padding: 7px 4px; font-size: 12.5px; font-weight: 600; line-height: 1.2; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); }
.side-tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.side-body { overflow-y: auto; padding: 12px 14px 14px; display: grid; gap: 10px; align-content: start; }
.side-body h2 { margin: 0; font-size: 17px; font-weight: 650; }
.side-body h3 { margin: 0 0 6px; font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }
.side-lead { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--text-2); }
.side-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.side-stats:empty { display: none; }
.side-stats div { padding: 8px 10px; border-radius: 8px; background: var(--wash); display: grid; gap: 1px; }
.side-stats b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.side-stats span { font-size: 11.5px; line-height: 1.3; color: var(--text-2); }
.side-sec { padding-top: 10px; border-top: 1px solid var(--grid); }
.side-note { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--text-2); }
.side .scale { width: 100%; }
.side #tlNote { display: block; margin-top: 6px; font-size: 12px; }
.side #readout { min-width: 0; font-size: 13px; }
.side .q-label { display: grid; gap: 4px; font-size: 12.5px; color: var(--text-2); }
.side .q-label input { width: 100%; }
.lg-title { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.lg-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-top: 5px; }
.lg-line { flex: none; width: 24px; height: 0; border-radius: 2px; }
.lg-area { flex: none; width: 18px; height: 12px; border: 1.6px solid #862e9c; background: rgba(134,46,156,.45); border-radius: 2px; }
.lg-dot { flex: none; width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px rgba(0,0,0,.3); }
.no-pins .zone-icon { display: none; }
.leaflet-tooltip.cont-label { background: transparent; border: 0; box-shadow: none; padding: 0; color: #fff; font: 600 10.5px/1 system-ui, -apple-system, "Segoe UI", sans-serif; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.leaflet-tooltip.cont-label::before { display: none; }
.mid .leaflet-tooltip.cont-label { display: none; }
.far .risk-halo { display: none; }   /* zoomed out: the at-risk fragments are shown as dots instead */
.phase-view .risk-halo { stroke: #141414; stroke-opacity: .85; }   /* phase view: dark outline reads better on the fringe colours */
.risk-dot { filter: drop-shadow(0 0 3px rgba(0,0,0,.7)); }
.cont-label2 span { position: absolute; left: 0; top: 0; white-space: nowrap; color: #fff; font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  text-shadow: 0 0 3px #000, 0 0 2px #000; pointer-events: none; }
.mid .cont-label2 { display: none; }
/* basemap switcher right of the zoom buttons */
.leaflet-top.leaflet-left .leaflet-control-layers { clear: none; margin-left: 6px; }
/* legend of a case study with a side panel: separate card in the bottom-left corner */
.under.legend-card { flex-direction: column; align-items: stretch; gap: 6px; width: 320px; max-height: calc(100% - 100px); overflow-y: auto; padding: 12px 14px; }
.under.legend-card .scale { width: 100%; }
.under.legend-card h3 { margin: 0; font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }
@media (max-width: 700px) {
  .side { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 46%; border-radius: 12px 12px 0 0; }
  .side.collapsed { bottom: 0; }
  .side-tabs button { font-size: 11.5px; padding: 6px 3px; }
}
.leaflet-tooltip.prof-label { background: rgba(11,11,11,.72); color: #fff; border: 0; border-radius: 6px; box-shadow: none; padding: 1px 7px; font: 600 11.5px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.leaflet-tooltip.prof-label::before { display: none; }
.far .leaflet-tooltip.prof-label { display: none; }
/* AOI outline label */
.leaflet-tooltip.aoi-label { background: rgba(11,11,11,.72); color: #fff; border: 0; border-radius: 6px; box-shadow: none; padding: 2px 8px; font: 600 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em; }
.leaflet-tooltip.aoi-label::before { display: none; }
.badge { display: inline-block; width: 20px; height: 20px; vertical-align: -5px; flex: none; }
.badge svg { display: block; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .pin { animation: none; } }
.leaflet-popup-content { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 12px 14px; }

/* Point popup (click on the map): plain-language summary of ground movement at one spot */
.cw-pop .leaflet-popup-content-wrapper, .cw-pop .leaflet-popup-tip { background: var(--surface); color: var(--text); }
.cw-pop .leaflet-popup-content { margin: 14px 16px 12px; }
.pp-chip { display: inline-block; font-size: 12px; font-weight: 650; padding: 2px 9px; border-radius: 999px; color: #fff; }
.pp-chip.calm { background: #6b6a65; } .pp-chip.small { background: var(--s2); } .pp-chip.big { background: var(--alert); } .pp-chip.none { background: var(--muted); }
.pp-head { font-size: 19px; font-weight: 650; line-height: 1.25; margin: 6px 0 2px; }
.pp-sub { color: var(--text-2); font-size: 13px; line-height: 1.4; }
.pp-sec { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--grid); font-size: 13px; line-height: 1.4; }
.pp-sec h4 { margin: 0; font-size: 13px; font-weight: 650; }
.pp-row { display: flex; justify-content: space-between; gap: 12px; }
.pp-row + .pp-row { margin-top: 3px; }
.pp-row span:first-child { color: var(--text-2); }
.pp-row b { font-weight: 600; text-align: right; }
.pp-hint { color: var(--text-2); font-size: 12px; margin-top: 3px; }
.pp-zone { background: var(--alert-wash); border-top: 0; border-radius: 8px; padding: 7px 10px; }
.pp-spark { display: block; width: 100%; height: auto; margin-top: 2px; overflow: visible; }
.pp-spark text { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.pp-foot { margin-top: 8px; font-size: 11.5px; line-height: 1.35; color: var(--muted); }

/* Legend floats over the bottom-left corner of the map */
.under { position: absolute; left: 12px; bottom: 12px; z-index: 1000; max-width: calc(100% - 24px); display: flex; gap: 8px 20px; align-items: center; flex-wrap: nowrap;
  padding: 10px 14px; font-size: 13px; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(6px); box-shadow: 0 2px 10px rgba(0,0,0,.3); }
.scale { flex: none; width: 300px; }
.legend-bar { width: 100%; height: 12px; border-radius: 3px; display: block; }
.legend-ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; white-space: nowrap; }
.keys > span { display: inline-flex; align-items: center; gap: 6px; cursor: help; }
.under .small { white-space: nowrap; }
#readout { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 170px; }
#readout b { color: var(--text); font-weight: 650; font-size: 15px; }
details.adv { position: relative; }
details.adv summary { cursor: pointer; list-style: none; border: 1px solid var(--axis); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv .pop { position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 1100; width: 300px; max-height: calc(100vh - 230px); overflow-y: auto; padding: 12px; display: grid; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
details.adv .pop label { display: grid; gap: 3px; font-size: 13px; color: var(--text-2); }
details.adv .pop label.row { display: flex; gap: 6px; color: var(--text); }

/* Timeline bar above the map: title, prev / date / next, jump to latest, play, then the track of measurement dates */
#timeline { --tl-tint: color-mix(in srgb, var(--s1) 20%, var(--surface)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; padding: 8px 20px; border-top: 1px solid var(--grid); }
.tl-title { font-size: 16px; font-weight: 500; margin-right: 8px; white-space: nowrap; }
.tl-date { font-size: 16px; font-weight: 500; color: var(--accent); min-width: 98px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
#timeline button { display: grid; place-items: center; padding: 0; border-radius: 50%; }
#timeline button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tl-nav { width: 30px; height: 30px; border: 0; background: none; }
.tl-nav:disabled { color: var(--muted); opacity: .5; cursor: default; background: none; }
.tl-round { width: 42px; height: 42px; border: 0; background: var(--tl-tint); color: var(--accent); margin-left: 6px; }
.tl-round:hover { background: color-mix(in srgb, var(--s1) 32%, var(--surface)); }
#timeline #play svg { fill: currentColor; stroke: none; }
#tl { position: relative; flex: 1 1 380px; height: 46px; margin: 0 26px 0 48px; cursor: pointer; touch-action: none; user-select: none; }
.tl-band { position: absolute; left: -18px; right: -18px; top: 4px; height: 20px; border-radius: 10px; background: linear-gradient(90deg, transparent, var(--tl-tint) 28px); }
.tl-stop { position: absolute; top: 14px; width: 5px; height: 5px; border-radius: 50%; background: var(--text); transform: translate(-50%, -50%); }
/* dates on which new anomalies appear */
.tl-stop.has-new { width: 9px; height: 9px; background: var(--surface); box-shadow: 0 0 0 2.5px var(--text); }
/* The big dot glides between dates instead of jumping */
.tl-thumb { position: absolute; top: 14px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); transition: left .35s cubic-bezier(.4, 0, .2, 1); pointer-events: none; }
.tl-lab { transition: color .2s; }
@media (prefers-reduced-motion: reduce) { .tl-thumb { transition: none; } }
.tl-lab { position: absolute; top: 27px; transform: translateX(-50%); font-size: 13px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tl-lab.on { color: var(--text); }
.tl-lab.first { transform: translateX(-12px); }
.tl-lab.last { transform: translateX(calc(-100% + 12px)); }

#tip { position: fixed; z-index: 3000; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.2); padding: 6px 9px; font-size: 12px; line-height: 1.4; display: none; max-width: 260px; font-variant-numeric: tabular-nums; }
#tip b { font-weight: 650; }
#status { flex: 1; display: grid; place-items: center; padding: 40px 16px; text-align: center; color: var(--text-2); }

@media (max-width: 1000px) {
  .under { flex-wrap: wrap; }
  .scale { width: 260px; }
}
@media (max-width: 700px) {
  .bar { padding: 8px 16px; }
  .bar h1 { padding-left: 0; border-left: 0; flex-basis: 100%; order: 1; font-size: 17px; }
  .loc { flex: 1 1 100%; }
  .loc select { flex: 1; }
  #timeline { padding: 6px 16px; }
  #tl { margin: 0 14px; flex-basis: 100%; }
  .under { right: 12px; }
  .scale { width: 100%; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#184f95"/><path d="M4 12c4-5 8 3 12-1s8 3 12-1" fill="none" stroke="#9ec5f4" stroke-width="2.2" stroke-linecap="round"/><path d="M4 21h9l3-3 3 3h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Corridor Watch</span>
    </div>
    <h1 id="title"></h1>
    <div id="periodWrap"><div class="seg" id="period" role="group" aria-label="Okres obserwacji"></div></div>
    <span class="sp"></span>
    <label class="loc" id="locWrap">Lokalizacja
      <select id="loc" aria-label="Lokalizacja"></select>
    </label>
  </div>
  <div id="timeline" hidden>
    <span class="tl-title">Pomiary radarowe</span>
    <button id="prev" class="tl-nav" aria-label="Poprzedni pomiar" title="Poprzedni pomiar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <span class="tl-date" id="tlDate"></span>
    <button id="next" class="tl-nav" aria-label="Następny pomiar" title="Następny pomiar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
    <button id="latest" class="tl-round" aria-label="Najnowszy pomiar" title="Najnowszy pomiar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6l6 6-6 6M17 6v12"/></svg></button>
    <button id="play" class="tl-round" aria-label="Odtwórz" title="Odtwórz"></button>

<main id="app" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const fmt = (v, d = 0) => v == null || !isFinite(v) ? 'brak' : v.toLocaleString('pl-PL', { minimumFractionDigits: d, maximumFractionDigits: d }).replace('-', '−');

  const dISO = (d) => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;
  const dPL = (d) => `${d.slice(6, 8)}.${d.slice(4, 6)}.${d.slice(0, 4)}`;
  const dTime = (d) => Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
  const fail = (msg) => { $('status').textContent = msg; };

  // ------------------------------------------- locations (from the backend API)
  const API = window.CW_API || '/api/v1';  // override with window.CW_API when the API runs elsewhere
  const getJSON = async (url) => {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  };
  let LOCS;
  try { LOCS = await getJSON(`${API}/locations`); }
  catch (err) { return fail(`Nie udało się połączyć z serwerem (${err.message}). Czy backend jest uruchomiony?`); }

    opt.disabled = !l.ready;

  }));
  if (!ready.length) return fail('Brak przygotowanych lokalizacji. Wgraj pakiet danych przez API (/docs) albo skryptem import_corridor_watch.py.');
  const LOC = ready.find((l) => l.id === decodeURIComponent(location.hash.slice(1))) || ready[0];
  $('loc').value = LOC.id;
  $('loc').addEventListener('change', (e) => { location.hash = e.target.value; location.reload(); });
  let DATA;
  try { DATA = await getJSON(`${API}/locations/${encodeURIComponent(LOC.id)}/data`); }
  catch (err) { return fail(`Nie udało się wczytać danych lokalizacji ${LOC.name}: ${err.message}`); }

  // ---------------------------------------------------------- anomaly types

  const TYPES = {
    landslide: { name: 'Osuwisko', color: '#d9480f', desc: 'Fragment zbocza zsuwa się w dół.',
      icon: '<path d="M3 20V9l18 11z" fill="#fff" stroke="none"/><path d="M7.5 3.5l9 6M14.9 5.9l1.6 3.6-3.9.4"/>' },
    subsidence: { name: 'Osiadanie', color: '#862e9c', desc: 'Grunt zapada się w miejscu.',
      icon: '<path d="M2.5 14h5l2 5h5l2-5h5"/><path d="M12 3v9M8.5 8.5L12 12l3.5-3.5"/>' },
    uplift: { name: 'Wypiętrzenie', color: '#1864ab', desc: 'Grunt się podnosi (np. u podnóża osuwiska, gdzie spychana ziemia się spiętrza).',

  const pinSVG = (type) => { const T = TYPES[type]; return `<svg viewBox="0 0 36 44" aria-hidden="true"><path d="M18 42.5S4.5 28.5 4.5 18a13.5 13.5 0 0 1 27 0c0 10.5-13.5 24.5-13.5 24.5z" fill="${T.color}" stroke="#fff" stroke-width="2.5"/><g transform="translate(8 8) scale(.8333)">${iconG(T)}</g></svg>`; };

  $('title').textContent = `${DATA.config.name}, ${DATA.config.region}`;
  $('period').innerHTML = SER.map((s, i) => `<button data-s="${i}" aria-pressed="${i === state.s}">${dPL(dates[s.start])} – ${dPL(dates[s.end])}</button>`).join('');

  // ------------------------------------------------------------------ map

  map.createPane('labels').style.zIndex = 410; map.getPane('labels').style.pointerEvents = 'none';
  const esri = (name, opts) => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${name}/MapServer/tile/{z}/{y}/{x}`, Object.assign({ maxZoom: 16, attribution: 'Esri, HERE, Garmin, © OpenStreetMap' }, opts));
  const dark = L.layerGroup([esri('Canvas/World_Dark_Gray_Base'), esri('Canvas/World_Dark_Gray_Reference', { pane: 'labels' })]).addTo(map);
  const light = L.layerGroup([esri('Canvas/World_Light_Gray_Base'), esri('Canvas/World_Light_Gray_Reference', { pane: 'labels' })]);
  const imagery = esri('World_Imagery', { maxZoom: 18, attribution: 'Esri World Imagery' });

  L.control.layers({ 'Mapa ciemna': dark, 'Mapa jasna': light, 'Zdjęcia satelitarne': imagery }, null, { position: 'topleft' }).addTo(map);

  // The limits come from the location's data, so every case study gets its own.
  const caseArea = L.latLngBounds(G.bounds);

  const updateMinZoom = () => map.setMinZoom(Math.max(0, map.getBoundsZoom(caseArea) - 0.5));

  map.fitBounds(DATA.config.view || G.bounds);
  map.createPane('zones').style.zIndex = 430;
  map.createPane('marks').style.zIndex = 620;

  // Outline of the whole area analysed in this case study (AOI = extent of the radar data grid),
  // a dark line under a white dashed one so it reads on both dark and light basemaps
  L.rectangle(G.bounds, { pane: 'zones', interactive: false, fill: false, color: '#0b0b0b', weight: 4, opacity: 0.45 }).addTo(map);

    .setLatLng([G.bounds[1][0], G.bounds[0][1]]).setContent('Obszar analizy (AOI)').addTo(map);

  const ctx = canvas.getContext('2d'), img = ctx.createImageData(G.width, G.height);

  });

  const DIV = [[-1, 178, 24, 43], [-0.667, 239, 138, 98], [-0.333, 253, 219, 199], [0, 240, 239, 236], [0.333, 209, 229, 240], [0.667, 103, 169, 207], [1, 33, 102, 172]];

  const hsl2rgb = (h, s, l) => { const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12; return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); }; return [f(0), f(8), f(4)]; };

  // Case studies may ask for a "clean" raster: motion within the noise is transparent (fading in from
  // display.min_mm to the 3-sigma threshold), so only real movement is coloured on top of the basemap
  const DISP = DATA.display || null;

  // Colour lookup tables (512 steps) so painting a frame is a table lookup per pixel
  const LUT_N = 512;
  function makeLut(stops) {
    const lut = new Uint8ClampedArray(LUT_N * 3), x0 = stops[0][0], x1 = stops[stops.length - 1][0];
    for (let k = 0; k < LUT_N; k++) { const c = ramp(stops, x0 + k / (LUT_N - 1) * (x1 - x0)); lut.set(c, k * 3); }
    return lut;
  }

  const LUT_CYC = new Uint8ClampedArray(LUT_N * 3);
  for (let k = 0; k < LUT_N; k++) LUT_CYC.set(hsl2rgb(cycHue(k / LUT_N), 0.85, 0.55), k * 3);

  function paintSpec() {

  function pixelOf(latlng) {
    const x = MR * latlng.lng * Math.PI / 180, y = MR * Math.log(Math.tan(Math.PI / 4 + latlng.lat * Math.PI / 360));

  }
  function renderLegend() {
    const grad = (stops) => `linear-gradient(90deg, ${stops.map((s) => `rgb(${s[1]},${s[2]},${s[3]}) ${((s[0] - stops[0][0]) / (stops[stops.length - 1][0] - stops[0][0])) * 100}%`).join(',')})`;
    if (VIEWS) return renderViewLegend();  // case studies with a side panel have their own, per-view legend
    const r = state.range, unit = state.mode === 'cum' ? 'mm' : 'mm/rok';
    const bar = (bg, a, b) => `<span class="legend-bar" style="background:${bg}"></span><div class="legend-ticks"><span>${a}</span><span>${b}</span></div>`;

    const present = Object.keys(TYPES).filter((k) => DATA.zones.some((z) => z.series === state.s && zoneType(z) === k));
    $('keys').innerHTML = present.map((k) => `<span title="${TYPES[k].desc}">${badge(k)}${TYPES[k].name}</span>`).join('')
      + '<span title="Anomalia wykryta po raz pierwszy w wybranym pomiarze. Na osi czasu takie daty mają puste kółko."><span class="new-mark"></span>nowa w tym pomiarze</span>';
  }

  // -------------------------------------------------------------- vectors
  const tip = $('tip');
  function showTip(html, ev) {
    tip.innerHTML = html; tip.style.display = 'block';
    tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, ev.clientX + 14) + 'px';
    tip.style.top = Math.max(8, ev.clientY - tip.offsetHeight - 12) + 'px';
  }
  const hideTip = () => { tip.style.display = 'none'; };
  const zoneLayer = L.layerGroup().addTo(map), contourLayer = L.layerGroup();
  const pointMarker = L.circleMarker([0, 0], { pane: 'marks', radius: 7, color: '#0b0b0b', weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false });

  // Zones are only rebuilt when the set of visible anomalies changes, so pins that are already
  // on the map stay put and only newly detected ones "drop in" while the timeline plays.
  let zonesKey = '', zoneMarkers = [];
  function markNew(z, marker, shape) {
    const fresh = isNewAt(z, state.t);
    if (!marker) {  // outline-only zone: a white outline marks it as new
      shape.setStyle({ color: fresh ? '#fff' : TYPES[zoneType(z)].color, weight: fresh ? 3 : 1.6 });
      return;
    }
    const el = marker.getElement();
    if (el) el.classList.toggle('is-new', fresh);
    marker.setZIndexOffset(fresh ? 1000 : 0);
  }
  function renderZones() {
    const zs = anomalies(), key = zs.map((z) => z.id).join();
    if (key !== zonesKey) {
      zonesKey = key;
      zoneLayer.clearLayers(); zoneMarkers = [];
      zs.forEach((z) => {
        const type = zoneType(z), T = TYPES[type], withPin = z.pin !== false;  // packages may mark minor zones as outline-only
        if (withPin) L.geoJSON(z.geometry, { pane: 'zones', interactive: false, style: { color: '#fff', weight: 4, opacity: 0.9, fill: false } }).addTo(zoneLayer);
        const shape = L.geoJSON(z.geometry, { pane: 'zones', style: withPin ? { color: T.color, weight: 2.2, fillColor: T.color, fillOpacity: 0.12 }
          : { color: T.color, weight: 1.6, fillColor: T.color, fillOpacity: 0.45 } }).addTo(zoneLayer);
        const marker = withPin ? L.marker(z.peak_latlon, { pane: 'marks', riseOnHover: true, keyboard: true, title: T.name,
          icon: L.divIcon({ className: 'zone-icon', iconSize: [36, 44], iconAnchor: [18, 43], html: `<span class="pin-ring"></span><span class="pin">${pinSVG(type)}</span>` }) }).addTo(zoneLayer) : null;
        if (marker) marker.on('click', (e) => { L.DomEvent.stopPropagation(e); hideTip(); selectPoint(L.latLng(z.peak_latlon)); });
        shape.on('click', (e) => { L.DomEvent.stopPropagation(e); selectPoint(e.latlng); });
        [shape, marker].filter(Boolean).forEach((l) => {
          l.on('mousemove', (e) => showTip(`<div style="display:flex;gap:6px;align-items:center">${badge(type)}<b>${T.name}</b></div>`
            + (isNewAt(z, state.t) ? '<b>Nowa:</b> wykryta po raz pierwszy w tym pomiarze.<br>' : '')
            + `${T.desc}<br>Ruch do <b>${amount(peakAt(z))}</b> · kliknij po szczegóły`, e.originalEvent));
          l.on('mouseout', hideTip);
        });
        if (marker) marker.on('add', () => markNew(z, marker));  // Leaflet rebuilds the icon when the layer is shown again
        zoneMarkers.push([z, marker, shape]);
      });
    }
    // Highlight anomalies that appear for the first time on the selected date. Only a class is
    // toggled, so pins already on the map don't re-animate while the timeline moves.
    zoneMarkers.forEach(([z, marker, shape]) => markNew(z, marker, shape));
  }
  function renderContours() {
    contourLayer.clearLayers();
    L.geoJSON(DATA.contours.filter((f) => f.properties.data === dISO(dates[state.t])), { pane: 'zones', interactive: false, style: (f) => ({ color: '#f0efec', weight: f.properties.poziom_mm % 100 === 0 ? 1.4 : 0.7 }) }).addTo(contourLayer);
  }

  // ------------------------------------------------------------- timeline
  const MONTHS = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];
  const dShort = (d) => `${+d.slice(6, 8)} ${MONTHS[+d.slice(4, 6) - 1]}`;
  const dLong = (d) => `${dShort(d)} ${d.slice(0, 4)}`;
  const seriesIdx = () => { const out = []; for (let i = S().start; i <= S().end; i++) out.push(i); return out; };
  // Position of a measurement on the track, 0..1, proportional to time
  const tlFrac = (i) => { const t0 = times[S().start], t1 = times[S().end]; return t1 > t0 ? (times[i] - t0) / (t1 - t0) : 0.5; };
  const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
  function setPlayIcon(playing) {
    const label = playing ? 'Zatrzymaj' : 'Odtwórz';
    $('play').innerHTML = playing ? ICON_PAUSE : ICON_PLAY; $('play').title = label; $('play').setAttribute('aria-label', label);
  }
  // Track structure (dots + labels + thumb) is built once per period / resize; changing the date
  // only moves the thumb, which slides there with a CSS transition.
  function buildTimeline() {
    // Thin out date labels so they never overlap: roughly one label per 85 px of track width
    const idx = seriesIdx(), room = Math.max(2, Math.floor(($('tl').clientWidth || 600) / 85)), every = Math.ceil(idx.length / room);
    $('tl').innerHTML = '<div class="tl-band"></div>' + idx.map((i, j) => {
      const left = `left:${(tlFrac(i) * 100).toFixed(2)}%`;
      const newYear = j === 0 || dates[i].slice(0, 4) !== dates[idx[j - 1]].slice(0, 4);
      const fresh = DATA.zones.some((z) => isNewAt(z, i));
      return `<span class="tl-stop${fresh ? ' has-new' : ''}" style="${left}"></span>`
        + (j % every === 0 ? `<span class="tl-lab${j === 0 ? ' first' : j === idx.length - 1 ? ' last' : ''}" data-i="${i}" style="${left}">${newYear ? dLong(dates[i]) : dShort(dates[i])}</span>` : '');
    }).join('') + '<span class="tl-thumb" id="tlThumb"></span>';
    renderTimeline();
  }
  function renderTimeline() {
    $('tlThumb').style.left = `${(tlFrac(state.t) * 100).toFixed(2)}%`;
    $('tl').querySelectorAll('.tl-lab').forEach((l) => l.classList.toggle('on', +l.dataset.i === state.t));
    $('tl').setAttribute('aria-valuetext', dLong(dates[state.t]));
  }
  // Click or drag anywhere on the track to jump to the nearest measurement (listeners live
  // on the track element itself, which survives re-rendering of its children).
  (function () {
    const svg = $('tl'); let drag = false;
    const pick = (ev) => {
      const r = svg.getBoundingClientRect(), f = (ev.clientX - r.left) / r.width;
      return seriesIdx().reduce((best, i) => (Math.abs(tlFrac(i) - f) < Math.abs(tlFrac(best) - f) ? i : best));
    };
    const go = (ev) => { const i = pick(ev); if (i !== state.t) { stop(); setDate(i); } };
    const hint = (ev) => {
      const i = pick(ev), n = DATA.zones.filter((z) => isNewAt(z, i)).length;
      showTip(`<b>${dLong(dates[i])}</b><br>Teren w ruchu: ${fmt(S().moving_km2_by_date[i - S().start], 2)} km²`
        + (n ? `<br>Nowe anomalie: <b>${n}</b>` : ''), ev);
    };
    svg.addEventListener('pointerdown', (ev) => { drag = true; svg.setPointerCapture(ev.pointerId); go(ev); hint(ev); ev.preventDefault(); });
    svg.addEventListener('pointermove', (ev) => { if (drag) go(ev); hint(ev); });
    ['pointerup', 'pointercancel'].forEach((n) => svg.addEventListener(n, () => { drag = false; }));
    svg.addEventListener('pointerleave', () => { if (!drag) hideTip(); });
    svg.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowLeft') { stop(); setDate(state.t - 1); ev.preventDefault(); }
      if (ev.key === 'ArrowRight') { stop(); setDate(state.t + 1); ev.preventDefault(); }
    });
  })();

  // ------------------------------------------------------------ selection
  // ------------------------------------------------------- point popup
  // Written for people who don't know GIS/InSAR: plain words, cm instead of LOS jargon,
  // a verdict chip, a mini chart of this spot over time and a confidence level.
  const pointPopup = L.popup({ className: 'cw-pop', minWidth: 280, maxWidth: 300, autoPanPadding: [20, 20] });
  pointPopup.on('remove', () => { pointMarker.remove(); pointPopup.latlng = null; });
  const amount = (mm) => (Math.abs(mm) >= 10 ? `${fmt(Math.abs(mm) / 10, 1)} cm` : `${fmt(Math.abs(mm))} mm`);
  const cumBetween = (i, t, ref) => { const a = R.cum[t * N + i], b = R.cum[ref * N + i]; return a === ND16 || b === ND16 ? null : (a - b) / 10; };
  const coordText = (ll) => `${fmt(Math.abs(ll.lat), 4)}° ${ll.lat >= 0 ? 'N' : 'S'}, ${fmt(Math.abs(ll.lng), 4)}° ${ll.lng >= 0 ? 'E' : 'W'}`;
  function inRing(x, y, ring) {
    let inside = false;
    for (let a = 0, b = ring.length - 1; a < ring.length; b = a++) {
      const [xa, ya] = ring[a], [xb, yb] = ring[b];
      if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) inside = !inside;
    }
    return inside;
  }
  function inGeometry(g, ll) {
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    return polys.some((p) => inRing(ll.lng, ll.lat, p[0]) && !p.slice(1).some((hole) => inRing(ll.lng, ll.lat, hole)));
  }
  function confidence(c) {
    if (c >= 0.6) return ['wysoka', '●●●', ''];
    if (c >= 0.35) return ['średnia', '●●○', ''];
    return ['niska', '●○○', 'Sygnał radaru jest tu zakłócony (np. roślinność, woda), więc ta liczba może być mocno niedokładna.'];
  }
  // Small chart: how this spot moved on every measurement date, relative to the start date
  function sparkline(i) {
    const idx = seriesIdx(), vals = idx.map((t) => cumBetween(i, t, state.ref)), ok = vals.filter((v) => v !== null);
    if (ok.length < 2) return '';
    const thr = S().threshold_mm, W = 268, H = 66, L0 = 4, R0 = 4, T0 = 6, B0 = 16;
    let lo = Math.min(-thr, ...ok), hi = Math.max(thr, ...ok); const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const x = (j) => L0 + j / (idx.length - 1) * (W - L0 - R0), y = (v) => T0 + (hi - v) / (hi - lo) * (H - T0 - B0);
    let d = '', pen = false;
    vals.forEach((v, j) => { if (v === null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(j).toFixed(1)} ${y(v).toFixed(1)}`; pen = true; });
    const cur = idx.indexOf(state.t), curV = vals[cur];
    return `<svg class="pp-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
      <rect x="${L0}" y="${y(thr)}" width="${W - L0 - R0}" height="${y(-thr) - y(thr)}" fill="var(--wash)" rx="3"/>
      <line x1="${L0}" x2="${W - R0}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-dasharray="3 3"/>
      <path d="${d}" fill="none" stroke="var(--text-2)" stroke-width="1.8" stroke-linejoin="round"/>
      ${vals.map((v, j) => (v === null || j === cur ? '' : `<circle cx="${x(j)}" cy="${y(v)}" r="2.3" fill="var(--text-2)"/>`)).join('')}
      ${curV === null ? '' : `<circle cx="${x(cur)}" cy="${y(curV)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`}
      <text x="${L0}" y="${H - 3}">${dShort(dates[idx[0]])}</text>
      <text x="${W - R0}" y="${H - 3}" text-anchor="end">${dShort(dates[idx[idx.length - 1]])}</text>
    </svg>`;
  }
  function pointHTML(latlng) {
    const foot = (extra = '') => `<div class="pp-foot">${extra}${coordText(latlng)}</div>`;
    const i = pixelOf(latlng);
    if (i < 0) return `<span class="pp-chip none">Poza obszarem</span><div class="pp-head">Brak danych</div>
      <div class="pp-sub">Ten punkt leży poza obszarem, który przeanalizowaliśmy. Kliknij w kolorowej części mapy.</div>${foot()}`;
    const c = R.coh[i], v = c === ND8 ? null : cumBetween(i, state.t, state.ref);
    if (v === null) return `<span class="pp-chip none">Brak pomiaru</span><div class="pp-head">Satelita nic tu nie zmierzył</div>
      <div class="pp-sub">Zwykle dzieje się tak nad wodą, w gęstym lesie albo w miejscach zasłoniętych przez strome zbocza. To nie znaczy, że teren jest stabilny – po prostu nie wiemy.</div>${foot()}`;

    const thr = S().threshold_mm, a = Math.abs(v), t0 = dates[Math.min(state.ref, state.t)], t1 = dates[Math.max(state.ref, state.t)];
    const days = Math.round(Math.abs(times[state.t] - times[state.ref]) / 864e5);
    const [level, chip] = a < thr ? ['calm', 'Stabilnie'] : a < 3 * thr ? ['small', 'Wyraźny ruch'] : ['big', 'Duży ruch'];
    let head, sub;
    if (state.t === state.ref) { head = 'Data początkowa'; sub = 'Od tej daty liczymy zmianę. Wybierz późniejszą datę na osi czasu, żeby zobaczyć, o ile ruszył się grunt.'; }
    else if (level === 'calm') { head = 'Teren stabilny'; sub = `Zmiana (${sgn(v)} mm) jest mniejsza niż błąd pomiaru (±${fmt(thr)} mm), więc traktujemy ją jak brak ruchu.`; }
    // Wording depends on the hazard of the case study (slope / landslide vs. ground subsidence)
    else if (v < 0) { head = `Grunt obniżył się o ${amount(v)}`; sub = hazardIsSlope ? 'Teren osiada albo zsuwa się po zboczu (np. osuwisko).' : 'Teren osiada.'; }
    else { head = `Grunt podniósł się o ${amount(v)}`; sub = hazardIsSlope ? 'Teren się wypiętrza – bywa tak np. u podnóża osuwiska, gdzie spychana ziemia się spiętrza.'
      : 'Teren się podnosi. Na terenach podmokłych bywa to efekt pozorny: radar widzi wtedy poziom wody, a nie grunt.'; }

    const rate = a / days * 365.25;  // mm per year, extrapolated from this period
    const rows = [`<div class="pp-row"><span>Okres</span><b>${t0.slice(0, 4) === t1.slice(0, 4) ? dShort(t0) : dLong(t0)} → ${dLong(t1)} (${days} dni)</b></div>`];
    if (level !== 'calm' && days >= 20) rows.push(`<div class="pp-row"><span>Tempo</span><b>ok. ${rate >= 100 ? fmt(rate / 10) + ' cm' : amount(rate)} na rok</b></div>`);
    const [conf, dots, confHint] = confidence(c / 250);
    rows.push(`<div class="pp-row"><span>Pewność pomiaru</span><b>${dots} ${conf}</b></div>`);
    // Whole-period results of the case study at this spot (e.g. vertical motion from two orbits)
    for (const Lr of Object.values(R.layers)) {
      if (!Lr.popup) continue;
      const lv = layerValue(Lr, i);
      if (lv !== null) rows.push(`<div class="pp-row"><span>${Lr.popup}</span><b>${sgn(lv)} ${Lr.unit}</b></div>`);
    }

    const zone = anomalies().find((z) => inGeometry(z.geometry, latlng));
    let zoneHTML = '';
    if (zone) {
      const type = zoneType(zone), T = TYPES[type];
      zoneHTML = `<div class="pp-sec pp-zone" style="background:color-mix(in srgb, ${T.color} 13%, transparent)"><div style="display:flex;gap:7px;align-items:center;margin-bottom:2px">${badge(type)}<b>${T.name}</b></div>Ten punkt leży w strefie, w której cały fragment terenu rusza się razem (maks. ${amount(peakAt(zone))}). Warto sprawdzić na miejscu.${isNewAt(zone, state.t) ? '<br><b>Nowa:</b> ta anomalia została wykryta po raz pierwszy w tym pomiarze.' : ''}</div>`;
    }
    else {
      const near = anomalies().map((z) => [z, map.distance(latlng, z.peak_latlon)]).sort((p, q) => p[1] - q[1])[0];
      if (near && near[1] < 2000) {
        const type = zoneType(near[0]);
        zoneHTML = `<div class="pp-sec" style="display:flex;gap:7px;align-items:center">${badge(type)}<span>Najbliższa anomalia: <b>${TYPES[type].name.toLowerCase()}</b>, ok. ${near[1] < 1000 ? fmt(Math.round(near[1] / 10) * 10) + ' m' : fmt(near[1] / 1000, 1) + ' km'} stąd.</span></div>`;
      }
    }

    return `<span class="pp-chip ${level}">${chip}</span>
      <div class="pp-head">${head}</div><div class="pp-sub">${sub}</div>
      ${zoneHTML}
      <div class="pp-sec">${rows.join('')}${confHint ? `<div class="pp-hint">${confHint}</div>` : ''}</div>
      <div class="pp-sec"><h4>Historia tego miejsca</h4><div class="pp-hint" style="margin:0">w dół = grunt opada · niebieska kropka = wybrana data</div>${sparkline(i)}</div>
      ${foot('Satelita patrzy z ukosa, więc prawdziwy ruch może być większy. ')}`;
  }
  // Is there a visible measurement at this spot on the selected date? (outside the AOI, no data,
  // or hidden by the coherence filter = nothing to show, so no popup)
  const hasData = (latlng) => { const i = pixelOf(latlng); return i >= 0 && valueAt(i, 'cum') !== null; };
  // Popups show their whole content (no scrollbar). Only when the map is locked to the AOI and can't pan far
  // enough (point near the bottom, small screen) the popup is shortened to the room it has and scrolls.
  function fitPopup(popup) { popup.options.maxHeight = map.getSize().y - 50; }
  map.on('popupopen', (e) => setTimeout(() => {
    const p = e.popup, el = p.getElement(); if (!el || !p.isOpen()) return;
    const top = el.getBoundingClientRect().top - map.getContainer().getBoundingClientRect().top;
    if (top < 6) { p.options.maxHeight = Math.max(160, el.querySelector('.leaflet-popup-content-wrapper').offsetHeight + top - 12); p.update(); }
  }, 350));
  function selectPoint(latlng) {
    if (!hasData(latlng)) { map.closePopup(pointPopup); return; }
    pointMarker.setLatLng(latlng).addTo(map);
    pointPopup.latlng = latlng;
    fitPopup(pointPopup, latlng);
    pointPopup.setLatLng(latlng).setContent(pointHTML(latlng)).openOn(map);
  }
  // Keep an open popup in sync when the date changes (arrows, timeline, playback);
  // close it if the spot has no measurement on the new date
  const refreshPointPopup = () => {
    if (!pointPopup.latlng || !map.hasLayer(pointPopup)) return;
    if (hasData(pointPopup.latlng)) pointPopup.setContent(pointHTML(pointPopup.latlng));
    else map.closePopup(pointPopup);
  };

  // ------------------------------------------------- case-study result views
  // A case study can ship `views` (side panel), `vectors` (pipelines, profiles) and `focus` (a phase-analysis
  // crop). The page then shows three views of the main results instead of the generic options:
  //   risk  - pipelines at risk on top of the significant ground motion
  //   zones - subsidence zones appearing over time
  //   phase - interferometric fringes of the focus crop, animated with the timeline
  // Locations without these keys (e.g. Portuguese Bend) keep the original interface.
  map.createPane('focus').style.zIndex = 425;
  map.createPane('vec').style.zIndex = 440;
  const RISK = { 'wysokie': '#e03131', 'średnie': '#f08c00', 'niskie': '#8a96a3', 'brak danych': '#8a96a3' };
  const RISK_LABEL = { 'wysokie': 'Wysokie zagrożenie', 'średnie': 'Średnie zagrożenie', 'niskie': 'Niskie zagrożenie', 'brak danych': 'Brak danych' };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const row = (k, v) => (v === null || v === undefined || v === '' ? '' : `<div class="pp-row"><span>${k}</span><b>${v}</b></div>`);
  const chipOf = (color, text) => `<span class="pp-chip" style="background:${color}">${text}</span>`;
  const vecPopup = L.popup({ className: 'cw-pop', minWidth: 270, maxWidth: 320, autoPanPadding: [20, 20] });
  function openVec(latlng, render) { vecPopup.render = render; fitPopup(vecPopup, latlng); vecPopup.setLatLng(latlng).setContent(render()).openOn(map); }
  // Profile labels only when zoomed in enough for them not to pile up on each other
  const labelZoom = () => { map.getContainer().classList.toggle('far', map.getZoom() < 12); map.getContainer().classList.toggle('mid', map.getZoom() < 13.5); };
  map.on('zoomend', labelZoom); labelZoom();

  function riskHTML(p) {
    const c = RISK[p.klasa] || RISK.niskie;
    return `${chipOf(c, RISK_LABEL[p.klasa] || esc(p.klasa))}<div class="pp-head">${esc(p.nazwa || p.typ)}</div>
      <div class="pp-sub">${esc(p.typ)}${p.status ? ' · ' + esc(p.status) : ''}${p.srednica_mm ? ` · średnica ${fmt(p.srednica_mm)} mm` : ''}</div>
      ${p.powod ? `<div class="pp-sec pp-zone" style="background:color-mix(in srgb, ${c} 13%, transparent)">${esc(p.powod)}</div>` : ''}
      <div class="pp-sec">${row('Ruch pionowy gruntu', p.v != null ? `${sgn(p.v)} mm/rok` : null)}${row('Nierówne osiadanie', p.gradient != null ? `${fmt(p.gradient)} mm/100 m/rok` : null)}
      ${row('Przemieszczenie za okres', p.przem_mm != null ? `${sgn(p.przem_mm)} mm` : null)}
      ${row('Długość fragmentu', p.dlugosc_m != null ? `${fmt(p.dlugosc_m)} m` : null)}
      ${row('Odległość od strefy osiadania', p.odl_m != null ? (p.odl_m === 0 ? 'w strefie' : `${fmt(p.odl_m)} m`) : null)}
      ${row('Okna monitoringu z ruchem', p.okna_ruch != null ? `${fmt(p.okna_ruch)} z ${G.windows.length}` : null)}${row('Pewność danych', esc(p.pewnosc))}</div>
      <div class="pp-foot">Klasa opisuje ruch gruntu pod rurociągiem (narażenie), nie jego stan techniczny. Sieć: baza OGIM.</div>`;
  }

  // Profile across the subsidence bowl: one line per measurement date up to the selected one
  const profName = (n) => (n === 'os_dluga' ? 'Oś wzdłuż niecki' : n === 'os_krotka' ? 'Oś w poprzek niecki' : 'Wzdłuż rurociągu ' + n.replace(/_/g, ' '));
  function profileHTML(p) {
    const W = 290, H = 170, L0 = 34, R0 = 8, T0 = 10, B0 = 22, d = p.distance_m, maxD = d[d.length - 1];
    const cur = Math.max(0, p.dates.indexOf(dates[state.t]));
    const all = p.values_mm.flat().filter((v) => v !== null);
    let lo = Math.min(0, ...all), hi = Math.max(0, ...all); const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const x = (m) => L0 + m / maxD * (W - L0 - R0), y = (v) => T0 + (hi - v) / (hi - lo) * (H - T0 - B0);
    const path = (vals) => { let s = '', pen = false; vals.forEach((v, j) => { if (v === null) { pen = false; return; } s += `${pen ? 'L' : 'M'}${x(d[j]).toFixed(1)} ${y(v).toFixed(1)}`; pen = true; }); return s; };
    let lines = '';
    for (let k = 0; k <= cur; k++) lines += `<path d="${path(p.values_mm[k])}" fill="none" stroke="${k === cur ? '#2563eb' : 'var(--text-2)'}" stroke-width="${k === cur ? 2.4 : 1}" opacity="${k === cur ? 1 : 0.2 + 0.5 * k / Math.max(cur, 1)}"/>`;
    const cross = (p.crossings || []).map((c) => `<line x1="${x(c.odleglosc_m)}" x2="${x(c.odleglosc_m)}" y1="${T0}" y2="${H - B0}" stroke="${RISK[c.klasa] || RISK.niskie}" stroke-width="2"/>`).join('');
    const yt = [lo, 0, hi].map((v) => `<text x="${L0 - 4}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`).join('');
    const xt = [0, maxD / 2, maxD].map((m, k) => `<text x="${x(m)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][k]}">${fmt(m / 1000, 1)} km</text>`).join('');
    const svg = `<svg class="pp-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="${L0}" x2="${W - R0}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)" stroke-dasharray="3 3"/>${cross}${lines}${yt}${xt}</svg>`;
    const now = p.values_mm[cur].filter((v) => v !== null);
    return `${chipOf('#334155', 'Przekrój')}<div class="pp-head">${esc(profName(p.nazwa))}</div>
      <div class="pp-sub">Ruch w linii widzenia (orbita wznosząca) od ${dShort(p.dates[0])}. Kolejne linie to kolejne pomiary, niebieska = wybrana data.</div>
      <div class="pp-sec"><h4>Profil niecki w czasie [mm]</h4>${svg}</div>
      <div class="pp-sec">${row('Najgłębiej na wybraną datę', now.length ? `${fmt(Math.min(...now))} mm` : null)}
      ${(p.crossings || []).map((c) => row('Przecina', `${esc(c.obiekt)} (${fmt(c.odleglosc_m / 1000, 1)} km)`)).join('')}</div>
      <div class="pp-foot">Długość przekroju ${fmt(maxD / 1000, 1)} km. Pionowa kreska = przecięcie z rurociągiem (kolor = klasa zagrożenia).</div>`;
  }

  // --- vector layers
  const vecLayers = {};
  const tipOn = (l, html) => { l.on('mousemove', (e) => showTip(html, e.originalEvent)); l.on('mouseout', hideTip); };
  const clickOpen = (l, render) => l.on('click', (e) => { L.DomEvent.stopPropagation(e); hideTip(); openVec(e.latlng, render); });
  for (const V of DATA.vectors || []) {
    if (V.style === 'network') {
      vecLayers[V.key] = L.geoJSON(V.data, { pane: 'vec', interactive: false,
        style: (f) => ({ color: '#aab4be', weight: 1, opacity: f.properties.klasa === 'brak danych' ? 0.25 : 0.5, dashArray: f.properties.klasa === 'brak danych' ? '2 4' : null }) });
    } else if (V.style === 'risk') {
      // halo first: Leaflet draws a group's layers in creation order, so the halo has to be created before the line
      const halo = L.geoJSON(V.data, { pane: 'vec', interactive: false, style: { color: '#fff', weight: 14, opacity: 0.95, lineCap: 'round', className: 'risk-halo' } });
      const main = L.geoJSON(V.data, { pane: 'vec', style: (f) => ({ color: RISK[f.properties.klasa] || RISK.niskie, weight: f.properties.klasa === 'wysokie' ? 9 : 7, opacity: 1, lineCap: 'round' }),
        onEachFeature: (f, l) => { const p = f.properties; clickOpen(l, () => riskHTML(p)); tipOn(l, `<b>${esc(p.nazwa || p.typ)}</b><br>${RISK_LABEL[p.klasa] || ''} · kliknij po szczegóły`); } });
      // Fragments are 100 m – 2 km long, invisible when the whole area is shown: below zoom 12 each one
      // also gets a dot at its middle, so the threatened places can be found at a glance
      const dots = L.layerGroup(V.data.features.map((f) => {
        const p = f.properties, c = L.geoJSON(f).getBounds().getCenter();
        const m = L.circleMarker(c, { pane: 'vec', radius: p.klasa === 'wysokie' ? 8 : 6.5, color: '#fff', weight: 2.5, fillColor: RISK[p.klasa] || RISK.niskie, fillOpacity: 1, className: 'risk-dot' });
        clickOpen(m, () => riskHTML(p)); tipOn(m, `<b>${esc(p.nazwa || p.typ)}</b><br>${RISK_LABEL[p.klasa] || ''} · kliknij po szczegóły`);
        return m;
      }));
      const grp = L.layerGroup([halo, main]);
      const syncDots = () => { if (!map.hasLayer(grp)) return; if (map.getZoom() < 12) dots.addTo(map); else dots.remove(); };
      grp.on('add', syncDots); grp.on('remove', () => dots.remove()); map.on('zoomend', syncDots);
      vecLayers[V.key] = grp;
      vecLayers[V.key].data = V.data;
    } else if (V.style === 'profile') {
      // drawn like in the team's phase figure: a thin dark line; a wide invisible line on top makes it easy to click
      const halo = L.geoJSON(V.data, { pane: 'vec', interactive: false, style: { color: '#262626', weight: 1.4, opacity: 0.9 } });
      const main = L.geoJSON(V.data, { pane: 'vec', style: { color: '#000', weight: 14, opacity: 0 },
        onEachFeature: (f, l) => { const p = f.properties; clickOpen(l, () => profileHTML(p)); tipOn(l, `<b>Przekrój: ${esc(profName(p.nazwa))}</b><br>kliknij, żeby zobaczyć profil w czasie`); } });
      // labels at the line ends (the three profiles cross in the middle of the bowl, labels there would overlap)
      const labels = V.data.features.map((f) => {
        // western end, text to the left: away from the side panel on the right
        const c = f.geometry.coordinates, end = c[0][0] < c[c.length - 1][0] ? c[0] : c[c.length - 1];
        return L.tooltip({ permanent: true, direction: 'left', className: 'prof-label', offset: [-4, 0], interactive: false })
          .setLatLng([end[1], end[0]]).setContent(f.properties.nazwa === 'os_dluga' ? 'przekrój: oś wzdłuż' : f.properties.nazwa === 'os_krotka' ? 'przekrój: oś w poprzek' : 'przekrój: rurociąg');
      });
      vecLayers[V.key] = L.layerGroup([halo, main, ...labels]);
    }
  }

  // --- phase-analysis crop: wrapped fringes (0..cycle mm) and displacement at a fine pixel, one band per date
  const F = DATA.focus || null;
  if (F) {
    F.n = F.w * F.h;
    F.contours_fc = F.contours;   // GeoJSON from the package; F.contours becomes the map layer below
    F.wr = await unpack(F.wrapped, Uint8Array); F.dp = await unpack(F.disp, Int16Array);
    delete F.wrapped; delete F.disp;
    F.cv = document.createElement('canvas'); F.cv.width = F.w; F.cv.height = F.h;
    F.ctx = F.cv.getContext('2d'); F.img = F.ctx.createImageData(F.w, F.h);
    F.overlay = new CanvasOverlay('', F.bounds, { pane: 'focus', canvas: F.cv, className: 'focus-img', opacity: 0.92 });
    F.contours = L.layerGroup();
    F.band = (t) => F.dates.indexOf(dates[t]);   // -1 = reference date (nothing has moved yet)
    // subsidence zones inside the crop as white dashed outlines (style of the team's phase figure)
    const fb = L.latLngBounds(F.bounds);
    F.zones = L.geoJSON({ type: 'FeatureCollection', features: DATA.zones.filter((z) => fb.contains(z.peak_latlon)).map((z) => ({ type: 'Feature', properties: {}, geometry: z.geometry })) },
      { pane: 'vec', interactive: false, style: { color: '#fff', weight: 1.6, dashArray: '6 4', fill: false, opacity: 0.95 } });
  }
  // Contour label rotated along the line (readable: never upside down), placed at the middle vertex
  function contourLabel(f) {
    const c = f.geometry.coordinates, m = Math.floor(c.length / 2), a = c[Math.max(0, m - 2)], b = c[Math.min(c.length - 1, m + 2)];
    const pa = map.project([a[1], a[0]], 0), pb = map.project([b[1], b[0]], 0);
    let ang = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
    if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
    return L.marker([c[m][1], c[m][0]], { pane: 'vec', interactive: false, keyboard: false,
      icon: L.divIcon({ className: 'cont-label2', iconSize: [0, 0], html: `<span style="transform:translate(-50%,-50%) rotate(${ang.toFixed(1)}deg)">${esc(f.properties.etykieta)}</span>` }) });
  }
  function paintFocus() {
    const b = F.band(state.t), px = F.img.data, top = LUT_N - 1, base = Math.max(0, b) * F.n;
    for (let i = 0, o = 0; i < F.n; i++, o += 4) {
      const v = F.wr[base + i];
      if (v === ND8) { px[o + 3] = 0; continue; }   // no data inside the crop: transparent (basemap shows through)
      const k = (b < 0 ? 0 : Math.min(top, Math.round(v / 250 * top))) * 3;   // reference date: zero motion = cyan
      px[o] = LUT_CYC[k]; px[o + 1] = LUT_CYC[k + 1]; px[o + 2] = LUT_CYC[k + 2]; px[o + 3] = 238;
    }
    F.ctx.putImageData(F.img, 0, 0);
    F.contours.clearLayers();
    L.geoJSON({ type: 'FeatureCollection', features: F.contours_fc.features.filter((f) => f.properties.data === dates[state.t]) }, { pane: 'vec', interactive: false,
      style: { color: '#fff', weight: 1.4, opacity: 0.95 },
      // label the longer lines only (short ones are small noise rings around the bowl)
      onEachFeature: (f) => { if (f.geometry.coordinates.length >= 12) F.contours.addLayer(contourLabel(f)); } })
      .eachLayer((l) => F.contours.addLayer(l));
  }
  function focusValue(latlng) {
    const x = MR * latlng.lng * Math.PI / 180, y = MR * Math.log(Math.tan(Math.PI / 4 + latlng.lat * Math.PI / 360));
    const c = Math.floor((x - F.mercator.west) / F.mercator.pixel), r = Math.floor((F.mercator.north - y) / F.mercator.pixel);
    if (c < 0 || r < 0 || c >= F.w || r >= F.h) return undefined;
    const b = F.band(state.t);
    if (b < 0) return F.wr[r * F.w + c] === ND8 ? null : 0;
    const v = F.dp[b * F.n + r * F.w + c];
    return v === ND16 ? null : v / 10;
  }

  // --- side panel and legend card: both start collapsed, so the map is free at first sight.
  // Collapsed panel = just the three view buttons + "Szczegóły"; collapsed legend = a "Legenda" button.
  const side = VIEWS ? document.createElement('aside') : null;
  const CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  if (VIEWS) {
    side.className = 'side card collapsed'; side.id = 'side';
    side.innerHTML = `<div class="side-tabs" role="tablist">${['risk', 'zones', 'phase'].filter((k) => VIEWS[k]).map((k) =>
        `<button role="tab" data-view="${k}">${{ risk: 'Zagrożone rurociągi', zones: 'Strefy osiadania', phase: 'Analiza fazowa' }[k]}</button>`).join('')}
        <button class="side-toggle" id="sideToggle" aria-expanded="false" aria-controls="sideBody" title="Pokaż szczegóły">Szczegóły ${CHEV}</button></div>
      <div class="side-body" id="sideBody"><h2 id="sideTitle"></h2><p class="side-lead" id="sideLead"></p><div class="side-stats" id="sideStats"></div>
        <div class="side-sec" id="legendSlot" hidden><h3>Legenda</h3></div>
        <div class="side-sec" id="qualitySlot"><h3>Jakość pomiaru</h3></div>
        <div class="side-sec"><h3>Pod kursorem</h3><div id="readoutSlot"></div></div>
        <p class="side-note" id="sideNote"></p></div>`;
    $('app').appendChild(side);
    $('readoutSlot').appendChild($('readout'));
    const q = $('coh').closest('label'); q.classList.add('q-label'); $('qualitySlot').appendChild(q);
    $('coh').value = state.cohMin; $('cohVal').textContent = fmt(state.cohMin, 2);
    // the legend stays a separate card in the bottom-left corner of the map (moved into the panel on phones)
    const under = document.querySelector('.under');
    under.classList.add('legend-card', 'collapsed'); $('adv').hidden = true;
    under.insertAdjacentHTML('afterbegin', `<button class="lg-toggle" id="lgToggle" aria-expanded="false" title="Pokaż legendę">Legenda ${CHEV}</button>`);
    side.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => applyView(b.dataset.view, true)));
    const setOpen = (el, btn, open, label) => { el.classList.toggle('collapsed', !open); btn.setAttribute('aria-expanded', String(open)); btn.title = (open ? 'Zwiń ' : 'Pokaż ') + label; };
    $('sideToggle').addEventListener('click', () => setOpen(side, $('sideToggle'), side.classList.contains('collapsed'), 'szczegóły'));
    $('lgToggle').addEventListener('click', () => setOpen(under, $('lgToggle'), under.classList.contains('collapsed'), 'legendę'));
  }
  function placeLegend() {
    if (!VIEWS) return;
    const narrow = window.innerWidth <= 700, under = document.querySelector('.under'), slot = $('legendSlot');
    for (const id of ['legend', 'keys', 'tlNote']) (narrow ? slot : under).appendChild($(id));
    under.hidden = narrow; slot.hidden = !narrow;
  }
  placeLegend();
  window.addEventListener('resize', placeLegend);
  // keep the fitted area clear of the view buttons (top right) and, in the phase view, of the legend corner
  const padView = (clearLegend) => (map.getSize().x > 760 ? { paddingTopLeft: [clearLegend ? 60 : 20, 20], paddingBottomRight: [20, clearLegend ? 70 : 20] } : { padding: [10, 10] });
  function renderSide() {
    const V = VIEWS[state.view];
    side.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
    $('sideTitle').textContent = V.title; $('sideLead').textContent = V.lead; $('sideNote').textContent = V.note || '';
    $('sideBody').scrollTop = 0;
    $('sideStats').innerHTML = (V.stats || []).map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('');
    $('qualitySlot').hidden = state.view === 'phase';
  }
  function renderViewLegend() {
    const grad = (stops) => `linear-gradient(90deg, ${stops.map((s) => `rgb(${s[1]},${s[2]},${s[3]}) ${((s[0] - stops[0][0]) / (stops[stops.length - 1][0] - stops[0][0])) * 100}%`).join(',')})`;
    const cycGrad = `linear-gradient(90deg, ${[0, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1].map((f) => `hsl(${cycHue(f)} 85% 55%) ${f * 100}%`).join(',')})`;
    const line = (style, label) => `<div class="lg-row"><i class="lg-line" style="${style}"></i>${label}</div>`;
    // longer explanations hide behind a small "i" button (click to open / close)
    const info = (text) => `<details class="lg-info"><summary title="Wyjaśnienie" aria-label="Wyjaśnienie">i</summary><p>${text}</p></details>`;
    const v = state.view, r = state.range, thr = S().threshold_mm;
    let h = '';
    if (v === 'phase') {
      h += `<div class="lg-title">Prążki interferometryczne ${info(`Kolor powtarza się co ${fmt(F.cycle_mm)} mm: liczba pierścieni od brzegu do środka niecki × ${fmt(F.cycle_mm)} mm = jej głębokość. Ruch w linii widzenia orbity wznoszącej, od ${dShort(F.ref_date)}.`)}</div>
        <span class="legend-bar" style="background:${cycGrad}"></span>
        <div class="legend-ticks"><span>0</span><span>jeden cykl barw = ${fmt(F.cycle_mm)} mm ruchu</span></div>`;
      h += line('border-top:2px solid #fff;box-shadow:0 0 0 1px #555', `kontur przemieszczenia co ${fmt(F.contour_step_mm)} mm (z etykietą)`);
      h += line(`border-top:6px solid ${RISK.wysokie};box-shadow:0 0 0 2px #141414`, 'zagrożony odcinek rurociągu (wysokie)');
      h += line(`border-top:5px solid ${RISK['średnie']};box-shadow:0 0 0 2px #141414`, 'zagrożony odcinek rurociągu (średnie)');
      h += line('border-top:1.5px solid #262626;box-shadow:0 0 0 1px rgba(255,255,255,.6)', 'linia przekroju (wzdłuż rurociągu i przez nieckę) – kliknij, żeby zobaczyć profil');
      h += '<div class="lg-row"><i class="lg-area" style="border:1.6px dashed #fff;background:transparent;box-shadow:0 0 0 1px #555"></i>strefa osiadania potwierdzona w obu orbitach</div>';
      h += '<div class="lg-row"><i class="lg-area" style="border:1px dashed var(--axis);background:transparent"></i>bez koloru = brak danych w wycinku (woda, utrata spójności)</div>';
    } else {
      h += `<div class="lg-title">Ruch gruntu od ${dShort(dates[state.ref])} ${info(`Ruch w linii widzenia orbity wznoszącej. Kolor tylko tam, gdzie ruch przekracza szum pomiaru (pełny kolor od ±${fmt(thr)} mm) i jakość sygnału jest wystarczająca. Przezroczyste = brak istotnego ruchu albo brak wiarygodnego pomiaru (woda, mokradła).`)}</div>
        <span class="legend-bar" style="background:${divGradient()}"></span>
        <div class="legend-ticks"><span>−${r} mm · osiadanie</span><span>wypiętrzanie · +${r} mm</span></div>`;
      h += line(`border-top:6px solid ${RISK.wysokie};box-shadow:0 0 0 3px #fff, 0 0 0 4px #888`, 'rurociąg – wysokie zagrożenie');
      h += line(`border-top:5px solid ${RISK['średnie']};box-shadow:0 0 0 3px #fff, 0 0 0 4px #888`, 'rurociąg – średnie zagrożenie');
      h += `<div class="lg-row"><i class="lg-dot" style="background:${RISK.wysokie}"></i><i class="lg-dot" style="background:${RISK['średnie']};margin-left:-4px"></i>zagrożony odcinek przy oddaleniu (przybliż, żeby zobaczyć przebieg)</div>`;
      if (v === 'risk') {
        h += line('border-top:1.5px solid #aab4be', 'pozostała sieć – niskie zagrożenie');
        h += line('border-top:1.5px dashed #aab4be;opacity:.6', 'sieć bez danych NISAR (mokradła, woda)');
      }
      h += `<div class="lg-row"><i class="lg-area"></i>strefa osiadania potwierdzona w obu orbitach</div>`;
      if (v === 'zones') h += `<div class="lg-row">${badge('subsidence')}pinezka: 20 stref o największym osiadaniu</div>
        <div class="lg-row"><span class="new-mark"></span>strefa wykryta po raz pierwszy w wybranym pomiarze (biały obrys / pierścień)</div>`;
    }
    $('legend').innerHTML = h; $('keys').innerHTML = '';
  }
  function viewNote() {
    if (state.view === 'phase') return F.band(state.t) < 0 ? `${dShort(dates[state.t])}: punkt odniesienia, jeszcze bez ruchu` : `prążki: ${dShort(F.ref_date)} → ${dShort(dates[state.t])}`;
    return state.t === state.ref ? 'początek okresu: zmiana = 0' : `zmiana od ${dPL(dates[state.ref])}`;
  }
  const show = (layer, on) => { if (!layer) return; if (on) layer.addTo(map); else layer.remove(); };
  function applyView(v, fit) {
    state.view = v;
    const phase = v === 'phase';
    show(overlay, !phase); show(zoneLayer, !phase);
    map.getContainer().classList.toggle('no-pins', v !== 'zones');
    show(vecLayers.pipes_all, v === 'risk'); show(vecLayers.pipes_risk, true); show(vecLayers.profiles, phase);
    if (F) { show(F.overlay, phase); show(F.contours, phase); show(F.zones, phase); }
    map.getContainer().classList.toggle('phase-view', phase);
    map.closePopup();
    if (fit) map.fitBounds(phase ? F.bounds : (DATA.config.view || G.bounds), padView(phase));
    renderSide(); renderLegend(); setDate(state.t, false);
  }

  // ---------------------------------------------------------- date / period
  function setDate(t, animate = true) {
    state.t = Math.max(S().start, Math.min(S().end, t));
    $('tlDate').textContent = dLong(dates[state.t]);
    $('prev').disabled = state.t <= S().start; $('next').disabled = state.t >= S().end;
    $('tlNote').textContent = VIEWS ? viewNote() : (state.mode === 'cum' ? (state.t === state.ref ? 'początek okresu: zmiana = 0' : `zmiana od ${dPL(dates[state.ref])}`) : '');
    if (VIEWS && state.view === 'phase') paintFocus(); else renderRaster(animate);
    renderContours(); renderTimeline(); renderZones(); refreshPointPopup();
    if (vecPopup.render && map.hasLayer(vecPopup)) vecPopup.setContent(vecPopup.render());
  }
  function setPeriod(s) {
    stop(); map.closePopup(); pointMarker.remove();
    state.s = s; state.t = SER[s].end; state.ref = SER[s].start;
    $('period').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.s === s));
    $('ref').innerHTML = seriesIdx().map((i) => `<option value="${i}">${dPL(dates[i])}${i === S().start ? ' (początek okresu)' : ''}</option>`).join('');
    zonesKey = ''; buildTimeline();
    if (VIEWS) applyView(state.view || VIEWS.default, true); else { renderLegend(); setDate(state.t); }
  }
  function stop() { clearInterval(state.timer); state.timer = null; setPlayIcon(false); }

  // --------------------------------------------------------------- wiring
  $('period').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setPeriod(+b.dataset.s); });
  $('play').addEventListener('click', () => {
    if (state.timer) return stop();
    if (state.t >= S().end) setDate(S().start);
    setPlayIcon(true);
    // A step every 950 ms: the 650 ms colour morph finishes and the frame holds briefly before the next one
    state.timer = setInterval(() => { if (state.t >= S().end) return stop(); setDate(state.t + 1); }, 950);
  });
  $('latest').addEventListener('click', () => { stop(); setDate(S().end); });
  $('prev').addEventListener('click', () => { stop(); setDate(state.t - 1); });
  $('next').addEventListener('click', () => { stop(); setDate(state.t + 1); });
  if (!R.vwin) $('mode').querySelector('[value="vwin"]').remove();
  $('mode').addEventListener('change', (e) => { state.mode = e.target.value; renderLegend(); setDate(state.t, false); });
  $('ref').addEventListener('change', (e) => { state.ref = +e.target.value; setDate(state.t); });
  $('range').addEventListener('change', (e) => { state.range = +e.target.value; renderLegend(); renderRaster(); });
  $('opacity').addEventListener('input', (e) => overlay.setOpacity(+e.target.value));
  $('coh').addEventListener('input', (e) => { state.cohMin = +e.target.value; $('cohVal').textContent = fmt(state.cohMin, 2); renderRaster(); });
  const toggle = (id, layer) => $(id).addEventListener('change', (e) => (e.target.checked ? layer.addTo(map) : layer.remove()));
  toggle('showZones', zoneLayer); toggle('showContours', contourLayer);
  document.addEventListener('click', (e) => { if (!$('adv').contains(e.target)) $('adv').open = false; });
  map.on('click', (e) => { if (!(VIEWS && state.view === 'phase')) selectPoint(e.latlng); });
  map.on('mousemove', (e) => {
    if (VIEWS && state.view === 'phase') {
      const v = focusValue(e.latlng);
      $('readout').innerHTML = v === undefined ? 'Poza wycinkiem analizy fazowej.' : v === null ? 'Brak danych w tym miejscu.'
        : `<b>${sgn(v, 0)} mm</b> od ${dShort(F.ref_date)} ${v < -S().threshold_mm / 3 ? '· grunt się obniża' : ''}`;
      return;
    }
    const i = pixelOf(e.latlng), v = i < 0 ? null : valueAt(i, 'cum');
    $('readout').innerHTML = v === null ? 'Brak pomiaru w tym miejscu.'
      : `<b>${sgn(v, 0)} mm</b> ${Math.abs(v) < S().threshold_mm ? 'bez istotnej zmiany' : v < 0 ? 'osuwanie lub osiadanie' : 'wypiętrzanie'}`;
  });
  map.on('mouseout', () => { $('readout').textContent = 'Najedź na mapę.'; });

  window.addEventListener('resize', () => { hideTip(); buildTimeline(); });

  // ---------------------------------------------------------------- start
  state.view = VIEWS ? VIEWS.default : null;
  setPeriod(state.s);
})();
</script>
</body>
</html>
