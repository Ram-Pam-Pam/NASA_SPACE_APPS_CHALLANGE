<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="si-disclosure" content="Code written with the help of Super Intelligence (SI) tools: Claude Code, Claude (Anthropic), ChatGPT (OpenAI). Measurements are real NISAR satellite data (NASA/ISRO), not SI-generated. See README.md and si_usage.json.">
<title>Corridor Watch · model 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C8F169'/%3E%3Cpath d='M4 21h9l3-3 3 3h9' fill='none' stroke='%230B0C0E' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Same dark theme tokens as index.html, so both views read as one product. */
:root {
  color-scheme: dark;
  --page: #0B0C0E; --surface: #15171A; --text: #F2F3F0; --text-2: #A2A6AC; --border: #2B2E33; --wash: rgba(242,243,240,0.06);
  --accent: #C8F169; --accent-ink: #0B0C0E; --alert: #ff6b4a;
  --font: "Inter", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  --label: 600 11.5px/1.3 var(--font);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
[hidden] { display: none !important; }
button, select, input { font: inherit; }
button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background .15s, border-color .15s; }
button:hover { background: #22252a; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
select { background: var(--page); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; max-width: 100%; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { flex: none; display: flex; gap: 8px 18px; align-items: center; flex-wrap: wrap; min-height: 52px; padding: 8px 20px; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.bar h1 { display: flex; align-items: baseline; gap: 10px; margin: 0; padding-left: 18px; border-left: 1px solid var(--border); font-size: 15px; font-weight: 600; line-height: 1.3; }
.bar h1::before { content: "Model 3D"; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.bar h1:empty { display: none; }
body.flat .bar h1::before { content: "Widok 2D"; }
.bar .sp { flex: 1; }
/* 2D / 3D switch in the header: the same location as a map with the analysis results or as a 3D model */
.dims { display: inline-flex; flex: none; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--page); }
.dims button { border: 0; border-radius: 0; padding: 6px 14px; background: transparent; color: var(--text); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
.dims button + button { border-left: 1px solid var(--border); }
.dims button:hover { background: var(--wash); }
.dims button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); cursor: default; }

.loc { display: flex; align-items: center; gap: 10px; min-width: 0; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }

/* Timeline of ground motion (2D view only): play it to see how the ground changed between the measurements. */
#timeline { flex: none; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 8px 20px; background: var(--surface); box-shadow: inset 0 -1px 0 var(--border); position: relative; z-index: 15; }
.tl-title { font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.tl-series-label { display: inline-flex; align-items: center; gap: 8px; font: var(--label); letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.tl-series-label select { max-width: 190px; padding: 7px 28px 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); color: var(--text); font-size: 13px; font-weight: 600; letter-spacing: normal; text-transform: none; }
.tl-step { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 10px; background: var(--page); }
.tl-step button, .tl-round { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: transparent; }
.tl-round { border: 1px solid var(--border); border-radius: 50%; background: var(--page); }
#tlPlay { width: 38px; height: 38px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tl-step svg, .tl-round svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#tlPlay svg { fill: currentColor; stroke: none; }
.tl-date { min-width: 104px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
#tlTrack { position: relative; flex: 1 1 320px; min-width: 220px; height: 38px; cursor: pointer; touch-action: none; }
#tlTrack::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 4px; border-radius: 2px; background: var(--border); }
#tlFill { position: absolute; left: 0; top: 13px; height: 4px; border-radius: 2px; background: var(--accent); }
.tl-tick { position: absolute; top: 11px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #5b6068; }
.tl-tick.on { background: var(--accent); }
.tl-lbl { position: absolute; top: 22px; transform: translateX(-50%); font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
#tlKnob { position: absolute; top: 7px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(200,241,105,.25); }
.tl-key { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--text-2); }
.tl-key b { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
@media (max-width: 720px) { .tl-key { flex-basis: 100%; } }

#stage { position: relative; flex: 1; min-height: 0; background: radial-gradient(ellipse at 50% 35%, #1d2733 0%, #0e1218 60%, #0B0C0E 100%); }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
#status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text-2); font-size: 15px; z-index: 5; }

/* Labels are HTML placed over the canvas every frame. */
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7); will-change: transform; }
.lbl.place { font-size: 14px; letter-spacing: .01em; }
.lbl.area { color: #ffc266; }
.lbl.biz { font-weight: 500; font-size: 11.5px; color: #e6e8ea; }
.lbl.hazard { padding: 3px 9px; border-radius: 999px; background: var(--haz-bg, rgba(255,107,74,.92)); color: var(--haz-ink, #1a0b06); text-shadow: none; font-size: 12.5px; box-shadow: var(--shadow); }
/* Main anomalies of the timeline (2D view): a numbered dot with a pulsing ring, red = sinking, blue = rising */
#marks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; }
.amark { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: auto; cursor: pointer; transition: opacity .4s; }
.amark .dot { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: #fff; font: 700 13px/1 var(--font); border: 2px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.55); }
.amark .ring { pointer-events: none; position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--c); animation: apulse 1.8s ease-out infinite; }
.amark .ring + .ring { animation-delay: .9s; }
.amark.off { opacity: 0; pointer-events: none; }
@keyframes apulse { from { transform: scale(1); opacity: .9; } to { transform: scale(3.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .amark .ring { animation: none; opacity: .5; transform: scale(1.6); } }
.lbl.road { padding: 1px 6px; border-radius: 4px; background: #f2f3f0; color: #15171A; text-shadow: none; font-size: 11px; font-weight: 700; }

.panel { position: absolute; z-index: 10; background: rgba(21,23,26,.9); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
#layers { top: 14px; left: 14px; width: 252px; max-height: calc(100% - 28px); overflow: auto; }
#layers summary { padding: 10px 14px; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
#layers summary::after { content: "▾"; }
#layers:not([open]) summary::after { content: "▸"; }
#layers .body { padding: 2px 14px 14px; display: grid; gap: 9px; }
.row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; cursor: pointer; }
.row .n { margin-left: auto; color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.row.off { color: var(--text-2); cursor: default; }
.sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
.lg-h { margin: 6px 0 0; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.keys { display: grid; gap: 5px; font-size: 12.5px; }
.keys span { display: flex; align-items: center; gap: 8px; }
.keys .sw { height: 5px; width: 20px; border-radius: 3px; }
.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--text-2); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; padding: 4px 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.goto { display: flex; flex-wrap: wrap; gap: 6px; }
.goto button { padding: 4px 10px; font-size: 12.5px; border-radius: 999px; }
/* Tabasco: ranking of the strongest subsidence under the pipelines instead of "go to" buttons */
.goto.rank { display: grid; gap: 4px; }
.goto.rank button { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; padding: 6px 8px; border-radius: 8px; text-align: left; font-size: 12px; }
.goto.rank b { font-weight: 700; color: var(--text-2); }
.goto.rank span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; word-break: break-word; }
.goto.rank em { font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

#nav { right: 14px; bottom: 14px; padding: 8px; display: grid; grid-template-columns: repeat(3, 38px); gap: 6px; }
#nav button { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
#nav button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#nav button.wide { grid-column: 1 / -1; width: auto; font-size: 12.5px; font-weight: 600; }
#compass { right: 14px; top: 14px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
#compass svg { width: 40px; height: 40px; }
#hint { left: 50%; top: 14px; transform: translateX(-50%); padding: 7px 14px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; pointer-events: none; transition: opacity .6s; }
#src { position: absolute; left: 14px; bottom: 10px; z-index: 9; max-width: calc(100% - 200px); font-size: 11px; line-height: 1.4; color: rgba(162,166,172,.85); pointer-events: none; }
/* Verification signal for a clicked object (results of the InSAR analysis) */
#verify { right: 14px; top: 80px; width: 340px; max-height: calc(100% - 200px); overflow: auto; padding: 14px 16px 14px; z-index: 12; }
body.flat #verify { top: 14px; max-height: calc(100% - 120px); }
#verify .vx { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 16px; line-height: 1; }
#verify h3 { margin: 0 30px 2px 0; font-size: 15px; font-weight: 600; }
#verify .vsub { margin: 0 0 10px; font-size: 12.5px; color: var(--text-2); }
.vsig { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--wash); border-left: 4px solid var(--sig); }
.vsig b { display: block; font-size: 14px; }
.vsig span { font-size: 12.5px; color: var(--text-2); }
.vgrid { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0 0; font-size: 12.5px; }
.vgrid dt { color: var(--text-2); }
.vgrid dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.vh { margin: 14px 0 6px; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.vtrend { font-size: 12.5px; line-height: 1.45; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); }
.vtrend b { font-weight: 600; }
.vnotes { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.45; color: var(--text-2); }
.vnotes li + li { margin-top: 4px; }
.vnext { font-size: 12.5px; line-height: 1.45; }
.vplain { margin: 10px 0 8px; font-size: 14px; line-height: 1.5; }
.vplain b { font-weight: 700; }
.vmore { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.vmore summary { cursor: pointer; font-size: 12.5px; color: var(--text-2); }
.vmore summary:hover { color: var(--text); }
.amark.sel .dot { width: 14px; height: 14px; left: -7px; top: -7px; background: var(--accent); border-color: #0B0C0E; }
.amark.sel .ring { width: 14px; height: 14px; left: -7px; top: -7px; border-color: var(--accent); }
#tip { position: fixed; z-index: 50; pointer-events: none; max-width: 300px; padding: 8px 11px; background: #15171A; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.45; display: none; }
#tip b { font-weight: 600; }
#tip .k { color: var(--text-2); }

/* Results of the analysis: summary block, phase-analysis switch of the timeline, contour labels, new anomalies */
.sum { margin-top: 2px; padding-top: 8px; border-top: 1px solid var(--border); }
.sum summary { cursor: pointer; font: var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.sum-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 6px; }
.sum-stats div { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--wash); }
.sum-stats b { display: block; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sum-stats span { font-size: 11.5px; line-height: 1.3; color: var(--text-2); }
.tl-mode { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--page); }
.tl-mode button { padding: 7px 12px; border: 0; border-radius: 0; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.tl-mode button + button { border-left: 1px solid var(--border); }
.tl-mode button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); cursor: default; }
.kg { display: contents; }
.kg[hidden] { display: none; }
.fringe-bar { display: inline-block; width: 110px; height: 10px; border-radius: 5px; margin-right: 6px; vertical-align: -1px; }
.lbl.contour { padding: 0 4px; border-radius: 3px; background: rgba(11,12,14,.72); font-size: 10.5px; text-shadow: none; }
.amark.fresh .dot { background: var(--accent); color: #0B0C0E; border-color: #0B0C0E; }
.amark.fresh .ring { border-color: var(--accent); }
.amark.gnss .dot { font-size: 12px; }
.tl-pipes { display: inline-flex; align-items: center; gap: 10px; }
.tl-pipes i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }

@media (max-width: 720px) {
  #layers { width: 210px; }
  #hint, #src { display: none; }
  .bar h1 { flex-basis: 100%; order: 1; padding-left: 0; border-left: 0; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>

<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#C8F169"/><path d="M4 12c4-5 8 3 12-1s8 3 12-1" fill="none" stroke="#2B2E33" stroke-width="2.2" stroke-linecap="round"/><path d="M4 21h9l3-3 3 3h9" fill="none" stroke="#0B0C0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Corridor Watch</span>
  </div>
  <h1 id="title"></h1>
  <span class="sp"></span>
  <div class="dims" id="dims" role="group" aria-label="Rodzaj widoku" hidden>
    <button id="dim2" aria-pressed="false" title="Widok z góry: płaska mapa tego samego modelu">2D</button>
    <button id="dim3" aria-pressed="false" title="Model 3D terenu i infrastruktury">3D</button>
  </div>
  <label class="loc">Lokalizacja
    <select id="loc" aria-label="Lokalizacja"></select>
  </label>
</header>

<div id="timeline" hidden>
  <span class="tl-title" id="tlTitle">Zmiana terenu</span>
  <div class="tl-mode" id="tlMode" role="group" aria-label="Rodzaj analizy" hidden>
    <button id="tlModeMove" aria-pressed="true" title="Skumulowana zmiana terenu w linii widzenia satelity">Zmiana terenu</button>
    <button id="tlModePhase" aria-pressed="false" title="Prążki interferometryczne i kontury przemieszczenia – szczegółowa analiza fazowa">Analiza fazowa</button>
  </div>
  <div class="tl-step">
    <button id="tlPrev" title="Poprzedni pomiar" aria-label="Poprzedni pomiar"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <span class="tl-date" id="tlDate"></span>
    <button id="tlNext" title="Następny pomiar" aria-label="Następny pomiar"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
  </div>
  <button class="tl-round" id="tlPlay" title="Odtwórz zmiany w czasie" aria-label="Odtwórz"></button>
  <div id="tlTrack" role="slider" tabindex="0" aria-label="Data pomiaru"><div id="tlFill"></div><div id="tlKnob"></div></div>
  <div class="tl-key"><span class="kg" id="tlKeyMove"><span title="Teren przesunął się od satelity: osiada albo osuwa się po zboczu"><b style="background:rgb(214,39,40)"></b>osiadanie / osuwanie</span><span title="Teren przesunął się w stronę satelity: podnosi się"><b style="background:rgb(31,104,196)"></b>wypiętrzanie</span><span id="tlAno" hidden><b style="background:#fff;border-radius:50%;box-shadow:0 0 0 2px rgb(214,39,40)"></b>główne anomalie</span></span><span class="kg" id="tlKeyPhase" hidden><span title="Jeden pełny cykl barw to jeden prążek: zmiana odległości do satelity o połowę długości fali"><i class="fringe-bar" id="tlFringeBar"></i><span id="tlFringeTxt"></span></span><span><b style="background:none;border:2px solid #fff"></b>kontury przemieszczenia</span></span><span id="tlThr"></span></div>
</div>

<div id="stage">
  <div id="status">Wczytywanie modelu 3D…</div>
  <div id="labels"></div>
  <div id="marks"></div>

  <details class="panel" id="layers" open hidden>
    <summary>Warstwy modelu</summary>
    <div class="body">
      <div id="sumWrap" hidden></div>
      <div id="toggles" style="display:grid;gap:9px"></div>
      <div id="exagWrap" hidden>
        <p class="lg-h">Przewyższenie terenu</p>
        <div class="seg" id="exag" role="group" aria-label="Przewyższenie terenu" style="margin-top:6px"></div>
        <p class="note" id="exagNote" style="margin-top:6px"></p>
      </div>
      <div id="pipeLegend" hidden>
        <p class="lg-h" id="pipeTitle">Rurociągi – co płynie</p>
        <div class="keys" id="pipeKeys" style="margin-top:6px"></div>
        <p class="note" id="pipeNote" style="margin-top:6px"></p>
      </div>
      <div id="gotoWrap" hidden>
        <p class="lg-h">Przejdź do</p>
        <div class="goto" id="goto" style="margin-top:6px"></div>
      </div>
    </div>
  </details>

  <button class="panel" id="compass" title="Ustaw północ u góry" aria-label="Kompas: ustaw północ u góry" hidden>
    <svg viewBox="0 0 40 40" aria-hidden="true"><g id="needle"><path d="M20 4l6 16H14z" fill="#ff6b4a"/><path d="M20 36l6-16H14z" fill="#A2A6AC"/><text x="20" y="16.5" text-anchor="middle" font-size="8" font-weight="700" fill="#15171A" font-family="Inter, sans-serif">N</text></g></svg>

// ---- retaining walls, cliffs and scarp edges: the map symbol of a slope edge - a line with short ticks
// pointing downhill (every line has its lower side on the right, the OSM rule). A wall also stands up in 3D.
if (slopes.length) {
  const slopeB = new Batch(flat(0xffffff, { vertexColors: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }));
  const wallB = new Batch(lit(0xffffff, { vertexColors: true }), true);
  const w = Math.sqrt(K);
  for (const f of slopes) {
    const p = f.properties, wall = p.kind === 'retaining_wall';
    const color = wall ? SLOPE_COLOR.wall : SLOPE_COLOR.edge, tick = wall ? SLOPE_COLOR.wallTick : SLOPE_COLOR.edgeTick;
    for (const coords of lines(f.geometry)) {
      const pts = dense(coords.map(toXZ), STEP / 2);
      if (pts.length < 2) continue;
      const tip = slopeTip(p);
      slopeB.add(ribbon(pts, (wall ? 1.6 : 2.4) * w, (t, x, z) => H(x, z) + 0.9), color, tip);
      const step = (wall ? 6 : 14) * w, len = (wall ? 3 : 9) * w;
      for (const [x, z, h] of walk(pts, step, step / 2)) {  // ticks to the right = downhill
        const nx = -Math.sin(h), nz = Math.cos(h), seg = dense([[x, z], [x + nx * len, z + nz * len]], STEP / 2);
        slopeB.add(ribbon(seg, (wall ? 0.7 : 1.1) * w, (t, sx, sz) => H(sx, sz) + 0.9), tick, tip);

          const [ax, az] = pts[i - 1], [bx, bz] = pts[i], ay = H(ax, az), by = H(bx, bz);
          pos.push(ax, ay, az, bx, by, bz, bx, by + hm, bz, ax, ay, az, bx, by + hm, bz, ax, ay + hm, az);

  addBatch('slopes', wallB);
}

// ---- buildings from footprints (small areas): walls from the outline, pitched roof on small ones
const WALLS = [0xece5d3, 0xdcd0bb, 0xcdd6da, 0xe8d5c2, 0xc3ccd0, 0xf2ecdb], ROOFS = [0x8f4b3a, 0x5d646b, 0x75594a, 0x414c57, 0x9b6b50];
const bldB = new Batch(new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: true }), true);
buildings.forEach((f, i) => {
  const p = f.properties, rand = rng(i * 7919 + 13), h = p.height || 4;
  for (const rings of polygons(f.geometry)) {
    const foot = rings[0].slice(0, -1).map((c) => { const [x, z] = toXZ(c); return [x, -z]; });
    if (foot.length < 3) continue;
    const small = (p.area_m2 || 100) < 450, wall = small ? WALLS[Math.floor(rand() * WALLS.length)] : 0xcfd3d6, roofCol = small ? ROOFS[Math.floor(rand() * ROOFS.length)] : 0xaab0b5;
    const base = foot.reduce((sum, [x, north]) => sum + H(x, -north), 0) / foot.length, sunk = FLAT ? 0 : 4;  // walls continue below ground on slopes
    const tip = p.name ? `<b>${esc(p.name)}</b>${tipRow('Powierzchnia', p.area_m2 ? p.area_m2 + ' m²' : '')}` : null;
    const body = lay(new THREE.ExtrudeGeometry(shapeOf(rings), { depth: (FLAT ? 0.6 : h) + sunk, bevelEnabled: false })).translate(0, base - sunk, 0);
    bldB.add(body, wall, tip, { count: body.groups[0] ? body.groups[0].count : 0, color: roofCol });
    if (!small || FLAT) continue;  // a flat map shows the roof colour on the footprint
    const r = boundingRect(foot), ux = Math.cos(r.ang), uy = Math.sin(r.ang), over = 0.5, rise = Math.min(3.2, r.b * 0.75);
    const at = (su, sv, y) => [r.cx + ux * su * r.a - uy * sv * (r.b + over), y, -(r.cy + uy * su * r.a + ux * sv * (r.b + over))];
    const E = (su, sv) => at(su, sv, base + h), Rg = (su) => at(su, 0, base + h + rise);
    const tri = [E(1, 1), E(-1, 1), Rg(-1), E(1, 1), Rg(-1), Rg(1), E(1, -1), Rg(1), Rg(-1), E(1, -1), Rg(-1), E(-1, -1), E(1, 1), Rg(1), E(1, -1), E(-1, 1), E(-1, -1), Rg(-1)];
    const geo = new THREE.BufferGeometry();

    bldB.add(geo, roofCol, tip);

});

// ---- buildings from footprints (a whole city): real outlines, roof colour from the aerial photo, pitched
// roofs on small houses. Merged per area chunk (so the camera can skip chunks it does not see).
if (FP) {
  const { n, start, X, Z, height, pitched, roof, tris, triStart, chunkOf, CH } = FP;
  const members = Array.from({ length: CH * CH }, () => []);
  for (let i = 0; i < n; i++) members[chunkOf[i]].push(i);
  const wallCols = WALLS.map((h) => new THREE.Color(h)), bigWall = [0xd5d7d6, 0xc9cccd, 0xdcd6cb, 0xbfc5c9].map((h) => new THREE.Color(h));
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide });
  const sunk = FLAT ? 0 : 4;
  for (const ids of members) {
    if (!ids.length) continue;
    let nv = 0, ni = 0;
    for (const i of ids) {
      const k = start[i + 1] - start[i], gable = pitched[i] && !FLAT;
      nv += 2 * k + (gable ? 6 : k); ni += 6 * k + (gable ? 18 : triStart[i + 1] - triStart[i]);
    }
    const pos = new Float32Array(nv * 3), col = new Float32Array(nv * 3), idx = new Uint32Array(ni);
    let v = 0, q = 0;
    const put = (x, y, z, cr) => { pos[v * 3] = x; pos[v * 3 + 1] = y; pos[v * 3 + 2] = z; col[v * 3] = cr.r; col[v * 3 + 1] = cr.g; col[v * 3 + 2] = cr.b; return v++; };
    const wc = new THREE.Color(), rc = new THREE.Color();
    for (const i of ids) {
      const s0 = start[i], k = start[i + 1] - s0, rand = rng(i * 7919 + 13);
      let base = 0;
      for (let j = 0; j < k; j++) base += H(X[s0 + j], Z[s0 + j]);
      base /= k;
      const h = FLAT ? 0.6 : height[i], top = base + h, gable = pitched[i] && !FLAT;
      rc.setRGB(roof[i * 3], roof[i * 3 + 1], roof[i * 3 + 2]).multiplyScalar(1.08);
      wc.copy(pitched[i] ? wallCols[Math.floor(rand() * wallCols.length)] : bigWall[Math.floor(rand() * bigWall.length)]);
      // walls: bottom ring + top ring, two triangles per edge
      const b0 = v;
      for (let j = 0; j < k; j++) put(X[s0 + j], base - sunk, Z[s0 + j], wc);
      for (let j = 0; j < k; j++) put(X[s0 + j], top, Z[s0 + j], wc);
      for (let j = 0; j < k; j++) {
        const a = b0 + j, b = b0 + (j + 1) % k, ta = a + k, tb = b + k;
        idx.set([a, b, tb, a, tb, ta], q); q += 6;
      }
      if (!gable) {  // flat roof in the photo's roof colour
        const r0 = v;
        for (let j = 0; j < k; j++) put(X[s0 + j], top + 0.05, Z[s0 + j], rc);
        for (let t = triStart[i]; t < triStart[i + 1]; t++) idx[q++] = r0 + tris[t];
        continue;
      }
      // pitched roof over the footprint's smallest rectangle, with a small overhang
      const foot = [];
      for (let j = 0; j < k; j++) foot.push([X[s0 + j], -Z[s0 + j]]);
      const r = boundingRect(foot), ux = Math.cos(r.ang), uy = Math.sin(r.ang), over = 0.5, rise = Math.min(3.2, r.b * 0.75);
      const at = (su, sv, y) => put(r.cx + ux * su * r.a - uy * sv * (r.b + over), y, -(r.cy + uy * su * r.a + ux * sv * (r.b + over)), rc);
      const e11 = at(1, 1, top), e01 = at(-1, 1, top), e10 = at(1, -1, top), e00 = at(-1, -1, top), r1 = at(1, 0, top + rise), r0 = at(-1, 0, top + rise);
      idx.set([e11, e01, r0, e11, r0, r1, e10, r1, r0, e10, r0, e00, e11, r1, e10, e01, e00, r0], q); q += 18;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeBoundingSphere();
    group('buildings').add(new THREE.Mesh(geo, mat));
  }
}

// ---- buildings as oriented boxes (older city packages): one instanced mesh for walls, one per roof type
if (bldBuf) {
  const n = META.buildings_bin.count, u16 = new Uint16Array(bldBuf, 0, 4 * n), u8 = new Uint8Array(bldBuf, 8 * n, 3 * n);
  let small = 0;
  for (let i = 0; i < n; i++) if (!u8[2 * n + i]) small++;
  const mat = () => new THREE.MeshLambertMaterial({ flatShading: true, side: THREE.DoubleSide });
  const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat(), n);
  const gables = new THREE.InstancedMesh(gableGeometry(), mat(), small), slabs = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat(), n - small);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), v = new THREE.Vector3(), sc = new THREE.Vector3(), col = new THREE.Color(), rand = rng(11);
  const wallCols = WALLS.map((c) => new THREE.Color(c)), roofCols = ROOFS.map((c) => new THREE.Color(c)), bigWall = new THREE.Color(0xcfd3d6), bigRoof = new THREE.Color(0xaab0b5);
  let ig = 0, is = 0;

    const h = FLAT ? 0.6 : u8[n + i] / 2, flatRoof = u8[2 * n + i], base = H(x, z);
    q.setFromAxisAngle(up, (u8[i] / 255) * Math.PI);
    walls.setMatrixAt(i, m.compose(v.set(x, base + (h - sunk) / 2, z), q, sc.set(len, h + sunk, wid)));
    walls.setColorAt(i, flatRoof ? bigWall : wallCols[Math.floor(rand() * wallCols.length)]);
    if (flatRoof) { slabs.setMatrixAt(is, m.compose(v.set(x, base + h + 0.2, z), q, sc.set(len + 0.4, 0.4, wid + 0.4))); slabs.setColorAt(is++, bigRoof); }
    else { gables.setMatrixAt(ig, m.compose(v.set(x, base + h, z), q, sc.set(len, FLAT ? 0.05 : Math.min(3.2, wid * 0.38), FLAT ? wid : wid + 1))); gables.setColorAt(ig++, col.copy(roofCols[Math.floor(rand() * roofCols.length)])); }
  }

// ---- trees: two low-poly crown shapes, coloured from the aerial photo. In chunks (TREE_CH x TREE_CH):
// the camera draws only the chunks in view, and none farther than TREE_FAR, where a crown is under a pixel.
treeChunks.length = 0;
if (treeBuf) {
  const n = META.trees.count, u16 = new Uint16Array(treeBuf, 0, 2 * n), u8 = new Uint8Array(treeBuf, 4 * n, 5 * n);
  const kinds = [new THREE.IcosahedronGeometry(1, 0), new THREE.ConeGeometry(1, 2, 6, 1)], count = new Uint32Array(TREE_CH * TREE_CH * 2);
  const chunkOf = (i) => Math.min(TREE_CH - 1, Math.floor(u16[n + i] / 65536 * TREE_CH)) * TREE_CH + Math.min(TREE_CH - 1, Math.floor(u16[i] / 65536 * TREE_CH));

    setColorAt: (i, k, c) => slots[chunkOf(i) * 2 + k].setColorAt(fill[chunkOf(i) * 2 + k]++, c) };
  const seaElev = T && T.sea_level_m != null && terrainGrid ? T.sea_level_m - T.min_m : null;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), col = new THREE.Color(), rand = rng(7);
  for (let i = 0; i < n; i++) {
    const k = u8[4 * n + i] ? 1 : 0, h = u8[i] / 10, x = (u16[i] / 65535 - 0.5) * SX, z = (u16[n + i] / 65535 - 0.5) * SZ;
    const wet = seaElev != null && elevAt(x, z) <= seaElev + 0.4;  // kelp near the shore looks like canopy in the photo

    else m.compose(new THREE.Vector3(x, H(x, z) + h - half, z), q.setFromAxisAngle(up, rand() * Math.PI * 2), new THREE.Vector3(rad, half, rad));

    'brak danych': ['#98a3ab', 'Brak wiarygodnego pomiaru', 'Za mało dobrych pikseli (np. woda, utrata spójności).'],
  };
  const KIND = { building: 'Budynek', road: 'Droga', rail: 'Tory kolejowe', pipe: 'Rurociąg / gazociąg', power: 'Linia energetyczna', ground: 'Teren' };

  async function show(kind, x, z, label) {
    $('verify').hidden = false;
    $('vBody').innerHTML = '<p class="vsub">Wczytywanie wyników analizy…</p>';
    await load();
    forced = null;
    const [lon, lat] = toLonLat(x, z), D = data;
    let S = current();
    if (S) D.meta.dates = S.dates;  // the chart, trend and texts follow the chosen orbit
    const isRail = (p) => String(p.typ).startsWith('kolej'), isPower = (p) => p.typ === 'linia energetyczna';
    const hit = kind === 'building' ? nearest(D.bld, x, z, 12)
      : kind === 'pipe' ? nearest(D.pipes, x, z, 120) : kind === 'power' ? nearest(D.crit, x, z, 45, isPower)
      : kind === 'rail' ? nearest(D.crit, x, z, 35, isRail) : kind === 'road' ? nearest(D.roads, x, z, 25)
      : kind === 'slope' ? nearest(D.slopes, x, z, 30)
      : nearest(D.bld, x, z, 0);
    const p = hit?.p, isSlope = kind === 'slope' && p, isWall = isSlope && p.kind === 'retaining_wall';
    // a wall or scarp carries the series of its strongest point (read along the whole line)
    let series = isSlope ? (p.series_mm || null) : await seriesAt(lon, lat);
    if (!series && S) for (const other of D.meta.series.filter((o) => o !== S)) {  // no pixel in this orbit: the other one
      forced = other;
      series = await seriesAt(lon, lat);
      if (series) { S = other; D.meta.dates = S.dates; break; }
      forced = null;
    }
    // not listed: the building and road layers list only exposed objects (plus context near the active zone)
    let cls = p?.klasa, note = '';
    if (!p) {
      if ((kind === 'building' || kind === 'road') && series) { cls = 'niskie'; note = `${kind === 'building' ? 'Budynku' : 'Drogi'} nie ma na liście narażonych w wynikach – grunt w granicach szumu.`; }
      else if (kind === 'ground') cls = null;
      else note = kind === 'building' || kind === 'road' ? 'Obiektu nie ma na liście narażonych, a szczegółowa seria pomiarów nie obejmuje tego miejsca.' : 'Tego miejsca nie udało się dopasować do obiektu w wynikach.';
    }
    const GENERIC = ['rurociąg', 'linia energetyczna', 'kabel energetyczny', 'stacja elektroenergetyczna', 'tory kolejowe', 'droga', 'budynek'];
    const name = p?.nazwa || p?.name || (label && !GENERIC.includes(label.toLowerCase()) && !Object.values(SLOPE_KIND).includes(label) ? label : '');
    const sig = cls && SIGNAL[cls];
    const tr = series ? trend(series) : null;
    const rows = p ? [
      ['Tempo ruchu gruntu (LOS)', p.v != null ? signed(Math.round(p.v), 'mm/rok') : null],
      ['Przemieszczenie w okresie', p.przem_mm != null ? signed(Math.round(p.przem_mm), 'mm') : null],
      ['Ruch zróżnicowany', p.gradient != null ? `${fmt(p.gradient)} mm/100 m${S ? ' (w okresie)' : '/rok'}` : null],
      ['Od strefy aktywnej', p.odl_m != null ? (p.odl_m === 0 ? 'w strefie' : `${fmt(p.odl_m >= 1000 ? p.odl_m / 1000 : p.odl_m, p.odl_m >= 1000 ? 1 : 0)} ${p.odl_m >= 1000 ? 'km' : 'm'}`) : null],
      ['Okna monitoringu z ruchem', p.okna_ruch != null ? `${p.okna_ruch} z ${p.okna_n ?? 10}${p.okna_ruch >= 2 ? ' (ruch potwierdzony w czasie)' : ''}` : null],
      ['Pewność danych', p.pewnosc || null],
    ].filter(([, v]) => v) : [];
    if (!p && series) rows.push(['Przemieszczenie w okolicy (LOS)', signed(series.filter((v) => v !== null).at(-1), 'mm')]);
    if (isSlope) rows.push(...[
      ['Przemieszczenie w okresie (LOS)', p.motion_mm != null ? signed(p.motion_mm, 'mm') + ' (najsilniejszy punkt)' : 'poza zasięgiem pomiaru'],
      ['Wysokość skarpy', p.relief_m ? `ok. ${p.relief_m} m` : null], ['Nachylenie', p.slope_deg ? `ok. ${p.slope_deg}°` : null],
      ['Materiał', p.material ? p.material.split(';').map((m) => MATERIAL_PL[m] || m).join(', ') : null],
      ['Długość', p.length_m ? `${fmt(p.length_m)} m` : null], ['Punkty pomiaru wzdłuż', p.samples || null],
      ['Źródło obiektu', p.kind === 'scarp' ? 'wyznaczona z lidaru USGS 3DEP' : 'OpenStreetMap'],
    ].filter(([, v]) => v));
    if (p?.typ && kind !== 'building') rows.unshift(['Rodzaj w wynikach', `${p.typ}${p.podtyp && p.podtyp !== '?' ? ' (' + p.podtyp + ')' : ''}`]);
    const period = `${dLong(D.meta.dates[0])} – ${dLong(D.meta.dates.at(-1))}`;
    // ---- plain-language summary first; the technical details stay one click away
    const total = series ? series.filter((v) => v !== null).at(-1) : p?.przem_mm != null ? p.przem_mm : p?.v != null ? Math.round(p.v * 180 / 365.25) : null;
    let level = cls;
    const TH = S?.thresholds;  // the orbit's 3 / 4 sigma (PB: 20 / 50 mm)
    if (!level && series) level = Math.abs(total) >= (TH?.przem_high_mm ?? 50) ? 'wysokie' : Math.abs(total) >= (TH?.przem_med_mm ?? 20) ? 'średnie' : 'niskie';
    const WHERE = { building: 'pod tym budynkiem', road: 'pod tą drogą', rail: 'pod tymi torami', pipe: 'nad tym rurociągiem', power: 'pod tą linią', ground: 'w tym miejscu',
      slope: isWall ? 'przy tym murze' : 'na tej skarpie' }[kind];
    const OF = { building: 'budynku', road: 'drogi', rail: 'torów', pipe: 'rurociągu', power: 'linii', slope: isWall ? 'muru' : p?.kind === 'cliff' ? 'klifu' : 'skarpy' }[kind];
    const PLAIN = {
      wysokie: ['#c62a22', `Grunt ${WHERE} wyraźnie się przesuwa`, 'Warto to sprawdzić na miejscu.'],
      'średnie': ['#e3871f', `Grunt ${WHERE} lekko się przesuwa`, 'Warto to sprawdzić i obserwować.'],
      niskie: ['#2f8f57', `Grunt ${WHERE} jest spokojny`, 'Satelita nie widzi tu istotnego ruchu.'],
      'brak danych': ['#98a3ab', 'Satelita nie zmierzył tu ruchu', 'Nie wiadomo, czy grunt się rusza.'],
    }[level] || ['#5b6068', 'Brak dokładnego pomiaru w tym miejscu', 'Nie wiadomo, czy grunt się rusza.'];
    const cm = (mm) => (Math.abs(mm) >= 10 ? `${(Math.abs(mm) / 10).toLocaleString('pl-PL', { maximumFractionDigits: 0 })} cm` : `${Math.abs(Math.round(mm))} mm`);
    const moved = total != null && Math.abs(total) >= 20
      ? `${span().from} ${total < 0 ? 'obniżył się lub zsunął' : 'podniósł się lub przesunął'} o ok. <b>${cm(total)}</b>.`
      : total != null ? `${span().from} prawie się nie ruszył.` : '';
    const active = level === 'wysokie' || level === 'średnie';
    const uneven = isSlope ? (level === 'wysokie' ? (isWall ? 'Mur trzyma zbocze, które się przesuwa – warto obejrzeć, czy nie pęka i nie przechyla się.'
      : 'Grunt przesuwa się przy krawędzi stromego zbocza – to może znaczyć, że zbocze się obsuwa.') : '')
      : /gradient|zróżnicowany/.test(p?.powod || '') && active && kind !== 'ground'
        ? 'Sąsiednie fragmenty gruntu przesuwają się różnie, a to może naprężać obiekt.' : '';
    const steady = { steady: `Ruch trwał przez cały okres (${span().months === 6 ? 'pół roku' : `ok. ${span().months} mies.`}) – to raczej stały ruch, nie jednorazowy.`, uneven: 'Ruch był głównie w części okresu – może to skutek pory deszczowej.',
      reversal: 'Grunt raz szedł w jedną, raz w drugą stronę – może to pora roku albo niedokładność pomiaru.' }[tr?.kind] || '';
    $('vBody').innerHTML = `
      <h3>${esc((isSlope ? SLOPE_KIND[p.kind] : KIND[kind]) || 'Obiekt')}${name ? ' · ' + esc(name) : ''}</h3>
      <div class="vsig" style="--sig:${PLAIN[0]};margin-top:8px"><div><b>${PLAIN[1]}</b><span>${PLAIN[2]}</span></div></div>
      ${moved || steady || uneven ? `<p class="vplain">${[moved, uneven, steady].filter(Boolean).join(' ')}</p>` : ''}
      ${series ? sparkline(series) : ''}
      <p class="vsub" style="margin:6px 0 0">Pomiar z satelity, ${esc(period)}. ${S ? ` Orbita ${esc(S.label)}.` : ''} Pokazuje ruch gruntu${OF ? `, a nie stan ${OF}` : ''}.</p>
      <details class="vmore"><summary>Szczegóły dla specjalistów</summary>
      ${sig ? `<p class="vsub" style="margin:8px 0 0">Klasa w wynikach: <b>${esc(cls)}</b> – ${esc(sig[1].toLowerCase())}.</p>` : ''}
      ${note ? `<p class="vsub" style="margin:6px 0 0">${esc(note)}</p>` : ''}
      ${p?.powod ? `<p class="vsub" style="margin:6px 0 0">Uzasadnienie z analizy: ${esc(p.powod)}</p>` : ''}
      ${rows.length ? `<dl class="vgrid">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
      ${series ? `<p class="vh">Czy to trwały ruch?</p><p class="vsub" style="margin:0 0 6px">${isSlope ? 'Wykres: ten z punktów co ok. 50 m wzdłuż obiektu, który ruszył się najbardziej' : `Wykres: piksel (${S ? 80 : 100} m), który w promieniu ok. ${S ? 120 : 150} m ruszył się najbardziej`}; szare pole = ±${lim()} mm.</p><div class="vtrend">${tr.html}${p?.okna_ruch != null ? `<br>Okna monitoringu z ruchem: ${p.okna_ruch} z ${p.okna_n ?? 10}${p.okna_ruch >= 2 ? ' – ruch powtarza się w czasie.' : ' – ruch nie powtarza się w kolejnych oknach.'}` : ''}</div>` : ''}
      <p class="vh">Jak czytać ten wynik</p>
      <ul class="vnotes">
        <li>Klasa opisuje <b>ruch gruntu pod obiektem</b>, nie stan jego konstrukcji.</li>
        <li>${D.meta.los_note ? esc(D.meta.los_note) : 'Radar mierzy ruch <b>wzdłuż linii widzenia satelity</b> (LOS, z zachodu, ok. 40° od pionu). Nie podaje pełnego kierunku ani samego ruchu pionowego; ujemne = od satelity.'}</li>
        <li>Tempo to zmiana z <b>ok. ${span().months} miesięcy</b> przeliczona na rok. ${D.meta.season_note ? esc(D.meta.season_note) : 'Okres obejmuje porę deszczową, więc może zawierać wpływ sezonowy.'}</li>
      </ul>
      ${level === 'wysokie' || level === 'średnie' ? `<p class="vh">Co sprawdzić</p><p class="vnext">Oględziny na miejscu (pęknięcia, przechyły, nieszczelności), porównanie z pomiarem naziemnym (GNSS, niwelacja) i z wynikiem z drugiej ${S ? `orbity (${esc(D.meta.series.filter((o) => o !== S).map((o) => o.label).join(', '))})` : 'geometrii orbity (wznoszącej)'}.</p>` : ''}
      </details>`;
    selected = new THREE.Vector3(x, H(x, z), z);
    selEl.classList.remove('off');
    dirty = true;
  }

  // the clicked spot gets a small pulsing marker
  const selEl = document.createElement('div');
  selEl.className = 'amark sel off';
  selEl.innerHTML = '<span class="ring"></span><span class="dot"></span>';
  selEl.style.pointerEvents = 'none';
  $('marks').appendChild(selEl);
  let selected = null;
  $('vClose').addEventListener('click', () => { $('verify').hidden = true; selEl.classList.add('off'); selected = null; });

  const GROUPS = [['buildings', 'building'], ['slopes', 'slope'], ['pipes', 'pipe'], ['power', 'power'], ['rail', 'rail'], ['roads', 'road']];
  const clickRay = new THREE.Raycaster();
  return {
    preload: () => load(),
    click(ev) {
      const box = renderer.domElement.getBoundingClientRect();
      mouse.set(((ev.clientX - box.left) / box.width) * 2 - 1, -((ev.clientY - box.top) / box.height) * 2 + 1);
      clickRay.setFromCamera(mouse, camera);
      const ground = groundDistance(clickRay.ray);
      let best = null;
      for (const [g, kind] of GROUPS) {
        if (!groups[g] || !groups[g].visible) continue;
        const h = clickRay.intersectObjects(groups[g].children, false)[0];
        if (h && h.distance <= ground + 2 + h.distance * 0.004 && (!best || h.distance < best.h.distance)) best = { h, kind };
      }
      let point, kind = 'ground', label = '';
      if (best) {
        point = best.h.point; kind = best.kind;
        const o = best.h.object, html = o.userData.tipAt ? o.userData.tipAt(best.h.faceIndex) : o.userData.tip;
        label = html ? html.replace(/<br>.*$/s, '').replace(/<[^>]+>/g, '').split(' · ')[0] : '';
      } else if (Number.isFinite(ground)) point = clickRay.ray.at(ground, new THREE.Vector3());
      else return;
      if (!best && data) {
        // thin lines are hard to hit: take the nearest line object within ~10 screen pixels
        const mPerPx = (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * ground) / box.height, r = Math.max(8, 10 * mPerPx);
        const cand = [
          ['slope', groups.slopes?.visible ? nearest(data.slopes, point.x, point.z, r) : null],
          ['pipe', nearest(data.pipes, point.x, point.z, r)],
          ['power', nearest(data.crit, point.x, point.z, r, (q) => q.typ === 'linia energetyczna')],
          ['rail', nearest(data.crit, point.x, point.z, r, (q) => String(q.typ).startsWith('kolej'))],
          ['road', nearest(data.roads, point.x, point.z, r)],
        ].filter(([, h]) => h).sort((a, b) => a[1].d - b[1].d)[0];
        if (cand) kind = cand[0];
      }
      show(kind, point.x, point.z, label);
    },
    place(w, h) {
      if (!selected) return;
      selected.y = H(selected.x, selected.z);
      v3.copy(selected).project(camera);
      selEl.style.transform = `translate(${((v3.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v3.y) / 2 * h).toFixed(1)}px)`;
    },
  };
})();

// ------------------------------------------- results of the analysis: pipeline classes, section profiles, GNSS station
// Click a pipeline segment (class, reason, history of the ground under it), a section line (profile of the motion
// along it, date by date) or the GNSS station (reference measurement compared with the satellite).
const extras = (RISK_MODE || EXTRAS) && (() => {
  const MONTHS = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];
  const dLong = (d) => `${+d.slice(6, 8)} ${MONTHS[+d.slice(4, 6) - 1]} ${d.slice(0, 4)}`;
  const num = (v, d = 0) => (v == null ? '–' : (+v).toLocaleString('pl-PL', { maximumFractionDigits: d, minimumFractionDigits: 0 }));
  const signed = (v, unit, d = 0) => (v == null ? '–' : `${v > 0 ? '+' : v < 0 ? '−' : ''}${num(Math.abs(v), d)} ${unit}`);
  const dates = TL?.dates || [];
  const noise = TL?.noise_mm ?? 17;
  const CLS = {
    wysokie: ['#e03131', 'Grunt pod rurociągiem wyraźnie osiada', 'Priorytet weryfikacji w terenie.'],
    'średnie': ['#f08c00', 'Grunt pod rurociągiem osiada umiarkowanie', 'Do weryfikacji i dalszej obserwacji.'],
    niskie: ['#c2a24a', 'Grunt pod rurociągiem jest raczej spokojny', 'Satelita nie widzi tu istotnego ruchu.'],
    'brak danych': ['#8a96a3', 'Satelita nie zmierzył tu ruchu', 'Mokradła, woda lub utrata spójności radaru – nie wiadomo, czy grunt się rusza.'],
  };

  // ---- a small SVG line chart (axes, grid, shaded bands, vertical marks, several lines)
  const nice = (v) => { const e = 10 ** Math.floor(Math.log10(v)), f = v / e; return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * e; };
  const ticksOf = (lo, hi, n = 4) => { const st = nice((hi - lo) / n), out = []; for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) out.push(+v.toFixed(6)); return out; };
  function chart(o) {
    const W = 316, Hh = o.h || 150, L = 50, Rr = 10, T0 = 10, B = 24, px = (v) => L + ((v - o.x0) / (o.x1 - o.x0)) * (W - L - Rr), py = (v) => T0 + ((o.y1 - v) / (o.y1 - o.y0)) * (Hh - T0 - B);
    const path = (xs, ys) => { let d = '', pen = false; xs.forEach((x, i) => { if (ys[i] == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${px(x).toFixed(1)},${py(ys[i]).toFixed(1)}`; pen = true; }); return d; };
    return `<svg viewBox="0 0 ${W} ${Hh}" style="display:block;width:100%;height:auto;margin-top:6px" role="img" aria-label="${esc(o.label)}" font-family="Inter, sans-serif">
      ${(o.shade || []).map(([a, b]) => `<rect x="${px(a).toFixed(1)}" y="${T0}" width="${(px(b) - px(a)).toFixed(1)}" height="${Hh - T0 - B}" fill="rgba(200,241,105,.13)"/>`).join('')}
      ${o.band ? `<rect x="${L}" y="${py(o.band).toFixed(1)}" width="${W - L - Rr}" height="${(py(-o.band) - py(o.band)).toFixed(1)}" fill="rgba(242,243,240,.08)"/>` : ''}
      ${ticksOf(o.y0, o.y1).map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${py(v).toFixed(1)}" y2="${py(v).toFixed(1)}" stroke="${v === 0 ? '#4a4e55' : '#2B2E33'}"/><text x="${L - 6}" y="${(py(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#A2A6AC">${o.yFmt(v)}</text>`).join('')}
      ${(o.xTicks || []).map(([v, t]) => `<text x="${px(v).toFixed(1)}" y="${Hh - 6}" text-anchor="${v <= o.x0 ? 'start' : v >= o.x1 ? 'end' : 'middle'}" font-size="10" fill="#A2A6AC">${t}</text>`).join('')}
      ${(o.vlines || []).map(([v, c]) => `<line x1="${px(v).toFixed(1)}" x2="${px(v).toFixed(1)}" y1="${T0}" y2="${Hh - B}" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3"/>`).join('')}
      ${o.lines.map((l) => `<path d="${path(o.xs, l.ys)}" fill="none" stroke="${l.color}" stroke-width="${l.w || 2}" opacity="${l.op ?? 1}" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}

  }
  const rangeOf = (arrs, pad = 0.12) => {
    const v = arrs.flat().filter((q) => q != null), lo = Math.min(0, ...v), hi = Math.max(0, ...v), p = (hi - lo || 20) * pad;

  };
  const mmFmt = (v) => (Math.abs(v) < 1e-6 ? '0' : `${v > 0 ? '+' : '−'}${Math.abs(v)} mm`);

  // ---- panel
  const selEl = document.createElement('div');
  selEl.className = 'amark sel off';
  selEl.innerHTML = '<span class="ring"></span><span class="dot"></span>';
  selEl.style.pointerEvents = 'none';
  $('marks').appendChild(selEl);
  let selected = null;
  function open(html, x, z) {
    $('verify').hidden = false;
    $('vBody').innerHTML = html;
    $('verify').scrollTop = 0;
    if (x != null) { selected = new THREE.Vector3(x, H(x, z), z); selEl.classList.remove('off'); } else { selected = null; selEl.classList.add('off'); }
    dirty = true;
  }
  $('vClose').addEventListener('click', () => { $('verify').hidden = true; selEl.classList.add('off'); selected = null; });

  function showPipe(f, x, z) {
    const p = f.properties, cls = p.risk || 'brak danych', [col, head, sub] = CLS[cls] || CLS['brak danych'];
    const v = p.v, rate = v == null ? '' : Math.abs(v) >= 100 ? `${num(Math.abs(v) / 10)} cm/rok` : `${num(Math.abs(v))} mm/rok`;
    const moves = v == null ? '' : Math.abs(v) < 20 ? 'Grunt prawie się nie rusza.' : `Pionowo grunt ${v < 0 ? 'osiada' : 'podnosi się'} w tempie ok. <b>${rate}</b>.`;
    const uneven = p.gradient >= 40 ? 'Sąsiednie fragmenty gruntu przesuwają się różnie, a to może naprężać rurę.' : '';
    const series = p.series_mm, rows = [
      ['Zagrożenie', cls], ['Medium', p.medium], ['Średnica', p.diameter_in ? p.diameter_in + '″' : null], ['Status', p.status],
      ['Ruch pionowy', v != null ? signed(v, 'mm/rok') : null], ['Ruch zróżnicowany', p.gradient != null ? `${num(p.gradient)} mm/100 m/rok` : null],
      ['Od strefy osiadania', p.dist_m != null ? (p.dist_m === 0 ? 'w strefie' : p.dist_m >= 1000 ? `${num(p.dist_m / 1000, 1)} km` : `${num(p.dist_m)} m`) : null],
      ['Okna z ruchem', p.windows != null ? String(p.windows) : null], ['Pewność danych', p.confidence],
    ].filter(([, q]) => q);
    let svg = '';
    if (series?.length > 1) {
      const [lo, hi] = rangeOf([series, [-noise * 1.3, noise * 1.3]]), end = series.at(-1), c = end < -noise ? 'rgb(214,39,40)' : end > noise ? 'rgb(31,104,196)' : '#A2A6AC';
      svg = chart({ label: 'Przemieszczenie gruntu w czasie', x0: 0, x1: series.length - 1, y0: lo, y1: hi, xs: series.map((_, i) => i), band: noise, yFmt: mmFmt,

    const k = Math.min(1, (now - flight.t0) / flight.ms), e = ease(k), { from, to } = flight, mix = THREE.MathUtils.lerp;
    place({ az: mix(from.az, to.az, e), polar: mix(from.polar, to.polar, e), dist: mix(from.dist, to.dist, e), target: from.target.clone().lerp(to.target, e) });
    if (k >= 1) flight = null;
    dirty = true;
  } else controls.update();  // damping and auto-rotation; fires 'change' when the camera moved
  if (timeline && timeline.tick(now)) dirty = true;
  if (detailTiles) detailTiles.update(now);
  if (dirty && treeChunks.length) updateTreeChunks();
  if (hoverAt && now - hoverTime > (BIG ? 90 : 0)) pick();
  if (!dirty) return;
  dirty = false;
  $('needle').setAttribute('transform', `rotate(${THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()).toFixed(1)} 20 20)`);
  renderer.render(scene, camera);
  placeLabels();
  if (timeline) timeline.place(stage.clientWidth, stage.clientHeight);
  if (verify) verify.place(stage.clientWidth, stage.clientHeight);
  if (extras) extras.place(stage.clientWidth, stage.clientHeight);
}
$('status').hidden = true;
['layers', 'nav', 'compass', 'hint'].forEach((id) => { $(id).hidden = false; });
$('dim3').setAttribute('aria-pressed', 'true');
if (FLAT) setMode(true, false);
window.__scene3d = { detailTiles: () => detailTiles && detailTiles.count(), scene, camera, controls, flyTo, place, viewNow, groups, renderer, toXZ: (lon, lat) => toXZ([lon, lat]), H, groundDistance };  // handy in the browser console
requestAnimationFrame(frame);
</script>
