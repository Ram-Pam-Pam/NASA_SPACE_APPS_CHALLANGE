<style id="leaflet-css">/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,

	}
.leaflet-tile,
.leaflet-marker-icon,

	   -moz-user-select: none;
	        user-select: none;

	}

}

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

}

/* control positioning */

.leaflet-control {

<style>
/* Układ: nagłówek z prawdziwymi prążkami interferometrycznymi, pod nim mapa + panel analiz, niżej krótka opowieść.
   Kolory danych (czerwony = od satelity, niebieski = do satelity, klasy ryzyka) są osobne od akcentu interfejsu. */
:root {
  --bg: #f4f6f7; --surface: #ffffff; --surface-2: #eef2f4; --fg: #14212b; --muted: #576672; --line: #d5dde2;
  --accent: #0b7480; --accent-fg: #ffffff; --sea: #d7e3ea; --road: #7d8a95;
  --risk-high: #c62a22; --risk-med: #e3871f; --risk-low: #2f8f57; --risk-na: #98a3ab;
  --away: #b2182b; --toward: #2166ac; --newzone: #7b3294; --relief-filter: none; --shadow: 0 1px 2px rgba(20, 33, 43, .08);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141a; --surface: #141d25; --surface-2: #1a252e; --fg: #e3eaf0; --muted: #94a3af; --line: #26333d;
    --accent: #3fbfc9; --accent-fg: #062a2e; --sea: #0a1922; --road: #6b7a86;
    --risk-high: #ef5a4f; --risk-med: #f2a33f; --risk-low: #4fbf7d; --risk-na: #6f7b85;
    --away: #e05a63; --toward: #5b9be0; --newzone: #b382dc; --relief-filter: brightness(.55) contrast(1.1); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141a; --surface: #141d25; --surface-2: #1a252e; --fg: #e3eaf0; --muted: #94a3af; --line: #26333d;
  --accent: #3fbfc9; --accent-fg: #062a2e; --sea: #0a1922; --road: #6b7a86;
  --risk-high: #ef5a4f; --risk-med: #f2a33f; --risk-low: #4fbf7d; --risk-na: #6f7b85;
  --away: #e05a63; --toward: #5b9be0; --newzone: #b382dc; --relief-filter: brightness(.55) contrast(1.1); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 4.6vw, 3.4rem); line-height: 1.02; font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.eyebrow { font: 500 .72rem/1.2 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mono, .num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- nagłówek */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; }
.brand { font: 500 .8rem var(--f-data); color: var(--muted); letter-spacing: .04em; }
.langs { display: flex; gap: 4px; }
.langs button { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: 500 .78rem var(--f-data); }
.langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 12px 28px; }
.hero-text { display: grid; gap: 16px; min-width: 0; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 60ch; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); margin-top: 6px; }
.stat { padding: 12px 14px 4px 0; display: grid; gap: 2px; align-content: start; }

.stat b { font: 600 1.6rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.fringe-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.fringe-card canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; background: var(--sea); display: block; image-rendering: auto; }
.fringe-meta { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: .78rem; color: var(--muted); }

.ghost { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: .78rem; }
.cycle { height: 8px; border-radius: 4px; background: linear-gradient(90deg, hsl(0 75% 52%), hsl(60 75% 52%), hsl(120 75% 52%), hsl(180 75% 52%), hsl(240 75% 52%), hsl(300 75% 52%), hsl(360 75% 52%)); }

/* --- aplikacja */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding-block: 8px 40px; align-items: start; }
.mapcol { display: grid; gap: 10px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: .85rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
#map { height: 600px; border-radius: 10px; border: 1px solid var(--line); background: var(--sea); }
.timebar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 16px; height: 16px; fill: currentColor; }
.timebar input[type=range] { width: 100%; accent-color: var(--accent); }
.datebox { text-align: right; min-width: 9.5rem; }
.datebox .mono { font-size: .95rem; display: block; }
.badge { display: inline-block; font: 500 .68rem var(--f-data); letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.badge.warn { background: color-mix(in srgb, var(--risk-med) 22%, transparent); color: var(--fg); }
.legendrow { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-start; font-size: .8rem; color: var(--muted); }
.ramp { display: grid; gap: 3px; min-width: 220px; flex: 1 1 220px; max-width: 360px; }
.ramp .bar { height: 10px; border-radius: 3px; }
.ramp .ticks { display: flex; justify-content: space-between; font-family: var(--f-data); font-size: .72rem; }
.layers { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.layers label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
.layers input { accent-color: var(--accent); }
.key { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.key i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 4px; }
.key i.rail { border-top-style: dashed; }
.key i.power { border-top-style: dotted; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 11px 4px; cursor: pointer; font-size: .82rem; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabpanel { padding: 14px; display: grid; gap: 12px; min-width: 0; }
.chartbox { position: relative; height: 230px; }
.note { font-size: .8rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: .85rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: .78rem; }
.chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.risk { display: inline-block; font: 600 .7rem var(--f-data); padding: 2px 7px; border-radius: 4px; color: #fff; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.risk[data-k="wysokie"] { background: var(--risk-high); }

.risk[data-k="niskie"] { background: var(--risk-low); }
.risk[data-k="brak danych"] { background: var(--risk-na); }
.objlist { display: grid; gap: 0; max-height: 300px; overflow: auto; border-top: 1px solid var(--line); }
.objlist button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 8px 2px; cursor: pointer; }
.objlist button:hover { background: var(--surface-2); }
.objlist .t { min-width: 0; }
.objlist .t b { display: block; font-weight: 500; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.objlist .t small { color: var(--muted); font-size: .75rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.objlist .d { font: .75rem var(--f-data); color: var(--muted); text-align: right; }

/* popup i kontrolki Leaflet w motywie strony */
.leaflet-container { font: 13px/1.45 var(--f-body); background: var(--sea); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--fg); box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
.leaflet-popup-content { margin: 12px 14px; min-width: 220px; }
.leaflet-popup-content h3 { font-size: .95rem; margin-bottom: 6px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--fg); border-bottom-color: var(--line); }

.relief-img { filter: var(--relief-filter); }
.leaflet-tooltip.plabel { background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: none; font: 500 11px var(--f-data); padding: 1px 5px; }
.leaflet-tooltip.plabel::before { display: none; }
.leaflet-tooltip.place { background: transparent; border: 0; box-shadow: none; color: var(--fg); font: 600 11px var(--f-display); text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); padding: 0; }
.leaflet-tooltip.place::before { display: none; }

/* --- opowieść */
.story { border-top: 1px solid var(--line); padding-block: 36px 48px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 48px; }
.story section { display: grid; gap: 10px; align-content: start; min-width: 0; }
.story p, .story li { max-width: 64ch; color: var(--fg); }
.story ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.story .muted { color: var(--muted); }
.geom { width: 100%; max-width: 420px; height: auto; }
.geom text { font: 11px var(--f-data); fill: var(--muted); }
footer { border-top: 1px solid var(--line); padding-block: 20px 36px; font-size: .78rem; color: var(--muted); display: grid; gap: 6px; }

@media (max-width: 1080px) {
  .app { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 820px) {

  .story { grid-template-columns: minmax(0, 1fr); }

}
@media (max-width: 480px) {

}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

  function seriesAt(latlng) {

    if (alertChart) alertChart.destroy();
    alertChart = new Chart($("#chart-alerts"), { type: "bar",
      data: { labels: windows.map(winLabel), datasets: defs.map(([k, c, lab]) => ({ label: t(lab), data: windows.map((w) => w[k]), _c: c, backgroundColor: windows.map(() => c), borderWidth: 0 })) },
      options: { animation: false, maintainAspectRatio: false,
        onClick: (ev, els) => { if (!els.length) return; winSel = els[0].index; showAlerts(); const end = windows[winSel].data.replaceAll("-", ""); const e = meta.dates.indexOf(end); if (e >= 0) setEpoch(e); },
        scales: { x: { stacked: true, ticks: { color: ac.text, maxRotation: 60 }, grid: { display: false } }, y: { stacked: true, title: { display: true, text: "km²", color: ac.text }, ticks: { color: ac.text }, grid: { color: ac.grid } } },
        plugins: { legend: { position: "bottom", labels: { color: ac.text, boxWidth: 10 } } } } });
    showAlerts();
  }

  // ---------------------------------------------------------------- zakładki
  const tabs = { point: "#pn-point", prof: "#pn-prof", infra: "#pn-infra", alerts: "#pn-alerts" };
  function showTab(k) {
    Object.entries(tabs).forEach(([n, sel]) => { $(sel).hidden = n !== k; $(`#tab-${n}`).setAttribute("aria-selected", String(n === k)); });
    if (k === "alerts") { alertLayer.addTo(map); } else { map.removeLayer(alertLayer); }
    [pointChart, profChart, infraChart, alertChart].forEach((c) => c && c.resize());
  }
  Object.keys(tabs).forEach((k) => $(`#tab-${k}`).addEventListener("click", () => showTab(k)));

  // ---------------------------------------------------------------- język i motyw
  function applyLang() {
    document.documentElement.lang = LANG;
    document.title = t("title");
    const P = { h: num(meta.half_wavelength_mm, 1), n: num(E - 1), d0: fmtDate(meta.dates[0]), d1: fmtDate(meta.dates[E - 1]),
      b: num(B.liczba_budynkow || 0) };
    $$("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n, P); });
    $("#lang-pl").setAttribute("aria-pressed", String(LANG === "pl")); $("#lang-en").setAttribute("aria-pressed", String(LANG === "en"));
    renderStats(); renderLegend(); setEpoch(cur); renderProfChips(); renderObjList();
    rebuildCharts();
    drawFringe(fringeE);
  }
  function rebuildCharts() {
    [pointChart, profChart].forEach((c) => c && c.destroy());
    makePointChart(); makeProfChart(); makeInfraChart(); makeAlertChart();
    if (pointMarker) selectPoint(pointMarker.getLatLng(), false);
  }
  ["pl", "en"].forEach((l) => $(`#lang-${l}`).addEventListener("click", () => { LANG = l; try { localStorage.setItem("pb-lang", l); } catch (e) { /* bez pamięci */ } applyLang(); }));
  const onTheme = () => { restyle(); renderLegend(); rebuildCharts(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------------------------------------------------------------- start
  map.on("click", (e) => selectPoint(e.latlng, true));
  $("#fringe-replay").addEventListener("click", playFringe);
  applyLang();
  selectPoint(L.latLng(meta.core.lat, meta.core.lon), false);
  playFringe();
})().catch((err) => {
  const p = document.createElement("p");
  p.className = "wrap note";
  p.textContent = "Nie udało się wczytać danych strony (" + err.message + "). Sprawdź, czy folder data/ leży obok index.html i czy strona jest otwierana przez serwer (nie jako plik).";
  document.body.prepend(p);
});
</script>

</body>
</html>
